lic; }\r\n\r\n    /* Wind Popup */\r\n    .wind-popup { width: 320px; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #1e293b; background: #fff; overflow: hidden; }\r\n    .wind-popup-head { padding: 12px 14px; color: #fff; background: linear-gradient(135deg, #0ea5e9, #0369a1); }\r\n    .wind-popup-head strong { display: block; font-size: 14px; line-height: 1.25; }\r\n    .wind-popup-head span { display: block; margin-top: 2px; font-size: 11px; opacity: .92; }\r\n    .wind-popup-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 600; background: rgba(255,255,255,.18); padding: 3px 8px; border-radius: 20px; margin-bottom: 6px; }\r\n    .wind-popup-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #38bdf8; animation: pulse-dot 1.5s ease-in-out infinite; }\r\n    .wind-popup-body { padding: 0; }\r\n    .wind-popup-meta { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; }\r\n    .wind-popup-meta div { display: flex; justify-content: space-between; align-items: center; }\r\n    .wind-popup-meta span { font-size: 12px; color: #64748b; }\r\n    .wind-popup-meta b { font-size: 12px; color: #1e293b; font-weight: 600; }\r\n    .wind-popup-card { display: flex; align-items: center; gap: 14px; padding: 14px; border-bottom: 1px solid #f1f5f9; }\r\n    .wind-popup-compass { position: relative; width: 56px; height: 56px; flex-shrink: 0; }\r\n    .wind-popup-compass-ring { width: 56px; height: 56px; border-radius: 50%; border: 2px solid #cbd5e1; display: grid; place-items: center; position: relative; background: #fff; }\r\n    .wind-popup-compass-arrow { display: block; width: 3px; height: 22px; background: linear-gradient(to bottom, #0ea5e9 50%, #ef4444 50%); border-radius: 2px; transform-origin: bottom center; position: absolute; bottom: 50%; left: calc(50% - 1.5px); }\r\n    .wind-popup-compass-label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 9px; color: #64748b; white-space: nowrap; font-weight: 600; }\r\n    .wind-popup-wind-info { display: flex; flex-direction: column; gap: 2px; }\r\n    .wind-popup-speed { display: flex; align-items: baseline; gap: 4px; }\r\n    .wind-popup-speed-val { font-size: 28px; font-weight: 800; line-height: 1; }\r\n    .wind-popup-speed-unit { font-size: 12px; color: #64748b; font-weight: 500; }\r\n    .wind-popup-cat { font-size: 12px; font-weight: 600; color: #334155; }\r\n    .wind-popup-beaufort { font-size: 10px; color: #94a3b8; }\r\n    .wind-popup-detail-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; padding: 0; }\r\n    .wind-popup-detail { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-bottom: 1px solid #f1f5f9; }\r\n    .wind-popup-detail span { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: .3px; }\r\n    .wind-popup-detail b { font-size: 12px; color: #1e293b; font-weight: 600; }\r\n    .wind-popup-fallback { padding: 14px; text-align: center; font-size: 12px; color: #64748b; line-height: 1.5; }\r\n    .wind-popup-fallback small { font-size: 10px; color: #94a3b8; }\r\n    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }\r\n\r\n    /* Maritime Legend */\r\n    .maritime-legend { background: rgba(255,255,255,.95); border-radius: 8px; padding: 10px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); border: 1px solid #e2e8f0; min-width: 200px; max-width: 200px; }\r\n    .maritime-legend-title { font-size: 10px; font-weight: 700; color: #0e7490; margin-bottom: 6px; }\r\n    .maritime-legend-row { display: flex; align-items: center; gap: 5px; font-size: 9px; color: #475569; padding: 2px 0; }\r\n    .maritime-legend-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.1); }\r\n    .maritime-legend-source { font-size: 8px; color: #94a3b8; margin-top: 6px; font-style: italic; }\r\n\r\n    /* Maritime Popup - cuaca grid */\r\n    .wind-popup-cuaca { padding: 10px 14px; border-top: 1px solid #f1f5f9; }\r\n    .wind-popup-cuaca-title { font-size: 10px; font-weight: 700; color: #0e7490; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .3px; }\r\n    .wind-popup-cuaca-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }\r\n    .wind-popup-cuaca-item { display: flex; flex-direction: column; gap: 1px; padding: 6px 8px; background: #f0fdfa; border-radius: 6px; border: 1px solid #ccfbf1; }\r\n    .wind-popup-cuaca-item span { font-size: 9px; color: #64748b; }\r\n    .wind-popup-cuaca-item b { font-size: 11px; color: #1e293b; font-weight: 600; }\r\n    .wind-popup-footer { padding: 8px 14px; border-top: 1px solid #f1f5f9; }\r\n    .wind-popup-footer span { font-size: 9px; color: #94a3b8; }\r\n\r\n    /* Earthquake Marker */\r\n    .quake-marker-wrap { background: transparent; border: 0; }\r\n    .quake-marker {\r\n      position: relative;\r\n      width: var(--qm-size, 48px);\r\n      height: var(--qm-size, 48px);\r\n      display: grid;\r\n      place-items: center;\r\n    }\r\n    .quake-marker-ring {\r\n      position: absolute;\r\n      inset: 0;\r\n      border-radius: 50%;\r\n      border: 2px solid var(--qm-color, #e74c3c);\r\n      opacity: 0;\r\n      animation: quake-pulse 2s ease-out infinite;\r\n    }\r\n    .quake-marker-ring--delay { animation-delay: .6s; }\r\n    @keyframes quake-pulse {\r\n      0% { transform: scale(.6); opacity: .7; }\r\n      100% { transform: scale(1.8); opacity: 0; }\r\n    }\r\n    .quake-marker-core {\r\n      position: relative;\r\n      z-index: 1;\r\n      width: 100%;\r\n      height: 100%;\r\n      border-radius: 50%;\r\n      background: var(--qm-color, #e74c3c);\r\n      box-shadow: 0 4px 14px color-mix(in srgb, var(--qm-color, #e74c3c) 50%, transparent);\r\n      display: grid;\r\n      place-items: center;\r\n      border: 3px solid rgba(255,255,255,.85);\r\n    }\r\n    .quake-marker-mag {\r\n      color: #fff;\r\n      font-size: calc(var(--qm-size, 48px) * 0.28);\r\n      font-weight: 800;\r\n      line-height: 1;\r\n      text-shadow: 0 1px 3px rgba(0,0,0,.25);\r\n    }\r\n\r\n    /* Earthquake Popup */\r\n    .quake-leaflet-popup .leaflet-popup-content-wrapper { overflow: hidden; padding: 0; border-radius: 16px; box-shadow: 0 18px 45px rgba(16, 43, 80, .28); }\r\n    .quake-leaflet-popup .leaflet-popup-content { width: auto !important; margin: 0; }\r\n    /* Modern BMKG Earthquake Popup */\r\n    .quake-leaflet-popup { max-width: 320px !important; }\r\n    .quake-leaflet-popup .leaflet-popup-content-wrapper { border-radius: 16px; padding: 0; overflow: hidden; box-shadow: 0 8px 32px rgba(153, 27, 27, .2); border: none; }\r\n    .agol-leaflet-popup { max-width: 320px !important; }\r\n    .agol-leaflet-popup .leaflet-popup-content-wrapper { border-radius: 10px; padding: 0; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.18); border: none; }\r\n    .agol-leaflet-popup .leaflet-popup-content { width: auto !important; margin: 0; }\r\n    .agol-leaflet-popup .leaflet-popup-tip { box-shadow: 0 4px 20px rgba(0,0,0,.18); }\r\n    .quake-leaflet-popup .leaflet-popup-content { margin: 0; width: 100% !important; }\r\n    .quake-leaflet-popup .leaflet-popup-tip-container { left: 50% !important; margin-left: -14px !important; }\r\n    .quake-leaflet-popup .leaflet-popup-tip { box-shadow: 4px 4px 12px rgba(153, 27, 27, .2); }\r\n\r\n    .quake-popup { width: 320px; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #1a2e44; background: #fff; overflow: hidden; max-height: 50vh; overflow-y: auto; }\r\n\r\n    .quake-popup-header {\r\n      position: relative;\r\n      padding: 20px 18px 16px;\r\n      color: #fff;\r\n      background: linear-gradient(135deg, #991b1b 0%, #dc2626 50%, #ef4444 100%);\r\n      overflow: hidden;\r\n    }\r\n    .quake-popup-header::before {\r\n      content: '';\r\n      position: absolute;\r\n      top: -40px; right: -40px;\r\n      width: 120px; height: 120px;\r\n      background: rgba(255,255,255,.08);\r\n      border-radius: 50%;\r\n    }\r\n    .quake-popup-header::after {\r\n      content: '';\r\n      position: absolute;\r\n      bottom: -30px; left: -20px;\r\n      width: 80px; height: 80px;\r\n      background: rgba(255,255,255,.05);\r\n      border-radius: 50%;\r\n    }\r\n\r\n    .quake-popup-status {\r\n      display: inline-flex;\r\n      align-items: center;\r\n      gap: 6px;\r\n      padding: 4px 10px;\r\n      border-radius: 20px;\r\n      font-size: 10px;\r\n      font-weight: 700;\r\n      letter-spacing: .06em;\r\n      text-transform: uppercase;\r\n      background: rgba(255,255,255,.2);\r\n      color: #fff;\r\n      margin-bottom: 12px;\r\n      backdrop-filter: blur(4px);\r\n    }\r\n    .quake-popup-status-dot {\r\n      width: 7px; height: 7px;\r\n      border-radius: 50%;\r\n      background: #fca5a5;\r\n      animation: quake-pulse 1.5s infinite;\r\n    }\r\n    @keyframes quake-pulse {\r\n      0%, 100% { opacity: 1; transform: scale(1); }\r\n      50% { opacity: .5; transform: scale(1.2); }\r\n    }\r\n\r\n    .quake-popup-title {\r\n      font-size: 13px;\r\n      font-weight: 600;\r\n      opacity: .9;\r\n      margin-bottom: 4px;\r\n      position: relative;\r\n      z-index: 1;\r\n      text-shadow: 0 1px 2px rgba(0,0,0,.1);\r\n    }\r\n    .quake-popup-region {\r\n      font-size: 15px;\r\n      font-weight: 700;\r\n      line-height: 1.3;\r\n      position: relative;\r\n      z-index: 1;\r\n      text-shadow: 0 1px 2px rgba(0,0,0,.1);\r\n    }\r\n\r\n    .quake-popup-mag-display {\r\n      display: flex;\r\n      align-items: center;\r\n      gap: 14px;\r\n      padding: 14px 18px;\r\n      background: linear-gradient(180deg, #fef2f2 0%, #fff 100%);\r\n      border-bottom: 1px solid #fecaca;\r\n    }\r\n    .quake-popup-mag-circle {\r\n      width: 64px; height: 64px;\r\n      border-radius: 50%;\r\n      display: flex;\r\n      flex-direction: column;\r\n      align-items: center;\r\n      justify-content: center;\r\n      color: #fff;\r\n      font-weight: 800;\r\n      flex-shrink: 0;\r\n      box-shadow: 0 4px 14px rgba(220, 38, 38, .35);\r\n      position: relative;\r\n    }\r\n    .quake-popup-mag-circle::after {\r\n      content: '';\r\n      position: absolute;\r\n      inset: -3px;\r\n      border-radius: 50%;\r\n      border: 2px solid rgba(255,255,255,.3);\r\n    }\r\n    .quake-popup-mag-num { font-size: 22px; line-height: 1; }\r\n    .quake-popup-mag-label { font-size: 9px; font-weight: 600; opacity: .8; margin-top: 1px; }\r\n\r\n    .quake-popup-mag-info { flex: 1; min-width: 0; }\r\n    .quake-popup-potensi {\r\n      font-size: 13px;\r\n      font-weight: 700;\r\n      color: #b91c1c;\r\n      margin-bottom: 3px;\r\n    }\r\n    .quake-popup-time {\r\n      font-size: 11px;\r\n      color: #b91c1c;\r\n      line-height: 1.4;\r\n    }\r\n\r\n    .quake-popup-details {\r\n      padding: 14px 18px;\r\n      display: grid;\r\n      grid-template-columns: 1fr 1fr;\r\n      gap: 12px;\r\n    }\r\n    .quake-popup-detail-item {\r\n      display: flex;\r\n      flex-direction: column;\r\n      gap: 3px;\r\n    }\r\n    .quake-popup-detail-label {\r\n      font-size: 10px;\r\n      font-weight: 600;\r\n      color: #dc2626;\r\n      text-transform: uppercase;\r\n      letter-spacing: .05em;\r\n    }\r\n    .quake-popup-detail-value {\r\n      font-size: 13px;\r\n      font-weight: 600;\r\n      color: #7f1d1d;\r\n      word-break: break-word;\r\n    }\r\n\r\n    .quake-popup-feeling {\r\n      padding: 12px 18px 14px;\r\n      background: #fef2f2;\r\n      border-top: 1px solid #fecaca;\r\n    }\r\n    .quake-popup-feeling-title {\r\n      font-size: 10px;\r\n      font-weight: 700;\r\n      color: #b91c1c;\r\n      text-transform: uppercase;\r\n      letter-spacing: .05em;\r\n      margin-bottom: 6px;\r\n    }\r\n    .quake-popup-feeling-text {\r\n      font-size: 12px;\r\n      color: #991b1b;\r\n      line-height: 1.5;\r\n    }\r\n\r\n    .quake-popup-footer {\r\n      padding: 10px 18px;\r\n      background: #fef2f2;\r\n      border-top: 1px solid #fecaca;\r\n      text-align: center;\r\n    }\r\n    .quake-popup-footer-text {\r\n      font-size: 10px;\r\n      color: #991b1b;\r\n      font-weight: 600;\r\n    }\r\n\r\n    /* ── Modern ArcGIS Online-style popup ── */\r\n    .agol-popup {\r\n      width: 320px;\r\n      font-family: 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;\r\n      color: #323232;\r\n      background: #fff;\r\n      border-radius: 8px;\r\n      overflow: hidden;\r\n      max-height: 50vh;\r\n      overflow-y: auto;\r\n      box-shadow: 0 4px 20px rgba(0,0,0,.18);\r\n      border: none;\r\n    }\r\n    .agol-popup-header {\r\n      position: relative;\r\n      padding: 14px 16px 12px;\r\n      color: #fff;\r\n      overflow: hidden;\r\n    }\r\n/* Tampon fallback: header popup tanpa background eksplisit akan\r\n   menjadi putih di atas putih karena .agol-popup-header hanya\r\n   mengatur color:#fff. Warna_MODULE ini dipakai modul yang punya\r\n   warna sendiri (TransJakarta memakai warna koridor). */\r\n    .agol-popup-header.agol-modul { background: linear-gradient(135deg, #1e293b, #334155); }\r\n    .agol-popup-header::after {\r\n      content: '';\r\n      position: absolute;\r\n      top: -30px; right: -30px;\r\n      width: 80px; height: 80px;\r\n      background: rgba(255,255,255,.1);\r\n      border-radius: 50%;\r\n    }\r\n    .agol-popup-badge {\r\n      display: inline-flex;\r\n      align-items: center;\r\n      gap: 5px;\r\n      padding: 3px 9px;\r\n      border-radius: 4px;\r\n      font-size: 9.5px;\r\n      font-weight: 700;\r\n      letter-spacing: .04em;\r\n      text-transform: uppercase;\r\n      background: rgba(255,255,255,.2);\r\n      color: #fff;\r\n      backdrop-filter: blur(4px);\r\n      margin-bottom: 8px;\r\n    }\r\n    .agol-popup-badge-dot {\r\n      width: 6px; height: 6px;\r\n      border-radius: 50%;\r\n      background: #fff;\r\n      flex-shrink: 0;\r\n    }\r\n    .agol-popup-title {\r\n      font-size: 14px;\r\n      font-weight: 700;\r\n      line-height: 1.3;\r\n      position: relative;\r\n      z-index: 1;\r\n      text-shadow: 0 1px 3px rgba(0,0,0,.12);\r\n    }\r\n/* Titik warna di dalam judul popup. .agol-popup-badge-dot dirancang\r\n       untuk flex di dalam .agol-popup-badge; di dalam .agol-popup-title\r\n       elemennya inline, jadi butuh display eksplisit sendiri. */\r\n    .agol-popup-title .agol-popup-badge-dot {\r\n      display: inline-block;\r\n      margin-right: 7px;\r\n      vertical-align: middle;\r\n      width: 9px;\r\n      height: 9px;\r\n    }\r\n    /* Tanpa ini .agol-popup-badge-dot mewarisi display dari div judul\r\n       dan jadi blok penuh, sehingga menyingkirkan nama koridor. */\r\n    .agol-popup-subtitle {\r\n      font-size: 11px;\r\n      font-weight: 500;\r\n      opacity: .85;\r\n      margin-top: 2px;\r\n      position: relative;\r\n      z-index: 1;\r\n    }\r\n    .agol-popup-body {\r\n      padding: 12px 16px;\r\n    }\r\n    .agol-popup-meta {\r\n      font-size: 10px;\r\n      color: #999;\r\n      margin-bottom: 10px;\r\n      padding-bottom: 8px;\r\n      border-bottom: 1px solid #f0f0f0;\r\n    }\r\n    .agol-popup-fields {\r\n      display: flex;\r\n      flex-direction: column;\r\n      gap: 0;\r\n    }\r\n    .agol-popup-field {\r\n      display: flex;\r\n      justify-content: space-between;\r\n      align-items: flex-start;\r\n      padding: 7px 0;\r\n      border-bottom: 1px solid #f5f5f5;\r\n      gap: 12px;\r\n    }\r\n    .agol-popup-field:last-child {\r\n      border-bottom: none;\r\n    }\r\n    .agol-popup-field-label {\r\n      font-size: 10.5px;\r\n      font-weight: 600;\r\n      color: #6e6e6e;\r\n      text-transform: uppercase;\r\n      letter-spacing: .03em;\r\n      flex-shrink: 0;\r\n      min-width: 80px;\r\n    }\r\n    .agol-popup-field-value {\r\n      font-size: 12px;\r\n      font-weight: 600;\r\n      color: #323232;\r\n      text-align: right;\r\n      word-break: break-word;\r\n    }\r\n    .agol-popup-remark {\r\n      margin-top: 8px;\r\n      padding: 8px 10px;\r\n      background: #f8f9fa;\r\n      border-radius: 6px;\r\n      border-left: 3px solid #d1d5db;\r\n    }\r\n    .agol-popup-remark-title {\r\n      font-size: 9px;\r\n      font-weight: 700;\r\n      color: #999;\r\n      text-transform: uppercase;\r\n      letter-spacing: .04em;\r\n      margin-bottom: 3px;\r\n    }\r\n    .agol-popup-remark-text {\r\n      font-size: 11px;\r\n      color: #555;\r\n      line-height: 1.45;\r\n    }\r\n    .agol-popup-footer {\r\n      padding: 8px 16px;\r\n      background: #fafafa;\r\n      border-top: 1px solid #f0f0f0;\r\n      text-align: center;\r\n    }\r\n    .agol-popup-footer span {\r\n      font-size: 9.5px;\r\n      color: #aaa;\r\n      font-weight: 500;\r\n    }\r\n    /* Gempa NTT styles removed */\r\n    /* geologi colors */\r\n    .agol-geo-patahan  { background: linear-gradient(135deg, #7f1d1d, #991b1b); }\r\n    .agol-geo-geostruktur { background: linear-gradient(135deg, #1e3a5f, #2563eb); }\r\n    .agol-geo-geologi  { background: linear-gradient(135deg, #065f46, #059669); }\r\n    .agol-geo-likuifaksi { background: linear-gradient(135deg, #7c2d12, #ea580c); }\r\n    .agol-geo-karst    { background: linear-gradient(135deg, #5b4636, #9e7462); }\r\n    .agol-geo-gasvul   { background: linear-gradient(135deg, #581c87, #7c3aed); }\r\n    .agol-geo-gertan   { background: linear-gradient(135deg, #7f1d1d, #b91c1c); }\r\n    .agol-geo-volcano  { background: linear-gradient(135deg, #9a3412, #dc2626); }\r\n    .agol-geo-krb      { background: linear-gradient(135deg, #831843, #be185d); }\r\n    .agol-geo-kawasan  { background: linear-gradient(135deg, #14532d, #16a34a); }\r\n    .agol-geo-kttht    { background: linear-gradient(135deg, #1e3a5f, #0369a1); }\r\n    .agol-geo-satupeta { background: linear-gradient(135deg, #14532d, #22c55e); }\r\n    .agol-geo-kawasan .agol-popup-badge { font-size: 10px; padding: 3px 10px; border-radius: 5px; letter-spacing: .02em; }\r\n    .agol-geo-kawasan .agol-popup-title { font-size: 15px; }\r\n\r\n    .cctv-message { padding: 12px; margin-bottom:15px; border-radius: 10px; color: #567; background: #f4f8fb; font-size: 11px; text-align: center; }\r\n    /* CCTV */\r\n    .cctv-filter { display: grid; gap: 8px; margin: 10px 0; }\r\n    .cctv-filter input, .cctv-filter select { width: 100%; padding: 8px 9px; border: 1px solid #d7e2eb; border-radius: 8px; font: inherit; font-size: 11px; }\r\n    .cctv-results { display: grid; gap: 7px; max-height: 380px; overflow-y: auto; padding-bottom: 2px; }\r\n    .cctv-card { padding: 9px; border: 1px solid #e3edf5; border-radius: 10px; background: #fff; box-shadow: 0 3px 9px rgba(24,73,111,.05); cursor: pointer; }\r\n    .cctv-card:hover { border-color: #1494ca; background: #f3fbff; }\r\n    .cctv-card strong { display: block; overflow: hidden; color: #16466c; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }\r\n    .cctv-card small { display: block; margin-top: 4px; color: #668198; font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\r\n    .cctv-card.cctv-result-item {\r\n      position: relative;\r\n      width: 100%;\r\n      min-height: 62px;\r\n      padding: 11px 38px 11px 13px;\r\n      border: 1px solid #dfeaf2;\r\n      border-radius: 12px;\r\n      background: linear-gradient(135deg, #ffffff, #f4faff);\r\n      box-shadow: 0 2px 8px rgba(24, 73, 111, .06);\r\n      text-align: left;\r\n      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;\r\n    }\r\n    .cctv-result-item::after {\r\n      content: '›';\r\n      position: absolute;\r\n      top: 50%;\r\n      right: 14px;\r\n      color: #0879bf;\r\n      font-size: 24px;\r\n      font-weight: 300;\r\n      line-height: 1;\r\n      transform: translateY(-50%);\r\n    }\r\n    .cctv-result-item strong { color: #123f63; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\r\n    .cctv-result-item small { margin-top: 5px; color: #6b8295; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\r\n    .cctv-card.cctv-result-item:hover { border-color: #72c9eb; background: #effaff; box-shadow: 0 5px 14px rgba(8, 121, 191, .13); transform: translateY(-1px); }\r\n    .cctv-autocomplete { position: relative; }\r\n    .cctv-autocomplete-list { position: absolute; top: calc(100% + 2px); z-index: 1005; display: none; width: 100%; max-height: 180px; overflow-y: auto; border: 1px solid #cee1ef; border-radius: 8px; background: #fff; box-shadow: 0 7px 15px rgba(17,59,91,.13); }\r\n    .cctv-autocomplete-list button { display: block; width: 100%; padding: 8px; border: 0; border-bottom: 1px solid #eef4f8; background: #fff; color: #244b6e; cursor: pointer; font-size: 10px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\r\n    .cctv-map-icon { display: grid; width: 40px; height: 40px; place-items: center; border: 2px solid #fff; border-radius: 50%; background: linear-gradient(145deg, #fff, #dceef8); box-shadow: 0 5px 12px rgba(0,72,135,.4); }\r\n    .cctv-map-icon img { width: 25px; height: 25px; object-fit: contain; }\r\n    .cctv-leaflet-popup .leaflet-popup-content-wrapper { overflow: hidden; padding: 0; border-radius: 12px; box-shadow: 0 12px 30px rgba(11,54,87,.25); }\r\n    .cctv-leaflet-popup .leaflet-popup-content { width: auto !important; margin: 0; }\r\n    .cctv-popup { min-width: 210px; overflow: hidden; color: #173d5f; font-family: 'Segoe UI', sans-serif; }\r\n    .cctv-popup-label { display: inline-block; margin: 11px 12px 5px; padding: 3px 6px; border-radius: 99px; background: #e4f5fc; font-size: 9px; font-weight: 700; letter-spacing: .06em; }\r\n    .cctv-popup strong { display: block; overflow: hidden; padding: 0 12px; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }\r\n    .cctv-popup span { display: block; overflow: hidden; padding: 4px 12px 10px; color: #6a8498; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }\r\n    .cctv-popup button { width: 100%; padding: 10px; border: 0; color: #fff; background: linear-gradient(90deg, #0879bf, #11a4cb); cursor: pointer; font-size: 11px; font-weight: 700; }\r\n\r\n    /* CCTV Card */\r\n    .cctv-card {\r\n      border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-card);\r\n      overflow: hidden;\r\n      color: var(--text-primary);\r\n    }\r\n    /* .cctv-card tetap ada: cctv.js memakai ulang kelas ini untuk tiap\r\n       tombol hasil pencarian (class=\"cctv-card cctv-result-item\"). Yang\r\n       dihapus hanya .cctv-sheet-handle, yang tidak lagi ada di markup. */\r\n    #cctv-search-sheet { margin-top: 10px; }\r\n    #geotoolsTabGeoWatch { padding-bottom: 4px; }\r\n    #geotoolsTabGeoWatch #cctv-search-sheet { margin-top: 12px; }\r\n\r\n    /* ── Hotspot Sidebar (Desktop: kanan) ── */\r\n    #hotspot-sheet {\r\n      display: flex;\r\n      position: fixed;\r\n      top: 120px;\r\n      right: 12px;\r\n      bottom: 12px;\r\n      left: auto;\r\n      width: min(380px, calc(100vw - 106px));\r\n      height: auto;\r\n      border-radius: 16px;\r\n      z-index: 1100;\r\n      transform: translateX(calc(100% + 24px));\r\n      transition: transform 0.3s ease-in-out;\r\n      flex-direction: column;\r\n      overflow: hidden;\r\n      background: var(--bg-primary);\r\n      box-shadow: var(--shadow-sheet);\r\n      visibility: hidden;\r\n      color: var(--text-primary);\r\n    }\r\n    #hotspot-sheet.sheet-open { transform: translateX(0); visibility: visible; }\r\n\r\n    .leaflet-control-locate { display: none !important; }\r\n\r\n    /* Jauhkan kontrol Lokasi Saya, Reset, dan Print dari sidebar Hotspot saat terbuka. */\r\n    body.hotspot-sheet-open:not(.hotspot-sheet-minimized) .leaflet-bottom.leaflet-right {\r\n      right: calc(min(380px, calc(100vw - 106px)) + 28px);\r\n    }\r\n    #hotspot-sheet .hs-sheet-handle { display: none; }\r\n    #hotspot-sheet .hs-sheet-head {\r\n      display: flex;\r\n      align-items: center;\r\n      justify-content: space-between;\r\n      padding: 14px 16px 10px;\r\n      border-bottom: 1px solid var(--border-color);\r\n    }\r\n    #hotspot-sheet .hs-sheet-title {\r\n      display: flex;\r\n      align-items: center;\r\n      gap: 6px;\r\n      color: var(--text-primary);\r\n      font-size: 13px;\r\n      font-weight: 700;\r\n    }\r\n    #hotspot-sheet .hs-sheet-close {\r\n      width: 28px;\r\n      height: 28px;\r\n      border: 0;\r\n      border-radius: 50%;\r\n      background: var(--bg-tertiary);\r\n      color: var(--text-tertiary);\r\n      cursor: pointer;\r\n      font-size: 16px;\r\n    }\r\n    #hotspot-sheet .hs-sheet-actions {\r\n      display: flex;\r\n      align-items: center;\r\n      gap: 6px;\r\n    }\r\n    #hotspot-sheet .hs-sheet-minimize {\r\n      display: grid;\r\n      width: 28px;\r\n      height: 28px;\r\n      place-items: center;\r\n      border: 0;\r\n      border-radius: 50%;\r\n      background: var(--bg-tertiary);\r\n      color: var(--text-tertiary);\r\n      cursor: pointer;\r\n    }\r\n    #hotspot-sheet .hs-sheet-body {\r\n      flex: 1 1 auto;\r\n      min-height: 0;\r\n      overflow-y: auto;\r\n      padding: 12px 16px 20px;\r\n      -webkit-overflow-scrolling: touch;\r\n    }\r\n    @media (min-width: 769px) {\r\n      /* Angka 68px & z-index: lihat catatan \"Pita bawah tengah\" di blok\r\n         .zoom-control-wrap. */\r\n      #hotspot-sheet.sheet-minimized {\r\n        top: auto;\r\n        right: auto;\r\n        bottom: 68px;\r\n        left: 50%;\r\n        width: min(330px, calc(100vw - 24px));\r\n        height: 52px;\r\n        transform: translateX(-50%);\r\n        z-index: 100;\r\n      }\r\n      #hotspot-sheet.sheet-minimized .hs-sheet-body { display: none; }\r\n    }\r\n\r\n    @media (max-width: 768px) {\r\n      #hotspot-sheet {\r\n        top: auto;\r\n        right: 0;\r\n        bottom: 0;\r\n        left: 0;\r\n        width: 100%;\r\n        height: var(--sheet-h, 50vh);\r\n        height: var(--sheet-h, 50dvh);\r\n        border-radius: 16px 16px 0 0;\r\n        transform: translateY(100%);\r\n        box-shadow: 0 -4px 20px rgba(0,0,0,.15);\r\n      }\r\n      #hotspot-sheet.sheet-open { transform: translateY(0); }\r\n      #hotspot-sheet .hs-sheet-handle { display: flex; }\r\n      #hotspot-sheet .hs-sheet-head { padding: 0 16px 10px; }\r\n      #hotspot-sheet.sheet-minimized {\r\n        /* Posisi tepat di bawah toolbar Quick Layer pada layar mobile. */\r\n        top: 100px;\r\n        right: auto;\r\n        bottom: auto;\r\n        left: 50%;\r\n        width: min(260px, calc(100vw - 48px));\r\n        height: 36px;\r\n        border: 1px solid rgba(255, 255, 255, .72);\r\n        border-radius: 14px;\r\n        background: rgba(255, 255, 255, .92);\r\n        box-shadow: 0 4px 14px rgba(15, 23, 42, .12);\r\n        backdrop-filter: blur(12px);\r\n        -webkit-backdrop-filter: blur(12px);\r\n        transform: translateX(-50%);\r\n        z-index: 100;\r\n      }\r\n      #hotspot-sheet.sheet-minimized .hs-sheet-handle,\r\n      #hotspot-sheet.sheet-minimized .hs-sheet-body { display: none; }\r\n      #hotspot-sheet.sheet-minimized .hs-sheet-head {\r\n        min-height: 36px;\r\n        box-sizing: border-box;\r\n        /* 4px, bukan 6px: tombol 28px harus muat di chip 36px. */\r\n        padding: 4px 12px;\r\n        border-bottom: 0;\r\n      }\r\n    }\r\n    /* GeoPangan result sidebar (desktop: kanan, mobile: bottom sheet). */\r\n    #geopangan-sheet {\r\n      display: flex;\r\n      position: fixed;\r\n      top: 120px;\r\n      right: 12px;\r\n      bottom: 12px;\r\n      left: auto;\r\n      z-index: 1100;\r\n      width: min(430px, calc(100vw - 106px));\r\n      height: auto;\r\n      flex-direction: column;\r\n      overflow: hidden;\r\n      visibility: hidden;\r\n      border-radius: 16px;\r\n      background: var(--bg-primary);\r\n      box-shadow: var(--shadow-sheet);\r\n      transform: translateX(calc(100% + 24px));\r\n      transition: transform .3s ease-in-out, visibility .3s;\r\n      color: var(--text-primary);\r\n    }\r\n    #geopangan-sheet.sheet-open { transform: translateX(0); visibility: visible; }\r\n    body.geopangan-sheet-open:not(.geopangan-sheet-minimized) .leaflet-bottom.leaflet-right { right: calc(min(430px, calc(100vw - 106px)) + 28px); }\r\n    #geopangan-sheet .gp-sheet-handle { display: none; }\r\n    #geopangan-sheet .gp-sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--border-color); }\r\n    #geopangan-sheet .gp-sheet-title, #geopangan-sheet .gp-sheet-actions { display: flex; align-items: center; }\r\n    #geopangan-sheet .gp-sheet-title { gap: 6px; color: var(--text-primary); font-size: 13px; font-weight: 700; }\r\n    #geopangan-sheet .gp-sheet-actions { gap: 6px; }\r\n    #geopangan-sheet .gp-sheet-minimize, #geopangan-sheet .gp-sheet-close { display: grid; width: 28px; height: 28px; place-items: center; border: 0; border-radius: 50%; background: var(--bg-tertiary); color: var(--text-tertiary); cursor: pointer; }\r\n    #geopangan-sheet .gp-sheet-close { font-size: 16px; }\r\n    #geopangan-sheet .gp-sheet-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0 12px 16px; -webkit-overflow-scrolling: touch; }\r\n    @media (min-width: 769px) {\r\n      /* Angka 68px & z-index: lihat catatan \"Pita bawah tengah\" di blok\r\n         .zoom-control-wrap. */\r\n      #geopangan-sheet.sheet-minimized { top: auto; right: auto; bottom: 68px; left: 50%; width: min(330px, calc(100vw - 24px)); height: 52px; transform: translateX(-50%); z-index: 100; }\r\n      #geopangan-sheet.sheet-minimized .gp-sheet-body { display: none; }\r\n    }\r\n\r\n/* ── TransJakarta Sheet (Desktop: panel kanan) ──\r\n       Struktur dan perilaku sengaja mengikuti #geopangan-sheet persis:\r\n       panel sisi kanan di desktop, bottom sheet di mobile, chip saat\r\n       diminimize. Sheet ini bukan pola baru, dan tidak boleh punya\r\n       perilaku berbeda dari yang sudah dipakai. */\r\n    #transjakarta-sheet {\r\n      display: flex;\r\n      position: fixed;\r\n      top: 120px;\r\n      right: 12px;\r\n      bottom: 12px;\r\n      left: auto;\r\n      z-index: 1100;\r\n      width: min(390px, calc(100vw - 106px));\r\n      height: auto;\r\n      flex-direction: column;\r\n      overflow: hidden;\r\n      visibility: hidden;\r\n      border-radius: 16px;\r\n      background: var(--bg-primary);\r\n      box-shadow: var(--shadow-sheet);\r\n      transform: translateX(calc(100% + 24px));\r\n      transition: transform .3s ease-in-out, visibility .3s;\r\n      color: var(--text-primary);\r\n    }\r\n    #transjakarta-sheet.sheet-open { transform: translateX(0); visibility: visible; }\r\n    body.transjakarta-sheet-open:not(.transjakarta-sheet-minimized) .leaflet-bottom.leaflet-right { right: calc(min(390px, calc(100vw - 106px)) + 28px); }\r\n    #transjakarta-sheet .tj-sheet-handle { display: none; }\r\n    #transjakarta-sheet .tj-sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--border-color); }\r\n    #transjakarta-sheet .tj-sheet-title, #transjakarta-sheet .tj-sheet-actions { display: flex; align-items: center; }\r\n    #transjakarta-sheet .tj-sheet-title { gap: 7px; color: var(--text-primary); font-size: 13px; font-weight: 700; }\r\n    #transjakarta-sheet .tj-sheet-sub { display: block; font-size: 10px; font-weight: 500; color: var(--text-tertiary); }\r\n    #transjakarta-sheet .tj-sheet-actions { gap: 6px; }\r\n    #transjakarta-sheet .tj-sheet-minimize, #transjakarta-sheet .tj-sheet-close { display: grid; width: 28px; height: 28px; place-items: center; border: 0; border-radius: 50%; background: var(--bg-tertiary); color: var(--text-tertiary); cursor: pointer; }\r\n    #transjakarta-sheet .tj-sheet-close { font-size: 16px; }\r\n    #transjakarta-sheet .tj-sheet-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0 12px 16px; -webkit-overflow-scrolling: touch; }\r\n    @media (min-width: 769px) {\r\n      #transjakarta-sheet.sheet-minimized { top: auto; right: auto; bottom: 68px; left: 50%; width: min(300px, calc(100vw - 24px)); height: 52px; transform: translateX(-50%); z-index: 100; }\r\n      #transjakarta-sheet.sheet-minimized .tj-sheet-body { display: none; }\r\n    }\r\n\r\n/* Kontrol Jalur di sheet, dan kartu halte yang jadi tombol. */\r\n    #transjakarta-sheet .tj-ctrl { padding: 12px 0 2px; }\r\n    #transjakarta-sheet .tj-switch {\r\n      display: flex;\r\n      align-items: center;\r\n      gap: 8px;\r\n      width: 100%;\r\n      padding: 9px 10px;\r\n      border: 1px solid var(--border-color);\r\n      border-radius: 12px;\r\n      background: var(--bg-secondary);\r\n      color: var(--text-primary);\r\n      font: inherit;\r\n      font-size: 12px;\r\n      text-align: left;\r\n      cursor: pointer;\r\n      transition: background .12s ease, border-color .12s ease;\r\n    }\r\n    #transjakarta-sheet .tj-switch:hover { background: var(--bg-card-hover); }\r\n    #transjakarta-sheet .tj-switch:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }\r\n    #transjakarta-sheet .tj-switch.is-on { border-color: var(--accent); background: var(--bg-card-hover); }\r\n    #transjakarta-sheet .tj-switch-dot {\r\n      width: 26px;\r\n      height: 15px;\r\n      flex-shrink: 0;\r\n      border-radius: 999px;\r\n      background: var(--bg-tertiary);\r\n      box-shadow: inset 0 0 0 1px var(--border-color);\r\n      position: relative;\r\n      transition: background .15s ease;\r\n    }\r\n    #transjakarta-sheet .tj-switch-dot::after {\r\n      content: \"\";\r\n      position: ngan 10px isinya jadi 48px dan tombolnya terpotong. */\r\n          padding: 4px 12px;\r\n          border-bottom: 0;\r\n        }\r\n\r\n\r\n      /* ── Sembunyikan Zoom Control di Mobile ── */\r\n      .zoom-control-wrap { display: none !important; }\r\n\r\n      /* Gestur sheet: geser tinggi ala Google Maps. Didukung\r\n         assets/js/sheet-drag.js. Kelas .sheet-draggable dipasang modul\r\n         itu hanya pada sheet yang sedang terbuka, jadi aturan ini tidak\r\n         mengganggu sheet yang belum dipakai. */\r\n      .sheet-draggable {\r\n        transition: transform .3s ease-in-out, visibility .3s,\r\n                    height .22s cubic-bezier(.2, 0, 0, 1);\r\n      }\r\n\r\n/* ── TransJakarta (mobile: bottom sheet) ── */\r\n      #transjakarta-sheet {\r\n        top: auto;\r\n        display: flex;\r\n        position: fixed;\r\n        right: 0;\r\n        bottom: 0;\r\n        left: 0;\r\n        z-index: 1100;\r\n        width: 100%;\r\n        height: var(--sheet-h, 52vh);\r\n        height: var(--sheet-h, 52dvh);\r\n        flex-direction: column;\r\n        overflow: hidden;\r\n        visibility: hidden;\r\n        border-radius: 18px 18px 0 0;\r\n        background: #fff;\r\n        box-shadow: 0 -6px 24px rgba(15, 23, 42, .18);\r\n        transform: translateY(100%);\r\n        transition: transform .3s ease-in-out, visibility .3s;\r\n      }\r\n      #transjakarta-sheet.sheet-open { transform: translateY(0); visibility: visible; }\r\n      #transjakarta-sheet .tj-sheet-handle {\r\n        display: flex;\r\n        width: 36px;\r\n        height: 4px;\r\n        margin: 8px auto 6px;\r\n        flex-shrink: 0;\r\n        border-radius: 999px;\r\n        background: #cbd5e1;\r\n      }\r\n      #transjakarta-sheet .tj-sheet-head {\r\n        display: flex;\r\n        align-items: center;\r\n        justify-content: space-between;\r\n        padding: 0 16px 10px;\r\n        border-bottom: 1px solid #e8eef3;\r\n      }\r\n      #transjakarta-sh sheet .tj-switch.is-on { background: #ecfeff; border-color: #22d3ee; }\r\n      #transjakarta-sheet .tj-switch-dot { background: #e2e8f0; box-shadow: inset 0 0 0 1px #cbd5e1; }\r\n      #transjakarta-sheet .tj-switch.is-on .tj-switch-dot { background: #22d3ee; }\r\n      #transjakarta-sheet button.tj-stat-item { background: #f8fafc; border-color: #e2e8f0; }\r\n      #transjakarta-sheet button.tj-stat-item.is-on { background: #ecfeff; border-color: #22d3ee; }\r\n      #transjakarta-sheet button.tj-stat-item.is-on b { color: #0e7490; }\r\n      #transjakarta-sheet .tj-stat-item { background: #f8fafc; border-color: #e2e8f0; }\r\n      #transjakarta-sheet .tj-stat-item b { color: #1e293b; }\r\n      #transjakarta-sheet .tj-table thead th { background: #fff; border-bottom-color: #e8eef3; color: #94a3b8; }\r\n      #transjakarta-sheet .tj-td-nama b { color: #1e293b; }\r\n      #transjakarta-sheet .tj-sumber { border-top-color: #e8eef3; color: #94a3b8; }\r\n      #transjakarta-sheet .tj-row td { border-bottom-color: #f1f5f9; }\r\n      /* Selama jari bergerak transisi harus mati. Kalau tidak, height\r\n         mengejar nilai baru di setiap frame dan sheet terasa lengket. */\r\n      .sheet-draggable.is-dragging,\r\n      .sheet-draggable.is-dragging * { transition: none !important; }\r\n      /* touch-action: none itu WAJIB, bukan kosmetik. Tanpa itu browser\r\n         memakai gestur builtin-nya untuk menggulir halaman, pointermove\r\n         dihentikan browser, dan sheet-nya tidak bergerak sama sekali. */\r\n      .sheet-drag-zone {\r\n        touch-action: none;\r\n        -webkit-user-select: none;\r\n        user-select: none;\r\n        cursor: grab;\r\n      }\r\n      .sheet-drag-zone:active { cursor: grabbing; }\r\n      .sheet-drag-zone:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }\r\n      /* Handle seragam untuk sheet yang sebelumnya tidak punya handle\r\n         sendiri (Gambar & Ukur, Legenda, GeoFarm). Lima sheet lain\r\n         sudah punya visual sendiri dan tidak ikut aturan ini. */\r\n      .sheet-drag-handle {\r\n        flex: 0 0 auto;\r\n        padding: 8px 0 5px;\r\n        display: flex;\r\n        justify-content: center;\r\n      }\r\n      .sheet-drag-handle::after {\r\n        content: '';\r\n        width: 36px;\r\n        height: 4px;\r\n        border-radius: 2px;\r\n        background: #c4d5e3;\r\n      }\r\n\r\n      /* ── GeoTools Bottom Sheet (Mobile) ── */\r\n      #geotools-sheet {\r\n        top: auto; right: 0; bottom: 0; left: 0;\r\n        width: 100%; height: var(--sheet-h, 50vh); height: var(--sheet-h, 50dvh);\r\n        border-radius: 18px 18px 0 0;\r\n        transform: translateY(100%);\r\n      }\r\n      #geotools-sheet.gs-sheet-open { transform: translateY(0); visibility: visible; }\r\n      #geotools-sheet .gs-sheet-handle {\r\n        display: flex; width: 36px; height: 4px;\r\n        margin: 8px auto 6px; flex-shrink: 0;\r\n        border-radius: 999px; background: #d1d5db;\r\n      }\r\n      #geotools-sheet .gs-sheet-head {\r\n        padding: 4px 16px 10px;\r\n      }\r\n      #geotools-sheet .gs-sheet-body {\r\n        padding: 8px 12px 20px;\r\n      }\r\n      #geotools-sheet.gs-sheet-minimized {\r\n        top: auto; right: auto; bottom: 72px; left: 50%;\r\n        width: min(260px, calc(100vw - 48px));\r\n        height: 36px;\r\n        border-radius: 14px;\r\n        transform: translateX(-50%);\r\n        border: 1px solid rgba(255, 255, 255, .72);\r\n        background: rgba(255, 255, 255, .92);\r\n        box-shadow: 0 4px 14px rgba(15, 23, 42, .12);\r\n        backdrop-filter: blur(12px);\r\n        -webkit-backdrop-filter: blur(12px);\r\n        z-index: 100;\r\n      }\r\n      #geotools-sheet.gs-sheet-minimized .gs-sheet-head { min-height: 36px; padding: 4px 12px; }\r\n\r\n        /* ── GeoData Sheet (Mobile) ──\r\n         * Bottom sheet 50vh, sama seperti sheet GeoTools dan sheet tabel.\r\n         * Di mobile handle berupa drag pill, bukan display:none seperti di\r\n         * desktop. */\r\n        #geodata-sheet {\r\n          top: auto; right: 0; bottom: 0; left: 0;\r\n          width: 100%; height: var(--sheet-h, 50vh); height: var(--sheet-h, 50dvh);\r\n          border-radius: 18px 18px 0 0;\r\n          transform: translateY(100%);\r\n        }\r\n        #geodata-sheet.geodata-sheet-open { transform: translateY(0); visibility: visible; }\r\n        #geodata-sheet .geodata-sheet-handle {\r\n          display: flex; width: 36px; height: 4px;\r\n          margin: 8px auto 6px; flex-shrink: 0;\r\n          border-radius: 999px; background: #d1d5db;\r\n        }\r\n        #geodata-sheet .geodata-sheet-head { padding: 4px 16px 10px; }\r\n        #geodata-sheet .geodata-sheet-body { padding: 8px 12px 20px; }\r\n        #geodata-sheet.geodata-sheet-minimized {\r\n          top: auto; right: auto; bottom: 72px; left: 50%;\r\n          width: min(260px, calc(100vw - 48px));\r\n          height: 36px;\r\n          border-radius: 14px;\r\n          transform: translateX(-50%);\r\n          border: 1px solid rgba(255, 255, 255, .72);\r\n          background: rgba(255, 255, 255, .92);\r\n          box-shadow: 0 4px 14px rgba(15, 23, 42, .12);\r\n          backdrop-filter: blur(12px);\r\n          -webkit-backdrop-filter: blur(12px);\r\n          z-index: 100;\r\n        }\r\n        #geodata-sheet.geodata-sheet-minimized .geodata-sheet-handle,\r\n        #geodata-sheet.geodata-sheet-minimized .geodata-sheet-body { display: none; }\r\n        #geodata-sheet.geodata-sheet-minimized .geodata-sheet-head {\r\n          min-height: 36px; box-sizing: border-box; padding: 4px 12px; border-bottom: 0;\r\n        }\r\n\r\n        /* ── Draw & Measure Sidebar (Mobile) ── */\r\n\r\n      .dm-sidebar {\r\n        top: auto; right: 0; bottom: 0; left: 0;\r\n        width: 100%; height: var(--sheet-h, 50vh); height: var(--sheet-h, 50dvh);\r\n        border-radius: 18px 18px 0 0;\r\n        transform: translateY(100%);\r\n      }\r\n      .dm-sidebar.dm-sidebar-open { transform: translateY(0); visibility: visible; }\r\n      .dm-sidebar.dm-sidebar-minimized {\r\n        top: auto; right: auto; bottom: 72px; left: 50%;\r\n        width: min(260px, calc(100vw - 48px)); height: 36px;\r\n        border-radius: 14px; transform: translateX(-50%);\r\n        border: 1px solid rgba(255, 255, 255, .72);\r\n        background: rgba(255, 255, 255, .92);\r\n        box-shadow: 0 4px 14px rgba(15, 23, 42, .12);\r\n        backdrop-filter: blur(12px);\r\n        -webkit-backdrop-filter: blur(12px);\r\n        z-index: 100;\r\n      }\r\n\r\n      /* ── Legend Sidebar (Mobile) ── */\r\n      .lg-sidebar, .pa-panel {\r\n        top: auto; right: 0; bottom: 0; left: 0;\r\n        width: 100%; height: var(--sheet-h, 50vh); height: var(--sheet-h, 50dvh);\r\n        border-radius: 18px 18px 0 0;\r\n        transform: translateY(100%);\r\n      }\r\n      .lg-sidebar.lg-sidebar-open, .pa-panel.pa-open { transform: translateY(0); visibility: visible; }\r\n      .lg-sidebar.lg-sidebar-minimized {\r\n        top: auto; right: auto; bottom: 72px; left: 50%;\r\n        width: min(260px, calc(100vw - 48px)); height: 36px;\r\n        border-radius: 14px; transform: translateX(-50%);\r\n        border: 1px solid rgba(255, 255, 255, .72);\r\n        background: rgba(255, 255, 255, .92);\r\n        box-shadow: 0 4px 14px rgba(15, 23, 42, .12);\r\n        backdrop-filter: blur(12px);\r\n        -webkit-backdrop-filter: blur(12px);\r\n        z-index: 100;\r\n      }\r\n      .lg-sidebar.lg-sidebar-minimized .lg-sidebar-body { display: none; }\r\n      .lg-sidebar.lg-sidebar-minimized .lg-sidebar-head {\r\n        min-height: 36px; padding: 4px 12px; border-bottom: 0;\r\n      }\r\n      .pa-panel.pa-min {\r\n        top: auto; right: auto; bottom: 72px; left: 50%;\r\n        width: min(260px, calc(100vw - 48px)); height: 36px;\r\n        border-radius: 14px; transform: translateX(-50%);\r\n        border: 1px solid rgba(255, 255, 255, .72);\r\n        background: rgba(255, 255, 255, .92);\r\n        box-shadow: 0 4px 14px rgba(15, 23, 42, .12);\r\n        backdrop-filter: blur(12px);\r\n        -webkit-backdrop-filter: blur(12px);\r\n        visibility: visible;\r\n        z-index: 100;\r\n      }\r\n\r\n\r\n      /* ── Hide minimize buttons that don't apply on mobile ── */\r\n      #geopangan-sheet .gp-sheet-minimize { display: none !important; }\r\n\r\n      /* ── FAB → Bottom Navigation Bar (Mobile: Floating Glass) ── */\r\n      .map-fab-wrap {\r\n        position: fixed !important;\r\n        bottom: 12px !important;\r\n        left: 50% !important;\r\n        right: auto !important;\r\n        transform: translateX(-50%) !important;\r\n        margin: 0 !important;\r\n        z-index: 99999;\r\n        width: auto !important;\r\n        max-width: calc(100vw - 32px);\r\n        background: rgba(255,255,255,0.72) !important;\r\n        backdrop-filter: saturate(180%) blur(20px) !important;\r\n        -webkit-backdrop-filter: saturate(180%) blur(20px) !important;\r\n        border: 1px solid rgba(255,255,255,0.6) !important;\r\n        border-radius: 28px !important;\r\n        box-shadow:\r\n          0 4px 24px rgba(0,0,0,0.08),\r\n          0 1px 3px rgba(0,0,0,0.04),\r\n          inset 0 1px 0 rgba(255,255,255,0.8) !important;\r\n        padding-bottom: env(safe-area-inset-bottom, 0) !important;\r\n        transition: transform 0.35s cubic-bezier(0.32,0.72,0,1), opacity 0.3s ease !important;\r\n      }\r\n      [data-theme=\"dark\"] .map-fab-wrap {\r\n        background: rgba(30,30,30,0.72) !important;\r\n        border-color: rgba(255,255,255,0.12) !important;\r\n        box-shadow:\r\n          0 4px 24px rgba(0,0,0,0.28),\r\n          0 1px 3px rgba(0,0,0,0.12),\r\n          inset 0 1px 0 rgba(255,255,255,0.06) !important;\r\n      }\r\n      .map-fab-btn { display: none !important; }\r\n      .map-fab-items {\r\n        position: static !important;\r\n        flex-direction: row !important;\r\n        justify-content: center;\r\n        align-items: center;\r\n        opacity: 1 !important;\r\n        transform: none !important;\r\n        pointer-events: auto !important;\r\n        gap: 2px;\r\n        padding: 6px 8px !important;\r\n      }\r\n      .map-fab-open .map-fab-items { transform: none !important; }\r\n      .map-fab-item {\r\n        width: auto !important;\r\n        height: auto !important;\r\n        border: none !important;\r\n        border-radius: 16px !important;\r\n        background: transparent !important;\r\n        box-shadow: none !important;\r\n        flex-direction: column;\r\n        gap: 2px;\r\n        padding: 6px 12px !important;\r\n        opacity: 1 !important;\r\n        transform: none !important;\r\n        transition: background 0.2s ease, transform 0.2s ease !important;\r\n        position: relative;\r\n      }\r\n      .map-fab-open .map-fab-item {\r\n        opacity: 1 !important;\r\n        transform: none !important;\r\n        transition-delay: 0s !important;\r\n      }\r\n      .map-fab-item:active {\r\n        transform: scale(0.92) !important;\r\n      }\r\n      .map-fab-item.map-fab-locate { display: none !important; }\r\n      .map-fab-item:hover {\r\n        background: rgba(0,0,0,0.04) !important;\r\n        box-shadow: none !important;\r\n        transform: none !important;\r\n      }\r\n      [data-theme=\"dark\"] .map-fab-item:hover {\r\n        background: rgba(255,255,255,0.08) !important;\r\n      }\r\n      .map-fab-item[title]::after {\r\n        display: none !important;\r\n      }\r\n      .map-fab-item:hover[title]::after { display: none !important; }\r\n      .map-fab-item .draw-fab-btn,\r\n      .map-fab-item .geoportal-print-btn,\r\n      .map-fab-item .leaflet-control-locate,\r\n      .map-fab-item .leaflet-control-locate a,\r\n      .map-fab-item .sat-export-btn {\r\n        width: 30px !important;\r\n        height: 30px !important;\r\n        border-radius: 10px !important;\r\n        font-size: 16px;\r\n        background: transparent !important;\r\n        box-shadow: none !important;\r\n        border: none !important;\r\n      }\r\n      .map-fab-item svg {\r\n        width: 22px !important;\r\n        height: 22px !important;\r\n        stroke-width: 1.8 !important;\r\n      }\r\n\r\n      /* Active indicator dot */\r\n      .map-fab-item::before {\r\n        content: '';\r\n        position: absolute;\r\n        bottom: 2px;\r\n        left: 50%;\r\n        transform: translateX(-50%) scaleX(0);\r\n        width: 5px;\r\n        height: 5px;\r\n        border-radius: 50%;\r\n        background: var(--accent, #0a73b8);\r\n        transition: transform 0.25s cubic-bezier(0.32,0.72,0,1);\r\n      }\r\n      .map-fab-item.fab-active::before {\r\n        transform: translateX(-50%) scaleX(1);\r\n      }\r\n\r\n      /* ── Legend: push up for floating bottom nav ── */\r\n      /* ── Tinggi & posisi peta di mobile ──\r\n         Tanpa sheet yang mengembang, peta tetap 100% seperti biasa -- tidak\r\n         ada perubahan sama sekali dari keadaan sebelumnya.\r\n\r\n         Saat ada sheet yang mengembang (body.sheet-terbuka, dipasang\r\n         sheet-drag.js), tinggi peta = tinggi layar dikurangi tinggi sheet,\r\n         DITAMBAH kedalaman chrome atas (--map-chrome).\r\n\r\n         Penambahan itu yang membuat polygon duduk di tengah PITA bebas --\r\n         antara unified search dan tepi atas sheet -- bukan di tengah kotak\r\n         peta. Sisa --map-chrome px di bawah kotak peta memang tertutup\r\n         sheet, dan itu memang bipartisan: sheet-nya opaque, dan digeser\r\n         ke bawah hanya untuk membuat titik tengah peta jatuh di pita bebas.\r\n\r\n         Tinggi sheet masuk lewat --map-h, bukan --sheet-h: @property\r\n         --sheet-h declares inherits: false, jadi #map sebagai saudara sheet\r\n         tidak akan pernah membaca nilainya. sheet-drag.js mencerminkannya\r\n         ke elemen peta setiap kali sheet berhenti bergerak. --map-chrome\r\n         juga diukur dari DOM, jadi perubahan tinggi kotak search atau\r\n         jumlah tombol quick layer ikut adjusting.\r\n\r\n         position: relative itu WAJIB, bukan kosmetik. Leaflet.css tidak\r\n         memberi position ke .leaflet-container, dan #map pun tidak\r\n         memilikinya, jadi tanpa ini .leaflet-pane, .leaflet-top, dan\r\n         .leaflet-bottom tetap beranchor ke #app-container (position:\r\n         relative) yang 100dvh, sementara kotaknya sudah dipangkas -- tile\r\n         dan kontrol akan bergeser jauh dari area yang terlihat. */\r\n      #map {\r\n        position: relative;\r\n        height: 100%;\r\n        align-self: center;\r\n        transition: height .3s ease;\r\n      }\r\n      body.sheet-terbuka #map {\r\n        height: calc(100dvh - var(--map-h, 50dvh) + var(--map-chrome, 0px));\r\n        align-self: flex-start;\r\n      }\r\n      /* Kontrol Leaflet di kiri-bawah ikut terangkat sebesar --map-chrome,\r\n         karena tepi bawah kotak peta kini berada sejauh itu di belakang\r\n         sheet. Tanpa ini kontrolnya tertutup sheet. */\r\n      body.sheet-terbuka .leaflet-bottom.leaflet-left {\r\n        bottom: calc(80px + var(--map-chrome, 0px)) !important;\r\n      }\r\n\r\n      .leaflet-bottom.leaflet-left { bottom: 80px !important; }\r\n\r\n      /* ── Bottom nav: hide when sheet/sidebar open ── */\r\n        body.geotools-sheet-open:not(.geotools-sheet-minimized) .map-fab-wrap,\r\n        body.geodata-sheet-open:not(.geodata-sheet-minimized) .map-fab-wrap,\r\n\r\n      body.geopangan-sheet-open:not(.geopangan-sheet-minimized) .map-fab-wrap,\r\n      body.hotspot-sheet-open:not(.hotspot-sheet-minimized) .map-fab-wrap,\r\n      body.dm-sidebar-open:not(.dm-sidebar-minimized) .map-fab-wrap,\r\n      body.lg-sidebar-open:not(.lg-sidebar-minimized) .map-fab-wrap,\r\n      body.pa-panel-open:not(.pa-panel-minimized) .map-fab-wrap,\r\n      body.attr-table-sheet-open:not(.attr-table-sheet-minimized) .map-fab-wrap,\r\n      /* #ai-sheet tidak pernah memasang body class sebelumnya, jadi bar\r\n         input chat-nya berada persis di atas navigasi bawah. */\r\n      body.ai-sheet-open:not(.ai-sheet-minimized) .map-fab-wrap {\r\n        transform: translateX(-50%) translateY(calc(100% + 24px)) !important;\r\n        opacity: 0;\r\n        pointer-events: none;\r\n        transition: transform 0.35s cubic-bezier(0.32,0.72,0,1), opacity 0.25s ease !important;\r\n      }\r\n\r\n      /* ── Attribute Table Sheet (Mobile: bottom 50vh) ── */\r\n      #attr-table-sheet {\r\n        top: auto; right: 0; bottom: 0; left: 0;\r\n        width: 100%; height: var(--sheet-h, 50vh); height: var(--sheet-h, 50dvh);\r\n        border-radius: 16px 16px 0 0;\r\n        transform: translateY(100%);\r\n      }\r\n      #attr-table-sheet.attr-table-sheet-open { transform: translateY(0); }\r\n      #attr-table-sheet .at-sheet-handle {\r\n        display: flex; width: 36px; height: 4px;\r\n        margin: 8px auto 6px; flex-shrink: 0;\r\n        border-radius: 999px; background: #d1d5db; cursor: pointer;\r\n      }\r\n      #attr-table-sheet .at-sheet-head { padding: 4px 16px 10px; }\r\n      #attr-table-sheet .at-sheet-body { padding: 8px 12px 20px; }\r\n      #attr-table-sheet.attr-table-sheet-minimized {\r\n        top: auto; right: auto; bottom: 72px; left: 50%;\r\n        width: min(260px, calc(100vw - 48px)); height: 36px;\r\n        border-radius: 14px; transform: translateX(-50%);\r\n        border: 1px solid rgba(255, 255, 255, .72);\r\n        background: rgba(255, 255, 255, .92);\r\n        box-shadow: 0 4px 14px rgba(15, 23, 42, .12);\r\n        backdrop-filter: blur(12px);\r\n        -webkit-backdrop-filter: blur(12px);\r\n        z-index: 100;\r\n      }\r\n      #attr-table-sheet.attr-table-sheet-minimized .at-sheet-handle,\r\n      #attr-table-sheet.attr-table-sheet-minimized .at-sheet-body { display: none; }\r\n      #attr-table-sheet.attr-table-sheet-minimized .at-sheet-head {\r\n        min-height: 36px; box-sizing: border-box; padding: 4px 12px; border-bottom: 0;\r\n      }\r\n    }\r\n\r\n    /* .cctv-card-header dipakai bersama, dan SETELAH GeoPangan pindah ke\r\n       template .gt-card-head yang tersisa adalah GeoPulse (9 pita).\r\n       Gempa dan Cuaca Maritime memakai subtab GeoPulse itu, bukan panel\r\n       terpisah. Kelas ini BUKAN milik GeoWatch maupun GeoPangan, jadi\r\n       jangan ikut dihapus saat salah satu dari keduanya jadi kartu\r\n       .gt-card-head. */\r\n    .cctv-card-header {\r\n      display: flex; align-items: center; gap: 6px;\r\n      padding: 10px 14px; background: linear-gradient(110deg, #066aa8, #1198c7); border-bottom: 1px solid #066aa8;\r\n      border-radius: 13px 13px 0 0;\r\n      font-size: 12px; font-weight: 700; color: #fff;\r\n    }\r\n    .cctv-card-header svg { color: #fff; flex-shrink: 0; }\r\n\r\n    /* CCTV — kartu pencarian, sekarang <details> yang mengikuti template\r\n       kartu GeoTools: <summary class=\"gt-card-head\"> + badan, dan badan\r\n       disembunyikan saat terlipat.\r\n\r\n       Dua hal yang TIDAK sama dengan kartu GeoFarm/GeoTani:\r\n\r\n       1. overflow: visible, bukan hidden. Daftar .cctv-autocomplete-list\r\n          diposisikan absolute di dalam .cctv-autocomplete dan harus bisa\r\n          keluar dari kotak kartu seperti sebelumnya; overflow: hidden akan\r\n          memotongnya sehingga daftar autocomplete tidak pernah terlihat.\r\n          Karena kartu tidak memotong, sudut atas kepala dibulatkan sendiri\r\n          pada .geowatch-cctv > .gt-card-head di bawah.\r\n\r\n       2. z-index: 3 dipertahankan dari .cctv-search-card yang lama, supaya\r\n          daftar autocomplete tetap berada di atas isi kartu lain di sheet.\r\n\r\n       .cctv-search-body (grid + gaya isian) sengaja tetap dipakai pada\r\n       pembungkus isian di dalam badan, sehingga tampilan input dan select\r\n       tidak berubah sama sekali. */\r\n    .geowatch-cctv {\r\n      position: relative;\r\n      z-index: 3;\r\n      padding: 0;\r\n      overflow: visible;\r\n      border: 1px solid var(--border-color);\r\n      border-radius: 10px;\r\n      background: var(--bg-card);\r\n    }\r\n    .geowatch-cctv > .gt-card-head { border-radius: 9px 9px 0 0; }\r\n    .geowatch-cctv:not([open]) > .geowatch-cctv-body { display: none; }\r\n    .geowatch-cctv-body { padding: 12px 13px; }\r\n    /* Jarak antara isian, pesan status, dan daftar hasil. */\r\n    .geowatch-cctv-body > .cctv-message { margin-top: 10px; }\r\n    .geowatch-cctv-body > .cctv-results { margin-top: 10px; }\r\n    .cctv-search-body { display: grid; gap: 12px; }\r\n\r\n    /* Panel GeoRaster — kartu \"Unduh DEMNAS\", mengikuti template kartu\r\n     * GeoTools seperti GeoFarm, GeoTani, dan GeoWatch.\r\n     *\r\n     * overflow: hidden aman di sini, BERBEDA dari .geowatch-cctv yang\r\n     * memakai visible. Panel GeoRaster tidak punya satu pun popup\r\n     * ber-posisi absolute, dan satu-satunya elemen absolute di dalamnya\r\n     * (#demnasDownloadBtn.is-loading::after) sudah terpotong oleh\r\n     * .geotools-btn { overflow: hidden } sejak sebelumnya. Yang perlu\r\n     * dipotong di sini adalah tepi pita kepala kartu. */\r\n    .georaster-card {\r\n      padding: 0;\r\n      overflow: hidden;\r\n      border: 1px solid var(--border-color);\r\n      border-radius: 10px;\r\n      background: var(--bg-card);\r\n    }\r\n    .georaster-card:not([open]) > .georaster-card-body { display: none; }\r\n    .georaster-card-body { padding: 12px 13px; }\r\n    /* Terjemahan panjang yang tadinya <p> di dalam wrapper lama. Dipindah\r\n     * ke sini supaya tidak hilang, tapi tidak juga memenuhi kepala kartu. */\r\n    .georaster-card-note {\r\n      margin: 0 0 10px;\r\n      padding-bottom: 8px;\r\n      border-bottom: 1px dashed var(--border-color);\r\n      font-size: 9.5px;\r\n      line-height: 1.5;\r\n      color: var(--text-muted);\r\n    }\r\n    /* Isi form memakai .geotani-form-input yang bordernya lebih tebal dan\r\n     * sudutnya 6px; di dalam kartu yang padding-nya 12px, selisih ke\r\n     * tepi kartu jadi sempit. Menambah tinggi sedikit lebih baik\r\n     * daripada isian yang menempel. */\r\n    .georaster-card-body .geotani-form-input { min-height: 34px; }\r\n    .georaster-card-body .geotools-btn { margin-top: 12px; }\r\n\r\n    /* Panel GeoNusa — dua kartu (\"Statistik Indonesia\" dan \"Indikator\r\n     * Penduduk\") yang menggantikan nav subtab. Kelas .geoid-subtab-panel\r\n     * SENGAJA tidak dipakai di sini: sidebar.js:184 mencarinya dengan\r\n     * querySelectorAll di seluruh dokumen, jadi begitu pengguna menekan\r\n     * salah satu tombol Alat di panel GeoData, kelas .active akan dilepas\r\n     * dari kartu ini dan \".geoid-subtab-panel { display:none }\"\r\n     * menyembunyikannya permanen. Tanpa nav, kartu tidak bisa dibuka lagi.\r\n     *\r\n     * overflow: hidden aman: population-chart.js hanya menghasilkan satu\r\n     * elemen ber-posisi absolute — ikon pembesar 12x12 px yang terpusat\r\n     * di dalam wrapper position:relative-nya sendiri, dengan\r\n     * pointer-events:none. <select> penanda indikator adalah select\r\n     * bawaan browser, digambar di lapisan teratas sehingga tidak pernah\r\n     * terpotong overflow leluhur. */\r\n    .geonusa-card {\r\n      padding: 0;\r\n      overflow: hidden;\r\n      border: 1px solid var(--border-color);\r\n      border-radius: 10px;\r\n      background: var(--bg-card);\r\n    }\r\n    .geonusa-card:not([open]) > .geonusa-card-body { display: none; }\r\n    .geonusa-card-body { padding: 12px 13px; }\r\n    /* Jarak 10px yang sama dengan .geofarm-kalk dan .geofarm-ref, supaya\r\n       ritme antar kartu di panel GeoTools seragam. Kartu PERTAMA tidak\r\n       diberi margin: jarak ke arahnya datang dari margin-bottom paragraf\r\n       pengantar panel, persis seperti .geofarm-card. */\r\n    .geonusa-card + .geonusa-card { margin-top: 10px; }\r\n\r\n    .cctv-search-body input, .cctv-search-body select {\r\n      width: 100%; height: 40px; padding: 7px 11px; margin-bottom: 0;\r\n      border: 1px solid #d5e3ed; border-radius: 9px; font-size: 12px;\r\n      background: #f8fbfd; color: #23445f; box-sizing: border-box;\r\n      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;\r\n    }\r\n    .cctv-search-body input:focus, .cctv-search-body select:focus {\r\n      outline: none; border-color: #1494ca; background: #fff; box-shadow: 0 0 0 3px rgba(20, 148, 202, .12);\r\n    }\r\n\r\n    /* CCTV Layer Toggle */\r\n    .cctv-layers { margin: 12px 0; }\r\n\r\n    /* Panel GeoPulse, section \"Cuaca\" - dua kartu (\"Layer Cuaca Maritim\"\r\n     * dan \"Kualitas Udara\") yang mengikuti template kartu GeoTools seperti\r\n     * GeoFarm, GeoTani, GeoWatch, GeoRaster, GeoNusa, dan GeoPangan.\r\n     *\r\n     * Yang BELUM ikut berubah: section Gempa, Kehutanan, Geologi, dan\r\n     * Forecasting masih memakai pita .cctv-card-header. Tombol subtabnya\r\n     * ada, tapi pembungkus .gempa-subtabs itu inline style=\"display:none;\"\r\n     * dan tidak ada JS yang membukanya, jadi di aplikasi yang terlihat\r\n     * memang hanya section Cuaca ini.\r\n     *\r\n     * overflow: hidden aman di sini: isi kartu cuma daftar toggle\r\n     * .cctv-layer-toggle, dan satu-satunya positioning di dalamnya adalah\r\n     * .cctv-layer-check { position: relative } untuk centangnya - tidak\r\n     * ada elemen absolute yang perlu keluar dari kotak. */\r\n    .geopulse-card {\r\n      padding: 0;\r\n      overflow: hidden;\r\n      border: 1px solid var(--border-color);\r\n      border-radius: 10px;\r\n      background: var(--bg-card);\r\n    }\r\n    .geopulse-card:not([open]) > .geopulse-card-body { display: none; }\r\n    .geopulse-card-body { padding: 12px 13px; }\r\n    /* Jarak 10px antar kartu, sama seperti .geonusa-card dan\r\n     * .geopangan-card. Kartu PERTAMA tidak diberi margin: jaraknya datang\r\n     * dari margin-bottom blok #weather-content di atasnya. */\r\n    .geopulse-card + .geopulse-card { margin-top: 10px; }\r\n    /* .cctv-layers sengaja dipertahankan di badan kartu: di dalam\r\n     * .gempa-subtab-panel ia yang memberi max-height:35vh + overflow-y:auto,\r\n     * supaya daftar 10 toggle kualitas udara tetap bisa digulir dan tidak\r\n     * mendorong seluruh panel. Tapi margin 12px bawaannya harus dinolkan,\r\n     * kalau tidak menumpuk dengan padding 12px badan kartu.\r\n     * Aturan max-height-nya sendiri (yang di-scope ke .gempa-subtab-panel)\r\n     * TIDAK boleh dihapus: wrapper .gempa-subtab-panel sengaja dipertahankan\r\n     * di markup, justru supaya aturan itu terus berlaku. */\r\n    .geopulse-card-body.cctv-layers { margin: 0; }\r\n\r\n    /* Tiga kartu runtime di #weather-content (dibuat oleh displayWeatherInfo()\r\n     * lewat innerHTML, jadi tidak ada di index.html): \"Cuaca Sekarang\",\r\n     * \"Grafik Suhu\", dan \"Prakiraan Cuaca\".\r\n     *\r\n     * Ketiganya memakai .geopulse-card yang sama, dan jarak 10px antar\r\n     * kartu di dalamnya sudah otomatis oleh \".geopulse-card + .geopulse-card\".\r\n     * Yang perlu ditambah hanya jarak dari blok #weather-content ke kartu\r\n     * static pertama (\"Layer Cuaca Maritim\") - keduanya bukan saudara\r\n     * langsung, karena #weather-content menyelip di antaranya. */\r\n    #weather-content { margin-bottom: 10px; }\r\n    /* Dua isi kartu berikut TIDAK dipipihkan ke gaya kartu template:\r\n     *\r\n     *  - .weather-hero memakai color:#fff di atas gradien biru. Kalau\r\n     *    dipipihkan ke badan kartu yang berlatar var(--bg-card), teksnya\r\n     *    jadi putih di atas putih. Jadi blok gradiennya tetap utuh di\r\n     *    dalam badan kartu; yang dinolkan hanya margin bawaannya, karena\r\n     *    jarak sudah disediakan padding badan kartu.\r\n     *\r\n     *  - .temp-chart-section punya background:#fff sendiri, jadi isinya\r\n     *    (SVG digambar tangan oleh buildTemperatureChart, BUKAN Chart.js)\r\n     *    tetap terbaca. Margin dan radius-nya yang dirapikan saja. */\r\n    .geopulse-card-body .weather-hero { margin: 0; border-radius: 8px; }\r\n    .geopulse-card-body .temp-chart-section { margin: 0; border-radius: 8px; }\r\n\r\n    .cctv-layer-toggle {\r\n      display: flex;\r\n      align-items: center;\r\n      gap: 10px;\r\n      padding: 10px 12px;\r\n      border: 1px solid #e3edf5;\r\n      border-radius: 10px;\r\n      background: #fff;\r\n      cursor: pointer;\r\n      transition: border-color .2s, background .2s;\r\n    }\r\n    .cctv-layer-toggle:hover { border-color: #1494ca; background: #f3fbff; }\r\n    .cctv-layer-toggle input { display: none; }\r\n    .cctv-layer-check {\r\n      flex-shrink: 0;\r\n      width: 18px; height: 18px;\r\n      border: 2px solid #c4d5e3; border-radius: 4px;\r\n      background: #fff; position: relative;\r\n      display: flex; align-items: center; justify-content: center;\r\n      transition: border-color .2s, background .2s;\r\n    }\r\n    .cctv-layer-check svg { opacity: 0; transition: opacity .15s; }\r\n    .cctv-layer-toggle input:checked + .cctv-layer-check {\r\n      border-color: #e67e22; background: #e67e22;\r\n    }\r\n    .cctv-layer-toggle input:checked + .cctv-layer-check svg { opacity: 1; }\r\n    .cctv-layer-info { display: flex; flex-direction: column; gap: 1px; }\r\n    .cctv-layer-name { font-size: 11px; font-weight: 700; color: #16466c; }\r\n    .cctv-layer-info small { font-size: 9px; color: #668198; }\r\n\r\n    .hotspot-eye-btn {\r\n      margin-left: auto;\r\n      flex-shrink: 0;\r\n      width: 28px;\r\n      height: 28px;\r\n      display: flex;\r\n      align-items: center;\r\n      justify-content: center;\r\n      border: 1px solid #d1d9e2;\r\n      border-radius: 6px;\r\n      background: #fff;\r\n      color: #475569;\r\n      cursor: pointer;\r\n      transition: background .15s, color .15s, border-color .15s;\r\n    }\r\n    .hotspot-eye-btn:hover { background: #f1f5f9; color: #0f172a; border-color: #94a3b8; }\r\n    .hotspot-eye-btn.markers-hidden { color: #cbd5e1; border-color: #e2e8f0; }\r\n    .hotspot-eye-btn.markers-hidden svg { opacity: .4; }\r\n\r\n    /* Toll Road Tooltip */\r\n    .toll-road-tooltip {\r\n      background: #1a3a52;\r\n      color: #fff;\r\n      border: 0;\r\n      border-radius: 6px;\r\n      padding: 5px 10px;\r\n      font-size: 11px;\r\n      font-weight: 600;\r\n      box-shadow: 0 4px 10px rgba(0,0,0,.2);\r\n    }\r\n    .toll-road-tooltip::before { border-top-color: #1a3a52; }\r\n\r\n/* GeoTani - SLS (Satuan Lingkungan Setempat) per desa */\r\n.geotani-sls-badge {\r\n  display: inline-block; margin-left: 5px; padding: 1px 5px;\r\n  border: 1px solid var(--accent-green); border-radius: 3px;\r\n  font-size: 8px; font-weight: 700; letter-spacing: .04em;\r\n  color: var(--accent-green); vertical-align: middle;\r\n}\r\n.geotani-sls-desc {\r\n  margin: 0 0 8px; font-size: 10.5px; line-height: 1.5; color: var(--text-muted);\r\n}\r\n.geotani-sls-desc b { color: var(--text-secondary); }\r\n.geotani-sls-card .geotani-btn-print { width: 100%; justify-content: center; }\r\n.geotani-sls-search { position: relative; margin-bottom: 8px; }\r\n.geotani-sls-search .geotani-form-input-search { width: 100%; }\r\n.geotani-sls-results {\r\n  position: absolute; left: 0; right: 0; top: 100%; z-index: 60;\r\n  max-height: 200px; overflow-y: auto;\r\n  border: 1px solid var(--border-color); border-top: 0; border-radius: 0 0 4px 4px;\r\n  background: var(--bg-primary); box-shadow: 0 4px 12px rgba(0, 0, 0, .12);\r\n}\r\n.geotani-sls-results[hidden] { display: none; }\r\n.geotani-sls-result {\r\n  padding: 7px 10px; font-size: 11px; color: var(--text-secondary);\r\n  cursor: pointer; border-bottom: 1px solid var(--border-color);\r\n}\r\n.geotani-sls-result:last-child { border-bottom: 0; }\r\n.geotani-sls-result:hover { background: var(--bg-card-hover); }\r\n.geotani-sls-picked {\r\n  margin-top: 4px; padding: 4px 8px; font-size: 10px;\r\n  color: #166534; background: #f0fdf4; border-radius: 4px;\r\n}\r\n.geotani-sls-picked[hidden] { display: none; }\r\n.geotani-sls-status {\r\n  margin-top: 7px; font-size: 10.5px; line-height: 1.5; color: var(--text-muted);\r\n}\r\n    .geotani-sls-status:not(:empty) { color: #b45309; }\r\n    /*        Status kuota habis. Berbeda dari .geotani-sls-warn yang memperingatkan\r\n       data tidak lengkap, ini berarti server menolak: perlu kotak dengan\r\n       warna sendiri supaya tidak tertukar dengan \"sebagian data mungkin\r\n       tidak tampil\". Warna merah dipakai karena aksi berikutnya adalah\r\n       menunggu sampai jam berikutnya, bukan memperbaiki sesuatu. */\r\n    .geotani-sls-status.is-quota {\r\n      margin-top: 7px; padding: 7px 9px;\r\n      border: 1px solid #fca5a5; border-left: 3px solid #dc2626;\r\n      border-radius: 5px;\r\n      background: #fef2f2; color: #991b1b;\r\n      font-size: 10.5px; line-height: 1.5;\r\n    }\r\n    [data-theme=\"dark\"] .geotani-sls-status.is-quota {\r\n      border-color: #7f1d1d; border-left-color: #ef4444;\r\n      background: #2a0b0b; color: #fecaca;\r\n    }\r\n    .geotani-sls-summary {\r\n  display: flex; flex-wrap: wrap; gap: 4px 10px;\r\n  margin-top: 8px; font-size: 10.5px; color: var(--text-secondary);\r\n}\r\n.geotani-sls-summary b { color: var(--text-primary); }\r\n.geotani-sls-warn {\r\n  margin-top: 6px; padding: 5px 7px;\r\n  border: 1px solid #fbbf24; border-radius: 4px;\r\n  background: #fffbeb; color: #92400e; font-size: 10px; line-height: 1.45;\r\n}\r\n.geotani-sls-list {\r\n  max-height: 190px; margin: 7px 0 0; padding: 0; overflow-y: auto;\r\n  list-style: none; border: 1px solid var(--border-color); border-radius: 5px;\r\n}\r\n.geotani-sls-list li {\r\n  display: flex; align-items: baseline; gap: 8px;\r\n  padding: 5px 8px; font-size: 10.5px; cursor: pointer;\r\n  border-top: 1px solid var(--border-color);\r\n}\r\n.geotani-sls-list li:first-child { border-top: 0; }\r\n.geotani-sls-list li:hover { background: var(--bg-card-hover); }\r\n.geotani-sls-name { flex: 1 1 auto; min-width: 0; color: var(--text-primary); }\r\n.geotani-sls-luas { flex: 0 0 auto; color: var(--accent-green); font-weight: 600; }\r\n/* Kredit BPS: pasal 13.2 Ketentuan Penggunaan mewajibkan kutipan yang memuat\r\n   judul konten, tanggal akses, penulis, dan tautan ke konten asli. Teksnya\r\n   sengaja kecil tapi tidak disembunyikan.\r\n\r\n   Tautannya ditulis sebagai teks biasa, jadi dibutuhkan pemenggalan kata:\r\n   URL-nya panjang (gistaru.atrbpn.go.id/arcgis/rest/services/LSD/LSD_DAL/\r\n   MapServer sudah 60+ karakter) sementara panel GeoTools hanya sekitar\r\n   300 px. Tanpa itu URL meluber keluar dari kartu. */\r\n.geotani-sls-credit {\r\n  margin-top: 7px; padding-top: 6px;\r\n  border-top: 1px dashed var(--border-color);\r\n  font-size: 9px; line-height: 1.5; color: var(--text-muted);\r\n  overflow-wrap: anywhere; word-break: break-word;\r\n}\r\n[data-theme=\"dark\"] .geotani-sls-warn {\r\n  border-color: #a16207; background: #451a03; color: #fcd34d;\r\n}\r\n[data-theme=\"dark\"] .geotani-sls-picked { color: #86efac; background: #052e16; }\r\n.geotani-sls-popup-title {\r\n  font-size: 12px; font-weight: 700; color: #166534;\r\n  padding-bottom: 5px; margin-bottom: 5px; border-bottom: 1px solid #dcfce7;\r\n}\r\n.geotani-sls-popup-row {\r\n  display: flex; justify-content: space-between; gap: 10px;\r\n  font-size: 11px; line-height: 1.6; color: #475569;\r\n}\r\n/* GeoTani - KKPR / NIB (ATR/BPN GISTARU). Sengaja memakai .geotani-lbslsd\r\n   untuk kepala dan badan kartunya, supaya dua workflow mandiri di bagian\r\n   atas tab ini terlihat sama dan tidak perlu aturan yang terduplikasi.\r\n   Yang ditambahkan hanya jarak antar kartu dan gaya untuk kondisi data\r\n   yang tidak konsisten.\r\n\r\n   Bingkai kartu KKPR (border, radius, latar) TIDAK ditulis di sini.\r\n   Aturannya ada di blok .geotani-geooss/.geotani-kkpr yang menyatukan\r\n   kedua kartu, supaya tidak ada dua tempat yang bisa tidak sinkron. */\r\n\r\n/* Peringatan data: satu NIB dengan beberapa geometri, atau geometri\r\n   berukuran tidak wajar. Warnanya sengaja tidak merahsolid -- merah\r\n   dipakai untuk tombol hapus, sedangkan di sini yang_flagged adalah\r\n   keterbatasan data ATR/BPN, bukan kesalahan pengguna. */\r\n.geotani-kkpr-warn {\r\n  margin: 8px 0; padding: 8px 10px;\r\n  border: 1px solid rgba(180, 120, 0, .35);\r\n  border-left: 3px solid #b26a00;\r\n  border-radius: 5px; background: rgba(180, 120, 0, .07);\r\n  font-size: 10.5px; line-height: 1.5; color: var(--text-primary);\r\n}\r\n.geotani-kkpr-grup {\r\n  margin-top: 10px; border: 1px solid var(--border-color);\r\n  border-radius: 6px; overflow: hidden;\r\n}\r\n.geotani-kkpr-grup.is-ganjil { border-color: rgba(220, 38, 38, .45); }\r\n.geotani-kkpr-grup-head {\r\n  padding: 6px 10px; background: var(--bg-card-hover);\r\n  border-bottom: 1px solid var(--border-color);\r\n  font-size: 10.5px; font-weight: 600; color: var(--text-primary);\r\n}\r\n.geotani-kkpr-grup.is-ganjil .geotani-kkpr-grup-head { color: #b91c1c; }\r\n\r\n/* Tabel izin. Daftar ini sama sekali berbeda bentuk dari kartu LBS & LSD\r\n   dan SLS, yang memakai daftar baris, bukan tabel -- jadi kelasnya milik\r\n   sendiri dan tidak dipinjam dari sana. */\r\n.geotani-kkpr-table-wrap { overflow-x: auto; }\r\n.geotani-kkpr-table {\r\n  width: 100%; border-collapse: collapse; font-size: 10.5px;\r\n}\r\n.geotani-kkpr-table th {\r\n  padding: 5px 8px; text-align: left; font-size: 9px; font-weight: 700;\r\n  text-transform: uppercase; letter-spacing: .04em;\r\n  color: var(--text-tertiary); background: var(--bg-card-hover);\r\n  border-bottom: 1px solid var(--border-color); white-space: nowrap;\r\n}\r\n.geotani-kkpr-table td {\r\n  padding: 5px 8px; border-bottom: 1px solid var(--border-secondary);\r\n  color: var(--text-primary); white-space: nowrap;\r\n}\r\n.geotani-kkpr-table tr:last-child td { border-bottom: 0; }\r\n\r\n/* Kolom KBLI dan nama usaha. Kode ditonjolkan, sedangkan \"tidak ditemukan\"\r\n   sengaja dibuat redup miring: itu keadaan data yang sah, bukan kegagalan\r\n   program, jadi tidak boleh terlihat seperti error. Nama usaha boleh\r\n   membungkus karena judul KBLI bisa sangat panjang, sedangkan kolom lain\r\n   tetap nowrap supaya tabel tetap rapat. */\r\n.geotani-kkpr-kode {\r\n  font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent);\r\n}\r\n.geotani-kkpr-kosong { color: var(--text-tertiary); font-style: italic; }\r\n.geotani-kkpr-table td:nth-child(3) { white-space: normal; min-width: 180px; }\r\n\r\n/* GeoTani - GeoOSS (Pre-OSS Spatial Checker).\r\n   Nama kelas memakai prefix .geooss- supaya tidak bentrok dengan .geotani-kkpr-\r\n   yang punya gaya serupa. Kartu meniru .geotani-lbslsd seperti kartu GeoTani\r\n   yang lain; yang khas hanya isi: tabel zona, verdict, dan daftar kendala.\r\n\r\n   BINGKAI KARTU\r\n   -------------\r\n   Dua kartu ini memakai .geotani-lbslsd-head dan .geotani-lbslsd-body, tapi\r\n   TIDAK memakai kelas .geotani-lbslsd -- dan bingkai itulah yang memberi\r\n   border, radius, warna latar, serta overflow. Akibatnya keduanya pernah\r\n   tampil sebagai kepala berwarna yang menggantung di atas teks, tanpa\r\n   kotak: terlihat seperti hasil modul yang ditempelkan, bukan kartu.\r\n\r\n   Aturan di bawah memberikan bingkai itu secara langsung, bukan dengan\r\n   menumpangkan kelas .geotani-lbslsd ke dalam .geotani-geooss/.geotani-kkpr,\r\n   supaya nama kelas di markup tetap berarti apa adanya modul itu. */\r\n.geotani-geooss,\r\n.geotani-kkpr {\r\n  margin-bottom: 14px; padding: 0; overflow: hidden;\r\n  border: 1px solid var(--border-color); border-radius: 8px;\r\n  background: var(--bg-card);\r\n}\r\n\r\n/* Penanda bawaan, chevron, hover, dan fokus kartu GeoOSS dan KKPR\r\n   sekarang ditangani oleh .gt-card-head di blok \"Kepala kartu GeoTools\".\r\n   Aturan lama di sini dihapus, bukan dibiarkan jadi alias, supaya tidak\r\n   ada dua sumber untuk hal yang sama.\r\n\r\n   Yang TETAP khas modul ini cuma satu: isi kartu pertama tidak boleh\r\n   punya margin-top sendiri, karena badannya ber-padding. */\r\n.geotani-geooss > .geotani-lbslsd-body > :first-child,\r\n.geotani-kkpr > .geotani-lbslsd-body > :first-child { margin-top: 0; }\r\n\r\n\r\n/* Verdict: satu blok besar yang langsung terbaca. Warna memakai variabel tema\r\n   supaya ikut dark mode, bukan hex tetap. */\r\n.geooss-verdict {\r\n  margin-top: 8px; padding: 8px 10px; border-radius: 6px;\r\n  font-size: 12px; border-left: 3px solid var(--accent);\r\n  background: var(--bg-card-hover); color: var(--text-primary);\r\n}\r\n.geooss-verdict.is-ok  { border-left-color: #16a34a; }\r\n.geooss-verdict.is-warn { border-left-color: #d97706; }\r\n.geooss-verdict.is-bad { border-left-color: #dc2626; }\r\n\r\n/* Peringatan data: \"belum di-build\", zone tanpa kode, dan lain-lain. Sengaja\r\n   styled seperti catatan, bukan seperti error merah, karena ini keadaan data\r\n   yang sah -- bukan kegagalan program. */\r\n.geooss-warn {\r\n  margin-top: 8px; padding: 7px 9px; border-radius: 5px; font-size: 11px;\r\n  line-height: 1.45; color: var(--text-secondary);\r\n  background: var(--bg-card-hover);\r\n  border: 1px dashed var(--border-color);\r\n}\r\n.geooss-warn code {\r\n  font-size: 10.5px; background: var(--bg-tertiary);\r\n  padding: 1px 4px; border-radius: 3px; color: var(--text-primary);\r\n}\r\n\r\n/* Baris detail teknis: untuk pengelola situs, bukan pengguna akhir. Sengaja\r\n   paling redup dan terkecil di dalam pesan supaya tidak mengambil alih\r\n   perhatian dari penjelasan yang lebih penting. */\r\n.geooss-detail {\r\n  display: block; font-size: 10px; color: var(--text-muted);\r\n  font-style: italic; word-break: break-all;\r\n}\r\n\r\n/* Pencarian kegiatan: input + daftar saran.\r\n   .geotani-sls-results dipakai ulang supaya gaya dan posisi (absolute di\r\n   bawah input, max-height 200px) sama persis dengan pencarian desa LBS & LSD\r\n   dan pencarian kabupaten satupeta. Yang ditambahkan hanya state keyboard dan\r\n   highlight kata yang cocok. */\r\n.geooss-cari-saran {\r\n  border-top: 0; border-radius: 0 0 4px 4px;\r\n}\r\n.geooss-cari-saran .geotani-sls-result {\r\n  display: flex; gap: 6px; align-items: baseline; line-height: 1.35;\r\n}\r\n/* Dipakai untuk navigasi keyboard, bukan hanya hover, supaya pengguna tahu\r\n   pilihan mana yang akan diambil saat menekan Enter. */\r\n.geooss-cari-saran .geotani-sls-result.aktif {\r\n  background: var(--bg-card-hover);\r\n  box-shadow: inset 2px 0 0 var(--accent);\r\n}\r\n.geooss-cari-saran .geooss-cari-nama { flex: 1 1 auto; }\r\n.geooss-cari-saran .geooss-cari-kode {\r\n  flex: 0 0 auto; font-size: 9.5px; color: var(--text-muted);\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n/* Potongan yang cocok dengan yang diketik. Sengaja hanya ditebalkan, tanpa\r\n   warna baru, supaya tidak memperkenalkan palet baru ke tema gelap. */\r\n.geooss-cari-saran mark {\r\n  background: rgba(250, 204, 21, .3); color: inherit;\r\n  border-radius: 2px; padding: 0 1px; font-weight: 700;\r\n}\r\n.geooss-cari-saran .geotani-sls-result[data-kosong] {\r\n  color: var(--text-muted); font-style: italic; cursor: default;\r\n}\r\n.geooss-cari-saran .geotani-sls-result[data-kosong]:hover { background: none; }\r\n.geooss-cari-judul {\r\n  padding: 5px 10px; font-size: 9.5px; color: var(--text-muted);\r\n  background: var(--bg-card-hover); border-bottom: 1px solid var(--border-color);\r\n  position: sticky; top: 0;\r\n}\r\n/* Input dinonaktifkan sebelum daftar kegiatan siap, supaya tidak ada\r\n  godaan mengetik sebelum ada yang bisa dicocokkan. */\r\n.geooss-cari-cari:disabled { opacity: .6; cursor: not-allowed; }\r\n[data-theme=\"dark\"] .geooss-cari-saran mark { background: rgba(250, 204, 21, .25); }\r\n\r\n/* Output \"Pre-check KKPR\": ringkasan akhir yang dibaca orang awam.\r\n   Letakkan di atas ringkasan verdict supa
