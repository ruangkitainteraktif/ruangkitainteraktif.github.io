x; justify-content: center; }\r\n    .ze-ts-date { font-size: 11px; font-weight: 600; color: #e2e8f0; }\r\n    .ze-ts-time { font-size: 10px; font-weight: 600; color: #94a3b8; }\r\n    .ze-ts-range {\r\n      display: flex; align-items: center; gap: 2px;\r\n      width: 100%; justify-content: center;\r\n    }\r\n    .ze-ts-range-btn {\r\n      display: inline-flex; align-items: center; justify-content: center;\r\n      height: 20px; padding: 0 6px;\r\n      border: 1px solid rgba(96,165,250,0.3); border-radius: 10px;\r\n      background: transparent; color: #60a5fa;\r\n      font-size: 9px; font-weight: 600; cursor: pointer;\r\n      transition: background .15s, color .15s, border-color .15s; line-height: 1;\r\n    }\r\n    .ze-ts-range-btn:hover { background: rgba(96,165,250,0.15); }\r\n    .ze-ts-range-active {\r\n      background: #60a5fa !important; color: #fff !important;\r\n      border-color: #60a5fa !important;\r\n    }\r\n    @media (max-width: 768px) {\r\n      .ze-time-slider-wrap { width: min(280px, calc(100vw - 32px)); padding: 4px 8px; }\r\n      .ze-ts-btn { width: 24px; height: 24px; }\r\n      .ze-ts-range-btn { height: 18px; padding: 0 4px; font-size: 8px; }\r\n    }\r\n    .unified-slider-section .ze-time-slider-wrap {\r\n      background: transparent !important;\r\n      border: none !important;\r\n      box-shadow: none !important;\r\n      padding: 2px 0;\r\n      width: 100%;\r\n    }\r\n    .unified-slider-section .ze-ts-btn {\r\n      background: rgba(148,163,184,0.12) !important;\r\n      color: #334155 !important;\r\n      border: 1px solid rgba(148,163,184,0.2) !important;\r\n    }\r\n    .unified-slider-section .ze-ts-range-btn {\r\n      background: rgba(148,163,184,0.08) !important;\r\n      color: #475569 !important;\r\n      border-color: rgba(148,163,184,0.25) !important;\r\n    }\r\n    .unified-slider-section .ze-ts-range-btn:hover {\r\n      background: rgba(148,163,184,0.15) !important;\r\n    }\r\n    .unified-slider-section .ze-ts-range-active {\r\n      background: #475569 !important; color: #fff !important;\r\n      border-color: #475569 !important;\r\n    }\r\n\r\n    /* SPPG District Dark Mode */\r\n    [data-theme=\"dark\"] .sppgd-table-panel { background: var(--bg-card); border-color: var(--border-color); }\r\n    [data-theme=\"dark\"] .sppgd-table-title { color: var(--text-primary); border-color: var(--border-color); }\r\n    [data-theme=\"dark\"] .sppgd-table-header { border-color: var(--border-color); }\r\n    [data-theme=\"dark\"] .sppgd-table-search { background: var(--bg-input); border-color: var(--border-color); color: var(--text-primary); }\r\n    [data-theme=\"dark\"] .sppgd-table tbody tr:nth-child(even) { background: var(--bg-secondary); }\r\n    [data-theme=\"dark\"] .sppgd-table tbody tr:hover { background: var(--bg-tertiary); }\r\n    [data-theme=\"dark\"] .sppgd-table td { border-color: var(--border-color); color: var(--text-primary); }\r\n    [data-theme=\"dark\"] .sppgd-pagination { border-color: var(--border-color); }\r\n    [data-theme=\"dark\"] .sppgd-pag-btn { background: var(--bg-secondary); border-color: var(--border-color); color: var(--text-primary); }\r\n    [data-theme=\"dark\"] .sppgd-popup { background: var(--bg-card); color: var(--text-primary); }\r\n    [data-theme=\"dark\"] .sppgd-popup-body { background: var(--bg-card); }\r\n    [data-theme=\"dark\"] .sppgd-popup-item { border-color: var(--border-color); }\r\n    [data-theme=\"dark\"] .sppgd-popup-item-name { color: var(--text-primary); }\r\n    [data-theme=\"dark\"] .sppgd-tooltip { background: var(--bg-card); color: var(--text-primary); }\r\n\r\n/* ── GHRSST SST Anomaly Time Slider (BMKG pattern) ── */\r\n.ghrsst-time-slider-wrap {\r\n      display: flex;\r\n      flex-direction: column;\r\n      align-items: center;\r\n      gap: 4px;\r\n      background: var(--bg-glass);\r\n      backdrop-filter: blur(12px);\r\n      -webkit-backdrop-filter: blur(12px);\r\n      border: 1px solid var(--border-color);\r\n      border-radius: 16px;\r\n      padding: 6px 12px;\r\n      box-shadow: 0 4px 20px rgba(0,0,0,0.12);\r\n      transition: opacity 0.2s, transform 0.2s;\r\n}\r\n.ghrsst-ts-controls {\r\n      display: flex;\r\n      align-items: center;\r\n      gap: 6px;\r\n      width: 100%;\r\n}\r\n.ghrsst-ts-title {\r\n      font-size: 10px;\r\n      font-weight: 700;\r\n      color: var(--text-secondary);\r\n      text-align: center;\r\n      letter-spacing: 0.02em;\r\n}\r\n.ghrsst-ts-btn {\r\n      display: grid;\r\n      place-items: center;\r\n      width: 28px;\r\n      height: 28px;\r\n      border: none;\r\n      border-radius: 50%;\r\n      background: transparent;\r\n      color: #0284c7;\r\n      cursor: pointer;\r\n      transition: background 0.15s, color 0.15s;\r\n      flex-shrink: 0;\r\n      padding: 0;\r\n}\r\n.ghrsst-ts-btn:hover {\r\n      background: #e0f2fe;\r\n      color: #075985;\r\n}\r\n.ghrsst-ts-btn:active {\r\n      background: #bae6fd;\r\n}\r\n.ghrsst-ts-slider-wrap {\r\n      flex: 1;\r\n      min-width: 0;\r\n}\r\n.ghrsst-ts-slider {\r\n      width: 100%;\r\n      height: 4px;\r\n      -webkit-appearance: none;\r\n      appearance: none;\r\n      background: linear-gradient(90deg, #e0f2fe 0%, #0284c7 100%);\r\n      border-radius: 2px;\r\n      outline: none;\r\n      cursor: pointer;\r\n}\r\n.ghrsst-ts-slider::-webkit-slider-thumb {\r\n      -webkit-appearance: none;\r\n      width: 16px;\r\n      height: 16px;\r\n      border-radius: 50%;\r\n      background: #0284c7;\r\n      border: 2px solid #fff;\r\n      box-shadow: 0 1px 6px rgba(2,132,199,0.4);\r\n      cursor: pointer;\r\n      transition: transform 0.15s, box-shadow 0.15s;\r\n}\r\n.ghrsst-ts-slider::-webkit-slider-thumb:hover {\r\n      transform: scale(1.15);\r\n      box-shadow: 0 2px 10px rgba(2,132,199,0.5);\r\n}\r\n.ghrsst-ts-slider::-moz-range-thumb {\r\n      width: 16px;\r\n      height: 16px;\r\n      border-radius: 50%;\r\n      background: #0284c7;\r\n      border: 2px solid #fff;\r\n      box-shadow: 0 1px 6px rgba(2,132,199,0.4);\r\n      cursor: pointer;\r\n}\r\n.ghrsst-ts-info {\r\n      display: flex;\r\n      align-items: center;\r\n      gap: 6px;\r\n      justify-content: center;\r\n}\r\n.ghrsst-ts-date {\r\n      font-size: 11px;\r\n      font-weight: 600;\r\n      color: #334155;\r\n      white-space: nowrap;\r\n      text-align: center;\r\n      letter-spacing: -0.01em;\r\n}\r\n.ghrsst-ts-layer {\r\n      font-size: 10px;\r\n      font-weight: 600;\r\n      color: #64748b;\r\n      white-space: nowrap;\r\n      text-align: center;\r\n      letter-spacing: -0.01em;\r\n}\r\n@media (max-width: 768px) {\r\n  .ghrsst-time-slider-wrap {\r\n    width: min(280px, calc(100vw - 32px));\r\n    padding: 4px 8px;\r\n  }\r\n  .ghrsst-ts-btn { width: 24px; height: 24px; }\r\n  .ghrsst-ts-date { font-size: 10px; }\r\n  .ghrsst-ts-layer { font-size: 9px; }\r\n}\r\n\r\n\r\n/* ── Analisis Polygon (polygon-analysis.js) ─────────────────\r\n   Geometri panel (posisi, tinggi, radius, head, body) memakai aturan\r\n   yang sama dengan .lg-sidebar lewat selector bersama di atas, agar\r\n   keduanya tidak bisa melenceng. Yang di bawah hanya isi kartunya. */\r\n\r\n.pa-count {\r\n  font-size: 10.5px;\r\n  font-weight: 600;\r\n  color: var(--text-secondary);\r\n  background: var(--bg-card-hover);\r\n  border-radius: 20px;\r\n  padding: 2px 8px;\r\n}\r\n\r\n.pa-list {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 10px;\r\n}\r\n.pa-list::-webkit-scrollbar { width: 5px; }\r\n.pa-list::-webkit-scrollbar-track { background: transparent; }\r\n.pa-list::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }\r\n\r\n/* position: relative dipakai menu export di bawahnya agar dropdown punya\r\n   acuan posisi. */\r\n.pa-actions { position: relative; display: flex; align-items: center; gap: 6px; }\r\n.pa-minimize {\r\n  display: grid; width: 28px; height: 28px; place-items: center;\r\n  border: 0; border-radius: 50%; background: var(--bg-tertiary); color: var(--text-tertiary);\r\n  cursor: pointer; transition: background .15s;\r\n}\r\n.pa-minimize:hover { background: var(--border-color); }\r\n.pa-close:hover { background: var(--border-color); }\r\n\r\n/* ══ Kontrol export di kepala panel ══\r\n   Muncul hanya setelah semua analisis selesai. Sengaja tanpa footer supaya\r\n   tidak mengurangi ruang daftar polygon. */\r\n.pa-export { position: relative; display: flex; }\r\n.pa-export[hidden] { display: none; }\r\n.pa-export-btn { position: relative; }\r\n.pa-export.is-open .pa-export-btn { background: var(--border-color); }\r\n\r\n.pa-menu {\r\n  position: absolute;\r\n  top: calc(100% + 5px); right: 0;\r\n  z-index: 30;\r\n  display: flex; flex-direction: column;\r\n  width: 208px; padding: 4px;\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 10px;\r\n  background: var(--bg-primary);\r\n  box-shadow: 0 8px 24px rgba(0, 0, 0, .18);\r\n}\r\n.pa-menu[hidden] { display: none; }\r\n.pa-menu-item {\r\n  display: flex; align-items: flex-start; gap: 8px;\r\n  width: 100%;\r\n  padding: 8px 9px;\r\n  border: 0; border-radius: 7px;\r\n  background: transparent;\r\n  color: var(--text-primary);\r\n  font-family: inherit; font-size: 11.5px; font-weight: 600;\r\n  text-align: left; cursor: pointer;\r\n  transition: background .12s;\r\n}\r\n.pa-menu-item:hover, .pa-menu-item:focus-visible { background: var(--bg-tertiary); outline: none; }\r\n.pa-menu-item[disabled] { opacity: .55; cursor: progress; }\r\n.pa-menu-item[disabled]:hover { background: transparent; }\r\n.pa-menu-item svg { flex: 0 0 auto; margin-top: 1px; color: var(--text-secondary); }\r\n.pa-menu-label { display: flex; flex-direction: column; gap: 1px; min-width: 0; }\r\n.pa-menu-label small {\r\n  font-size: 9.5px; font-weight: 400;\r\n  color: var(--text-secondary);\r\n}\r\n@keyframes pa-pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }\r\n\r\n/* Pesan hasil aksi (ekspor) di atas daftar polygon. */\r\n.pa-notice {\r\n  font-size: 11px; line-height: 1.45;\r\n  padding: 7px 9px; margin-bottom: 8px;\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 5px;\r\n  background: var(--bg-tertiary);\r\n  color: var(--text-primary);\r\n}\r\n.pa-notice.is-error {\r\n    border-color: #b91c1c;\r\n    background: #fef2f2;\r\n    color: #7f1d1d;\r\n}\r\n[data-theme=\"dark\"] .pa-notice.is-error {\r\n    background: #450a0a; border-color: #991b1b; color: #fca5a5;\r\n}\r\n\r\n\r\n.pa-empty {\r\n  font-size: 11.5px;\r\n  color: var(--text-secondary);\r\n  text-align: center;\r\n  padding: 18px 10px;\r\n}\r\n\r\n.pa-card {\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 11px;\r\n  padding: 10px;\r\n  background: var(--bg-card);\r\n}\r\n.pa-card-stale { border-color: #f59e0b; }\r\n\r\n.pa-card-head {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  margin-bottom: 4px;\r\n}\r\n.pa-card-title {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  font-size: 12px;\r\n  font-weight: 700;\r\n  color: var(--text-primary);\r\n}\r\n.pa-card-index {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  width: 17px;\r\n  height: 17px;\r\n  border-radius: 50%;\r\n  background: var(--accent);\r\n  color: #fff;\r\n  font-size: 10px;\r\n  font-weight: 700;\r\n}\r\n.pa-card-tools { margin-left: auto; }\r\n.pa-icon {\r\n  border: none;\r\n  background: transparent;\r\n  color: var(--text-secondary);\r\n  font-size: 17px;\r\n  line-height: 1;\r\n  cursor: pointer;\r\n  padding: 1px 5px;\r\n  border-radius: 5px;\r\n}\r\n.pa-icon:hover { background: #fee2e2; color: #dc2626; }\r\n\r\n.pa-area {\r\n  font-size: 10.5px;\r\n  color: var(--text-secondary);\r\n  margin-bottom: 8px;\r\n}\r\n\r\n.pa-stale {\r\n  font-size: 10.5px;\r\n  line-height: 1.45;\r\n  color: #92400e;\r\n  background: #fef3c7;\r\n  border: 1px solid #fcd34d;\r\n  border-radius: 7px;\r\n  padding: 6px 7px;\r\n  margin-bottom: 8px;\r\n}\r\n.pa-link {\r\n  border: none;\r\n  background: transparent;\r\n  color: #b45309;\r\n  font-size: 10.5px;\r\n  font-weight: 700;\r\n  text-decoration: underline;\r\n  cursor: pointer;\r\n  padding: 0;\r\n}\r\n\r\n/* Status langkah analisis GeoFarm (unduhan raster, pemuatan scene, dan\r\n   seterusnya). Dipakai satu elemen saja, jadi gayanya tidak berisiko\r\n   menabrak komponen lain.\r\n\r\n   Teksnya dipusatkan dan diberi ruang di atas serta bawah supaya tidak\r\n   menempel ke baris \"Analisis\" di atasnya maupun ke section pertama di\r\n   bawahnya. Tadi margin bawahnya cuma 8px dan tidak ada margin atas sama\r\n   sekali, jadi barisnya duduk rapat ke tombol. */\r\n.pa-status {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  gap: 6px;\r\n  font-size: 10.5px;\r\n  color: var(--text-secondary);\r\n  margin: 12px 0;\r\n  padding: 8px 12px;\r\n  text-align: center;\r\n  }\r\n.pa-spin {\r\n  width: 11px;\r\n  height: 11px;\r\n  border: 2px solid var(--border-color);\r\n  border-top-color: var(--accent);\r\n  border-radius: 50%;\r\n  animation: pa-spin .7s linear infinite;\r\n  flex-shrink: 0;\r\n}\r\n@keyframes pa-spin { to { transform: rotate(360deg); } }\r\n\r\n.pa-section { border-top: 1px solid var(--border-color); padding-top: 8px; margin-top: 8px; }\r\n.pa-section:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }\r\n.pa-section-head {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 6px;\r\n  font-size: 10px;\r\n  font-weight: 700;\r\n  text-transform: uppercase;\r\n  letter-spacing: .06em;\r\n  color: var(--text-secondary);\r\n  margin-bottom: 6px;\r\n}\r\n.pa-section-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; }\r\n.pa-section-tools { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }\r\n\r\n.pa-collapse-btn,\r\n.pa-eye-btn {\r\n  display: grid;\r\n  place-items: center;\r\n  width: 22px;\r\n  height: 22px;\r\n  padding: 0;\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 6px;\r\n  background: var(--bg-card);\r\n  color: var(--text-secondary);\r\n  cursor: pointer;\r\n  transition: background .15s, color .15s, border-color .15s;\r\n}\r\n.pa-collapse-btn:hover,\r\n.pa-eye-btn:hover {\r\n  background: var(--bg-card-hover);\r\n  color: var(--text-primary);\r\n}\r\n.pa-collapse-btn svg { transition: transform .2s ease; }\r\n.pa-collapse-btn.is-collapsed svg { transform: rotate(-90deg); }\r\n.pa-section.is-collapsed .pa-section-head { margin-bottom: 0; }\r\n.pa-section.is-collapsed .pa-section-body { display: none; }\r\n\r\n.pa-eye-btn.is-on { color: var(--accent); border-color: var(--accent); }\r\n.pa-eye-btn.is-on:hover { color: var(--accent); }\r\n.pa-eye-btn:focus-visible,\r\n.pa-collapse-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }\r\n\r\n.pa-cloud {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  font-size: 10.5px;\r\n  color: var(--text-secondary);\r\n  margin-bottom: 5px;\r\n}\r\n.pa-cloud-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }\r\n.pa-cloud-label { color: var(--text-secondary); }\r\n.pa-cloud-value { margin-left: auto; font-weight: 700; }\r\n.pa-cloud-badge {\r\n  border: 1px solid;\r\n  border-radius: 20px;\r\n  padding: 1px 7px;\r\n  font-size: 9.5px;\r\n  font-weight: 700;\r\n}\r\n\r\n.pa-block {\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 8px;\r\n  padding: 8px;\r\n  margin-top: 7px;\r\n  background: var(--bg-primary);\r\n}\r\n.pa-block-muted { font-size: 10.5px; color: var(--text-secondary); }\r\n/* Judul tiap analisis di dalam section (mis. NDMI, NDRE, NDWI, LST).\r\n   Dipisah dari .pa-card-head yang dipakai untuk kartu polygon. */\r\n.pa-item-head {\r\n  display: flex; align-items: baseline; gap: 6px;\r\n  margin: -1px 0 6px; padding-bottom: 5px;\r\n  border-bottom: 1px solid var(--border-color);\r\n}\r\n.pa-item-head > b { font-size: 11.5px; font-weight: 700; color: var(--text-primary); }\r\n.pa-item-head > span { font-size: 9.5px; color: var(--text-secondary); min-width: 0; }\r\n\r\n.pa-block-note {\r\n  font-size: 9.5px;\r\n  color: var(--text-secondary);\r\n  text-align: center;\r\n  margin-top: 6px;\r\n}\r\n.pa-block-error {\r\n  font-size: 10.5px;\r\n  line-height: 1.45;\r\n  color: #b91c1c;\r\n  background: #fef2f2;\r\n  border-color: #fecaca;\r\n}\r\n.pa-meta { font-size: 9.5px; color: var(--text-secondary); margin-top: 6px; }\r\n\r\n.pa-stats {\r\n  display: grid;\r\n  grid-template-columns: repeat(4, 1fr);\r\n  gap: 5px;\r\n}\r\n.pa-stat {\r\n  text-align: center;\r\n  background: var(--bg-card-hover);\r\n  border-radius: 7px;\r\n  padding: 5px 2px;\r\n}\r\n.pa-stat span { display: block; font-size: 9px; color: var(--text-secondary); margin-bottom: 1px; }\r\n.pa-stat b { font-size: 11.5px; color: var(--text-primary); }\r\n\r\n   .pa-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }\r\n   .pa-btn-row .pa-btn { margin-top: 7px; }\r\n   /* Baris \"Analisis ulang\" / \"Reset analisis\". Baris ini jadi tempat\r\n      kembali setelah analisis selesai, jadi diberi jarak lebih longgar dari\r\n      baris tombol di dalam section supaya tidak terlihat sebagai bagian dari\r\n      section terakhir. Reset sengaja tidak diberi warna merah: ia menghapus\r\n      hasil hitungan yang bisa diulang, bukan mencabut polygon seperti tombol\r\n      × di kepala kartu. */\r\n   .pa-btn-row-reanalyze { margin: 4px 0 2px; }\r\n/* Baris tombol yang hanya berisi satu tombol (mis. \"Hitung\" indeks lanjutan)\r\n   dibuat selebar panel supaya luas sentuhnya enak untuk jari. */\r\n.pa-btn-row-single { grid-template-columns: 1fr; }\r\n.pa-btn[disabled] { opacity: .6; cursor: progress; }\r\n\r\n/* Subjudul pemisah kelompok di dalam satu section (mis. \"Indeks lanjutan\"\r\n   di bawah indeks otomatis pada section Indeks Spektral). */\r\n.pa-subhead {\r\n    margin: 12px 0 2px; padding-top: 9px;\r\n    border-top: 1px solid var(--border-color);\r\n    font-size: 10px; font-weight: 700;\r\n    letter-spacing: .04em; text-transform: uppercase;\r\n    color: var(--text-secondary);\r\n}\r\n.pa-note { font-size: 10.5px; line-height: 1.45; color: var(--text-secondary); }\r\n\r\n.pa-trend { padding: 8px 8px 6px; }\r\n.pa-trend-head { display: flex; flex-direction: column; gap: 1px; margin-bottom: 4px; }\r\n.pa-trend-title { font-size: 11px; font-weight: 700; color: var(--text-primary); }\r\n.pa-trend-meta { font-size: 9px; color: var(--text-secondary); }\r\n.pa-trend-svg { display: block; width: 100%; height: auto; overflow: visible; }\r\n.pa-trend-grid { stroke: var(--border-color); stroke-width: 1; stroke-dasharray: 2 3; }\r\n.pa-trend-zero { stroke: var(--text-secondary); stroke-width: 1; opacity: .45; }\r\n.pa-trend-axis, .pa-trend-x { fill: var(--text-secondary); font-size: 8px; }\r\n.pa-trend-line { fill: none; stroke: #16a34a; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }\r\n.pa-trend-area { stroke: none; }\r\n.pa-trend-band { stroke: #16a34a; stroke-width: 1.4; opacity: .22; fill: none; stroke-linecap: round; }\r\n.pa-trend-dot { fill: #16a34a; stroke: var(--bg-card); stroke-width: 1; }\r\n.pa-trend-dot-cloudy { fill: #fff; stroke: #16a34a; stroke-width: 1.4; }\r\n.pa-trend-dot:hover { fill: #0f172a; r: 3.4; }\r\n.pa-trend-legend {\r\n  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;\r\n  font-size: 9px; color: var(--text-secondary); margin-top: 3px;\r\n}\r\n.pa-trend-key { width: 14px; height: 2px; border-radius: 2px; background: #16a34a; }\r\n.pa-trend-key-band { width: 14px; height: 6px; border-radius: 2px; background: rgba(22, 163, 74, .22); margin-left: 6px; }\r\n.pa-trend-key-cloudy { width: 8px; height: 8px; border-radius: 50%; border: 1.4px solid #16a34a; background: #fff; margin-left: 6px; }\r\n.pa-trend-note { font-size: 9px; color: var(--text-secondary); margin-top: 5px; line-height: 1.35; }\r\n.pa-trend-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 7px; }\r\n.pa-trend-stat { text-align: center; background: var(--bg-card-hover); border-radius: 7px; padding: 5px 2px; }\r\n.pa-trend-stat span { display: block; font-size: 9px; color: var(--text-secondary); margin-bottom: 1px; }\r\n.pa-trend-stat b { font-size: 11.5px; color: var(--text-primary); }\r\n.pa-trend-stat b.naik { color: #16a34a; }\r\n.pa-trend-stat b.turun { color: #dc2626; }\r\n\r\n.pa-soil-grid { display: flex; flex-direction: column; gap: 4px; }\r\n.pa-soil-grid-detail { margin-top: 4px; }\r\n.pa-soil-row {\r\n  display: grid;\r\n  grid-template-columns: 52px 1fr 1fr 1fr;\r\n  gap: 4px;\r\n  align-items: center;\r\n  font-size: 10px;\r\n  background: var(--bg-card-hover);\r\n  border-radius: 6px;\r\n  padding: 4px 6px;\r\n}\r\n.pa-soil-row-detail { grid-template-columns: 40px repeat(6, 1fr); font-size: 9px; }\r\n.pa-soil-band { font-weight: 700; color: var(--text-primary); }\r\n.pa-soil-stat { color: var(--text-secondary); }\r\n\r\n/* Dua mode analisis: Otomatis (jalur lama) dan Mandiri (pilihan pengguna) */\r\n/* Pemilih mode analisis.\r\n   Mengikuti ArcGIS (Calcite): kartu opsi sejajar dengan ikon, keadaan aktif\r\n   terisi penuh -- bukan sekadar garis bawah seperti segmented control biasa.\r\n   Dipakai dua kartu (bukan tombol) karena mode menentukan sumber citra dan\r\n   cara hitung, jadi bedanya harus terbaca sekilas, bukan setelah diklik. */\r\n  .pa-mode {\r\n    margin: 6px 0 8px;\r\n    padding: 8px;\r\n    background: var(--bg-card-hover);\r\n    border: 1px solid var(--border-color);\r\n    border-radius: 6px;\r\n  }\r\n.pa-mode-head {\r\n  display: flex;\r\n  align-items: baseline;\r\n  gap: 6px;\r\n  margin-bottom: 6px;\r\n}\r\n.pa-mode-label {\r\n  font-size: 9px;\r\n  font-weight: 700;\r\n  letter-spacing: 0.07em;\r\n  text-transform: uppercase;\r\n  color: var(--text-primary);\r\n}\r\n.pa-mode-sub {\r\n  font-size: 9px;\r\n  color: var(--text-secondary);\r\n}\r\n.pa-mode-opts {\r\n  display: grid;\r\n  grid-template-columns: 1fr 1fr;\r\n  gap: 4px;\r\n}\r\n.pa-mode-opt {\r\n  display: flex;\r\n  align-items: flex-start;\r\n  gap: 6px;\r\n  font: inherit;\r\n  text-align: left;\r\n  padding: 6px 7px;\r\n  background: var(--bg-card);\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 4px;\r\n  color: var(--text-secondary);\r\n  cursor: pointer;\r\n  transition: background 0.12s, border-color 0.12s, color 0.12s;\r\n}\r\n.pa-mode-opt:hover { border-color: var(--accent); }\r\n.pa-mode-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }\r\n.pa-mode-ico {\r\n  flex: none;\r\n  margin-top: 1px;\r\n  /* Ikon dibuat kabur saat tidak aktif supaya kartu aktif yang menonjol. */\r\n  opacity: 0.55;\r\n}\r\n.pa-mode-txt {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 1px;\r\n  min-width: 0;\r\n}\r\n.pa-mode-title {\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  color: var(--text-primary);\r\n  line-height: 1.2;\r\n}\r\n.pa-mode-desc {\r\n  font-size: 8px;\r\n  line-height: 1.35;\r\n  color: var(--text-secondary);\r\n}\r\n.pa-mode-opt.is-on {\r\n  background: var(--accent);\r\n  border-color: var(--accent);\r\n  color: #fff;\r\n}\r\n.pa-mode-opt.is-on .pa-mode-title { color: #fff; }\r\n.pa-mode-opt.is-on .pa-mode-desc { color: rgba(255, 255, 255, 0.85); }\r\n.pa-mode-opt.is-on .pa-mode-ico { opacity: 1; }\r\n.pa-mode-note {\r\n  margin: 6px 0 0;\r\n  font-size: 9px;\r\n  line-height: 1.45;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.pa-manual { margin-top: 8px; }\r\n.pa-manual-step { margin-bottom: 10px; }\r\n.pa-subhead {\r\n  font-size: 10px;\r\n  font-weight: 700;\r\n  color: var(--text-primary);\r\n  text-transform: uppercase;\r\n  letter-spacing: 0.04em;\r\n  margin-bottom: 4px;\r\n}\r\n.pa-inline {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 3px;\r\n  font-size: 10px;\r\n  color: var(--text-secondary);\r\n}\r\n.pa-num {\r\n  width: 52px;\r\n  font: inherit;\r\n  font-size: 10px;\r\n  color: var(--text-primary);\r\n  background: var(--bg-card);\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 4px;\r\n  padding: 2px 4px;\r\n}\r\n.pa-check {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n  font-size: 10px;\r\n  color: var(--text-secondary);\r\n  margin: 6px 0 2px;\r\n  cursor: pointer;\r\n}\r\n.pa-scene-list {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 2px;\r\n  max-height: 190px;\r\n  overflow-y: auto;\r\n  /* Nama satelit di .pa-scene-sat memakai white-space: nowrap, jadi tanpa ini\r\n     sumbu horizontal ikut auto dan daftar bisa digeser mendatar. */\r\n  overflow-x: hidden;\r\n  margin: 6px 0;\r\n}\r\n.pa-scene {\r\n  display: grid;\r\n  grid-template-columns: 74px 52px 1fr;\r\n  gap: 6px;\r\n  align-items: center;\r\n  font: inherit;\r\n  font-size: 10px;\r\n  text-align: left;\r\n  padding: 4px 6px;\r\n  background: var(--bg-card-hover);\r\n  border: 1px solid transparent;\r\n  border-radius: 6px;\r\n  color: var(--text-secondary);\r\n  cursor: pointer;\r\n}\r\n.pa-scene:hover { border-color: var(--border-color); }\r\n.pa-scene.is-active {\r\n  border-color: var(--accent);\r\n  background: var(--bg-card);\r\n  color: var(--text-primary);\r\n  font-weight: 600;\r\n}\r\n.pa-scene-date { font-variant-numeric: tabular-nums; }\r\n.pa-scene-cloud { font-variant-numeric: tabular-nums; color: #2e7d32; }\r\n.pa-scene-cloud.is-high { color: #c62828; font-weight: 700; }\r\n.pa-scene-sat { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.pa-scene-picked { font-size: 10px; }\r\n.pa-manual-head { font-size: 10px; color: var(--text-secondary); margin-bottom: 3px; }\r\n.pa-manual-result { font-size: 10px; }\r\n\r\n.pa-idx-grid {\r\n  display: grid;\r\n  grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));\r\n  gap: 3px;\r\n  margin: 4px 0;\r\n}\r\n.pa-idx {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 1px;\r\n  padding: 4px 6px;\r\n  background: var(--bg-card-hover);\r\n  border: 1px solid transparent;\r\n  border-radius: 6px;\r\n  cursor: pointer;\r\n}\r\n.pa-idx.is-on { border-color: var(--accent); background: var(--bg-card); }\r\n.pa-idx-name { font-size: 11px; font-weight: 600; color: var(--text-primary); }\r\n.pa-idx-formula {\r\n  font-size: 8px;\r\n  color: var(--text-secondary);\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n}\r\n.pa-stat.is-primary b { color: var(--accent); }\r\n\r\n/* Baris tanggal citra di bawah badge awan. Kelas .pa-cloud-caveat yang\r\n   pernah berpasangan dengan .pa-cloud-date sudah dihapus bersamanya dengan\r\n   teks \"estimasi katalog\" di polygon-analysis.js. */\r\n.pa-cloud-date {\r\n  flex: 1 0 100%;\r\n  font-size: 8px;\r\n  color: var(--text-secondary);\r\n  line-height: 1.35;\r\n}\r\n\r\n/* Kebutuhan air tanaman (ETc) */\r\n  /* Section air memakai template .pa-section yang sama persis dengan section\r\n     lain (NDVI, Indeks Spektral, LST, Topografi): garis pemisah di atas,\r\n     judul uppercase kecil, tanpa kotak dan tanpa garis aksen di kiri.\r\n     Dulu section ini punya latar, border penuh, dan bar aksen di kiri, jadi\r\n     terbaca sebagai kartu tersendiri yang tidak cocok dengan section di\r\n     bawahnya. Kelas .pa-section-air tetap ada karena JS memakainya untuk\r\n     state ciut dan untuk menaruh section ini sebelum NDVI.\r\n\r\n     Catatan di dalam section ini juga memakai .pa-note apa adanya, tanpa\r\n     override ukuran huruf atau margin, supaya sama persis dengan catatan di\r\n     section lain. */\r\n\r\n  /* Field tanaman: label di atas, select penuh di bawah. Label-inline lama\r\n     membuat select terpotong karena nama tanaman panjang (\"Kelapa Sawit\").\r\n     Ini pola komponen form ArcGIS. */\r\n.pa-air-field { margin: 0 0 8px; }\r\n.pa-air-label {\r\n  display: block;\r\n  margin: 0 0 3px;\r\n  font-size: 9px;\r\n  font-weight: 700;\r\n  letter-spacing: 0.06em;\r\n  text-transform: uppercase;\r\n  color: var(--text-secondary);\r\n}\r\n/* Jarak atas 6px: label TANAMAN hanya menyisakan 3px ke bawah (lihat\r\n   .pa-air-label), jadi select lama menempel terlalu dekat pada labelnya.\r\n   Margin ditaruh di wrap, bukan di select, supaya caret ikut terdorong dan\r\n   tetap menempel di tengah tinggi select. */\r\n.pa-air-select-wrap { position: relative; display: block; margin-top: 6px; }\r\n.pa-air-select {\r\n  width: 100%;\r\n  min-width: 0;\r\n  font: inherit;\r\n  font-size: 11.5px;\r\n  color: var(--text-primary);\r\n  background: var(--bg-card);\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 4px;\r\n  padding: 6px 24px 6px 8px;\r\n  cursor: pointer;\r\n  appearance: none;\r\n  -webkit-appearance: none;\r\n}\r\n.pa-air-select:hover { border-color: var(--accent); }\r\n.pa-air-select:focus {\r\n  outline: none;\r\n  border-color: var(--accent);\r\n  box-shadow: 0 0 0 2px rgba(8, 145, 178, .22);\r\n}\r\n.pa-air-caret {\r\n  position: absolute;\r\n  right: 7px;\r\n  top: 50%;\r\n  transform: translateY(-50%);\r\n  pointer-events: none;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n/* Tombol Hitung: satu-satunya aksi utama di section ini, jadi solid accent\r\n   dengan ikon -- bukan ghost seperti tombol section lain. Geometrinya\r\n   (margin, padding, radius, ukuran huruf) disamakan dengan .pa-btn supaya\r\n   tidak terlihat seperti komponen dari template yang berbeda. */\r\n.pa-air-calc {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  gap: 6px;\r\n  width: 100%;\r\n  margin-top: 7px;\r\n  padding: 5px 8px;\r\n  font: inherit;\r\n  font-size: 10.5px;\r\n  font-weight: 600;\r\n  color: #fff;\r\n  background: var(--accent);\r\n  border: 1px solid var(--accent);\r\n  border-radius: 7px;\r\n  cursor: pointer;\r\n  transition: background .15s;\r\n}\r\n.pa-air-calc:hover:not([disabled]) {\r\n  background: #0e7490;\r\n  border-color: #0e7490;\r\n}\r\n.pa-air-calc:active:not([disabled]) { background: #155e75; }\r\n.pa-air-calc:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }\r\n.pa-air-calc[disabled] {\r\n  background: var(--bg-card-hover);\r\n  border-color: var(--border-color);\r\n  color: var(--text-muted);\r\n  cursor: progress;\r\n}\r\n.pa-air-calc-ico { flex-shrink: 0; }\r\n.pa-air-calc-ico.is-spin { animation: pa-air-spin 0.9s linear infinite; }\r\n@keyframes pa-air-spin { to { transform: rotate(360deg); } }\r\n.pa-air-hero {\r\n  display: flex;\r\n  align-items: baseline;\r\n  gap: 8px;\r\n  padding: 6px 0 8px;\r\n  border-bottom: 1px solid var(--border-color);\r\n  margin-bottom: 6px;\r\n}\r\n.pa-air-hero-val {\r\n  font-size: 20px;\r\n  font-weight: 700;\r\n  color: var(--accent);\r\n  line-height: 1.1;\r\n  white-space: nowrap;\r\n}\r\n.pa-air-hero-val sup { font-size: 11px; font-weight: 600; }\r\n.pa-air-hero-lab {\r\n  font-size: 9px;\r\n  color: var(--text-secondary);\r\n  line-height: 1.35;\r\n}\r\n.pa-air-row {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 8px;\r\n  font-size: 10px;\r\n  color: var(--text-secondary);\r\n  background: var(--bg-card-hover);\r\n  border-radius: 6px;\r\n  padding: 4px 6px;\r\n  margin-bottom: 3px;\r\n}\r\n.pa-air-row > span:last-child { color: var(--text-primary); font-weight: 600; }\r\n.pa-air-month > span:first-child { width: 26px; flex: none; }\r\n.pa-air-month > span:last-child { width: 40px; flex: none; text-align: right; }\r\n.pa-air-bar-wrap {\r\n  flex: 1;\r\n  min-width: 0;\r\n  height: 6px;\r\n  background: var(--bg-card);\r\n  border-radius: 3px;\r\n  overflow: hidden;\r\n}\r\n.pa-air-bar {\r\n  display: block;\r\n  height: 100%;\r\n  background: var(--accent);\r\n  border-radius: 3px;\r\n}\r\n.pa-air-src {\r\n  margin-top: 4px;\r\n  font-size: 9px;\r\n  color: var(--text-secondary);\r\n  line-height: 1.4;\r\n}\r\n.pa-soil-stat b { color: var(--text-primary); font-weight: 600; }\r\n\r\n.pa-cbar { margin-top: 6px; margin-bottom: 10px; }\r\n.pa-cbar-bar {\r\n  height: 10px;\r\n  border-radius: 3px;\r\n  border: 1px solid var(--border-color);\r\n}\r\n.pa-cbar-ticks {\r\n  position: relative;\r\n  height: 13px;\r\n  margin-top: 3px;\r\n}\r\n.pa-cbar-tick {\r\n  position: absolute;\r\n  transform: translateX(-50%);\r\n  font-size: 8.5px;\r\n  line-height: 1;\r\n  color: var(--text-secondary);\r\n  white-space: nowrap;\r\n}\r\n.pa-cbar-tick:first-child { transform: none; }\r\n.pa-cbar-tick:last-child { transform: translateX(-100%); }\r\n.pa-cbar-classes {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  gap: 3px 8px;\r\n  margin-top: 4px;\r\n}\r\n.pa-cbar-class {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 3px;\r\n  font-size: 8.5px;\r\n  color: var(--text-secondary);\r\n  white-space: nowrap;\r\n}\r\n.pa-cbar-class i {\r\n  width: 8px;\r\n  height: 8px;\r\n  border-radius: 2px;\r\n  border: 1px solid rgba(15, 23, 42, .2);\r\n  flex-shrink: 0;\r\n}\r\n.pa-soil-chart-title { font-size: 10px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }\r\n.pa-soil-legend {\r\n  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;\r\n  font-size: 9px; color: var(--text-secondary); margin-top: 4px;\r\n}\r\n.pa-soil-key-bar { width: 10px; height: 10px; border-radius: 2px; background: #2563eb; }\r\n.pa-soil-key-range { width: 10px; height: 6px; border-radius: 2px; background: #94a3b8; opacity: 0.5; margin-left: 6px; }\r\n.pa-soil-key-minmax { width: 2px; height: 12px; background: #475569; margin-left: 6px; }\r\n\r\n.pa-warn {\r\n  font-size: 9.5px;\r\n  color: #92400e;\r\n  background: #fffbeb;\r\n  border-radius: 6px;\r\n  padding: 4px 6px;\r\n  margin-top: 6px;\r\n}\r\n\r\n#geotoolsTabGeoFarm .geofarm-draw-btn {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  gap: 8px;\r\n  width: 100%;\r\n  padding: 12px 16px;\r\n  margin-bottom: 12px;\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n  font-family: inherit;\r\n  border: 1.5px solid #0891b2;\r\n  border-radius: 10px;\r\n  background: linear-gradient(135deg, #0891b2, #0e7490);\r\n  color: #fff;\r\n  cursor: pointer;\r\n  box-shadow: 0 2px 8px rgba(8, 145, 178, .25);\r\n  transition: background .2s, box-shadow .2s, transform .2s;\r\n}\r\n#geotoolsTabGeoFarm .geofarm-draw-btn:hover:not([disabled]) {\r\n  background: linear-gradient(135deg, #0e7490, #155e75);\r\n  box-shadow: 0 4px 12px rgba(8, 145, 178, .35);\r\n  transform: translateY(-1px);\r\n}\r\n#geotoolsTabGeoFarm .geofarm-draw-btn[disabled] { cursor: progress; }\r\n\r\n/* ── GeoFarm: impor polygon dari file ──\r\n   Tombol unggah memakai warna amber supaya bedanya jelas dari tombol\r\n   \"Buat Polygon\" yang biru, dan sama dengan garis poligon unggahan di peta. */\r\n#geotoolsTabGeoFarm .geofarm-upload-btn {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  gap: 8px;\r\n  width: 100%;\r\n  padding: 12px 16px;\r\n  margin-bottom: 10px;\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n  font-family: inherit;\r\n  border: 1.5px solid #d97706;\r\n  border-radius: 10px;\r\n  background: linear-gradient(135deg, #f59e0b, #d97706);\r\n  color: #fff;\r\n  cursor: pointer;\r\n  box-shadow: 0 2px 8px rgba(217, 119, 6, .25);\r\n  transition: background .2s, box-shadow .2s, transform .2s;\r\n}\r\n#geotoolsTabGeoFarm .geofarm-upload-btn:hover {\r\n  background: linear-gradient(135deg, #d97706, #b45309);\r\n  box-shadow: 0 4px 12px rgba(217, 119, 6, .35);\r\n  transform: translateY(-1px);\r\n}\r\n.geofarm-upload-input { display: none; }\r\n\r\n/* ── GeoFarm: tombol pemanggil sheet analisis ──\r\n   Sheet analisis tidak muncul otomatis begitu polygon dibuat, jadi tombol\r\n   inilah satu-satunya jalan membukanya. Tombolnya hidup di dalam tab ini,\r\n   bukan melayang di atas peta, supaya tidak menutupi peta dan tidak\r\n   bertabrakan dengan baris chip sheet lain di sisi bawah.\r\n\r\n   Warnanya hijau, berbeda dari dua tombol di atasnya: biru untuk \"Buat\r\n   Polygon\", amber untuk \"Unggah Polygon\". Tiga warna itu menandai kelompok\r\n   aksi yang berbeda, jadi urutannya terbaca sebagai langkah. */\r\n#geotoolsTabGeoFarm .geofarm-open-analysis-btn {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  flex-wrap: wrap;\r\n  gap: 8px;\r\n  width: 100%;\r\n  padding: 12px 16px;\r\n  margin-bottom: 10px;\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n  font-family: inherit;\r\n  border: 1.5px solid #16a34a;\r\n  border-radius: 10px;\r\n  background: linear-gradient(135deg, #16a34a, #15803d);\r\n  color: #fff;\r\n  cursor: pointer;\r\n  box-shadow: 0 2px 8px rgba(22, 163, 74, .25);\r\n  transition: background .2s, box-shadow .2s, transform .2s;\r\n}\r\n#geotoolsTabGeoFarm .geofarm-open-analysis-btn:hover {\r\n  background: linear-gradient(135deg, #15803d, #166534);\r\n  box-shadow: 0 4px 12px rgba(22, 163, 74, .35);\r\n  transform: translateY(-1px);\r\n}\r\n#geotoolsTabGeoFarm .geofarm-open-analysis-btn:focus-visible {\r\n  outline: 2px solid var(--accent);\r\n  outline-offset: 2px;\r\n}\r\n#geotoolsTabGeoFarm .geofarm-open-analysis-btn[hidden] { display: none; }\r\n.geofarm-open-analysis-label { white-space: nowrap; }\r\n/* Kedua badge mengikuti gaya .pa-count yang sudah ada, tapi kontrasnya\r\n   dibalik karena latar tombol sudah hijau. */\r\n.geofarm-open-analysis-btn .geofarm-open-analysis-count,\r\n.geofarm-open-analysis-btn .geofarm-open-analysis-pending {\r\n  padding: 2px 8px;\r\n  border-radius: 10px;\r\n  background: rgba(255, 255, 255, .22);\r\n  color: #fff;\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  white-space: nowrap;\r\n}\r\n.geofarm-open-analysis-pending[hidden] { display: none; }\r\n\r\n/* Keterangan khusus berkas SHP. Dipakai <details> supaya tidak memakan\r\n   ruang di GeoTools yang sudah sempit, tapi tetap tersedia saat dibutuhkan. */\r\n  .geofarm-shp-note {\r\n    /* Jarak atas 10px: tanpa ini blok ini menempel ke tombol \"Buka Analisis\"\r\n       di atasnya dan terbaca sebagai bagian dari tombol itu, bukan blok\r\n       tersendiri. Ritme 10px sama dengan .geofarm-guide di bawahnya; karena\r\n       keduanya bersaudara, marginnya bertumpuk jadi tetap 10px -- bukan 20px. */\r\n    margin: 10px 0;\r\n    border: 1px solid var(--border-color);\r\n    border-radius: 8px;\r\n    background: var(--bg-primary);\r\n  }\r\n.geofarm-shp-note-summary {\r\n  padding: 8px 10px;\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  color: var(--text-secondary);\r\n  cursor: pointer;\r\n  list-style: none;\r\n}\r\n.geofarm-shp-note-summary::-webkit-details-marker { display: none; }\r\n.geofarm-shp-note-summary::before { content: '\\25B8\\00a0'; display: inline-block; transition: transform .15s; }\r\n.geofarm-shp-note[open] > .geofarm-shp-note-summary::before { transform: rotate(90deg); }\r\n.geofarm-shp-note-summary:hover { background: var(--bg-card-hover); }\r\n.geofarm-shp-note-body {\r\n  padding: 0 10px 10px;\r\n  border-top: 1px solid var(--border-color);\r\n}\r\n.geofarm-shp-note-body p {\r\n  margin: 8px 0 6px;\r\n  font-size: 10.5px;\r\n  line-height: 1.55;\r\n  color: var(--text-secondary);\r\n}\r\n.geofarm-shp-note-body ul {\r\n  margin: 6px 0;\r\n  padding-left: 16px;\r\n  font-size: 10.5px;\r\n  line-height: 1.55;\r\n  color: var(--text-secondary);\r\n}\r\n.geofarm-shp-note-body li { margin-bottom: 4px; }\r\n.geofarm-shp-note-body b { color: var(--text-primary); }\r\n.geofarm-shp-note-body code {\r\n  padding: 1px 4px;\r\n  border-radius: 4px;\r\n  background: var(--bg-tertiary);\r\n  font-size: 10px;\r\n  color: var(--text-primary);\r\n}\r\n  /* Jarak atasnya sengaja 8px: blok status sekarang duduk tepat di bawah\r\n     baris tombol Buat/Unggah dan tepat di atas tombol Buka Analisis. Tanpa\r\n     jarak atas, pesan menempel pada baris tombol di atasnya dan terbaca\r\n     sebagai bagian dari tombol itu, bukan sebagai hasil aksi. */\r\n  .geofarm-upload-status {\r\n    margin: 8px 0 6px;\r\n    padding: 8px 10px;\r\n    font-size: 11px;\r\n    line-height: 1.45;\r\n    border-radius: 8px;\r\n    border: 1px solid var(--border-color);\r\n    background: var(--bg-primary);\r\n    color: var(--text-secondary);\r\n  }\r\n.geofarm-upload-status.is-busy { color: var(--text-primary); }\r\n.geofarm-upload-status.is-warn {\r\n  border-color: #f59e0b;\r\n  background: #fffbeb;\r\n  color: #92400e;\r\n}\r\n.geofarm-upload-status.is-error {\r\n  border-color: #dc2626;\r\n  background: #fef2f2;\r\n  color: #b91c1c;\r\n}\r\n.geofarm-upload-status.is-ok {\r\n  border-color: #16a34a;\r\n  background: #f0fdf4;\r\n  color: #166534;\r\n}\r\n[data-theme=\"dark\"] .geofarm-upload-status.is-warn { background: #422006; border-color: #a16207; color: #fde68a; }\r\n[data-theme=\"dark\"] .geofarm-upload-status.is-error { background: #450a0a; border-color: #991b1b; color: #fca5a5; }\r\n[data-theme=\"dark\"] .geofarm-upload-status.is-ok { background: #052e16; border-color: #15803d; color: #bbf7d0; }\r\n\r\n/* ── GeoFarm: Kalkulator Benih & Pupuk ──\r\n   Satu kartu, dua tab (Benih / Pupuk), satu field luas bersama. Kepala\r\n   kartu ini memakai .gt-card-head yang sama dengan kartu LBS & LSD, tapi\r\n   input dan warnanya TIDAK memakai .geotani-form-input:\r\n   kelas itu warnanya dikunci ke putih/teks gelap tanpa override dark,\r\n   sedangkan kartu ini punya state is-warn/is-ok sendiri seperti\r\n   .geofarm-upload-status di atas.\r\n\r\n   Kelas .geofarm-benih-* yang tersisa (total, rows, luas-info, warn)\r\n   sengaja dipertahankan namanya: yang dipakai geofarm-kalkulator.js untuk\r\n   hasil hitungan Benih, yang warnanya sudah sama dengan kartu ini. */\r\n/* ============ KARTU GEOFARM ANALISIS ============\r\n   Dulu \"Buat Polygon\" dan \"Unggah Polygon\" berdiri sebagai tombol lepas di\r\n   atas tab, sehingga sheet GeoTools terbaca sebagai daftar tombol tanpa\r\n   konteks. Sekarang keduanya, tombol Buka Analisis, dan panduan dikelompokkan\r\n   dalam satu kartu bernama. Kepala kartu ini memakai .gt-card-head yang\r\n   sama dengan kartu LBS & LSD, jadi seluruh GeoTools punya satu template. */\r\n/* GeoFarm Analisis.\r\n   September 2026: kartu ini <details> yang mulai terlipat. Padding kartu\r\n   pindah ke .geofarm-card-body, dan margin negatif di kepala dihapus --\r\n   margin itu ada untuk menyedot tepi kepala ke atas kartu yang BER-PADDING.\r\n   Sekarang kartu tanpa padding, jadi margin negatif justru akan mendorong\r\n   kepala ke luar kotak. */\r\n.geofarm-card {\r\n  padding: 0;\r\n  overflow: hidden;\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 10px;\r\n  background: var(--bg-card);\r\n}\r\n.geofarm-card:not([open]) > .geofarm-card-body { display: none; }\r\n.geofarm-card-body { padding: 12px 13px; }\r\n/* Kepala, ikon, judul, subjudul, dan chevron kartu ini semua ditangani\r\n   oleh .gt-card-head / .gt-card-icon di blok \"Kepala kartu GeoTools\".\r\n   Aturan lama .geofarm-card-head, .geofarm-card-icon, dan\r\n   .geofarm-card-headtext * dihapus: nilainya berbeda dari template\r\n   (ikon SVG 18px berwarna aksen, judul 600, pita --bg-secondary), dan\r\n   itulah penyebab kartu ini terlihat berbeda dari kartu LBS & LSD\r\n   meskipun satu panel. */\r\n\r\n/* Chevron, hover, dan fokus untuk kartu GeoFarm ditangani oleh\r\n   .gt-card-head. Aturan lama di sini dihapus agar tidak ada dua sumber\r\n   untuk hal yang sama. */\r\n\r\n/* Dua tombol aksi utama berjajar. Lebarnya dibagi sama supaya keduanya\r\n   punya target sentuh yang sama besar, bukan ikut panjang teks. */\r\n.geofarm-card-actions {\r\n  display: grid;\r\n  grid-template-columns: 1fr 1fr;\r\n  gap: 6px;\r\n}\r\n/* Override di dalam kartu. Tanpa ini, aturan lama di atas (align-items:\r\n   center, justify-content: center, margin-bottom, dan label 13px) tetap\r\n   berlaku karena selector-nya lebih spesifik (#id .class) -- hasilnya tombol\r\n   tetap terpusat horizontal dan dua baris teksnya tidak rapi. */\r\n#geotoolsTabGeoFarm .geofarm-card-actions > .geofarm-draw-btn,\r\n#geotoolsTabGeoFarm .geofarm-card-actions > .geofarm-upload-btn {\r\n  flex-direction: column;\r\n  align-items: flex-start;\r\n  justify-content: flex-start;\r\n  gap: 1px;\r\n  padding: 8px 9px;\r\n  margin-bottom: 0;\r\n  text-align: left;\r\n}\r\n.geofarm-btn-label { font-size: 11.5px; font-weight: 600; }\r\n.geofarm-btn-sub {\r\n  font-size: 8.5px;\r\n  line-height: 1.3;\r\n  color: rgba(255, 255, 255, .82);\r\n  font-weight: 400;\r\n}\r\n.geofarm-card-actions > button svg { flex-shrink: 0; margin-bottom: 2px; }\r\n\r\n/* Buka Analisis tetap melebar penuh: dia satu-satunya jalan ke sheet\r\n   analisis, jadi tidak boleh terasa sebagai opsi ketiga yang setara. */\r\n.geofarm-card .geofarm-open-analysis-btn {\r\n  width: 100%;\r\n  margin-top: 6px;\r\n  justify-content: center;\r\n}\r\n\r\n/* ============ PANDUAN SINGKAT ============ */\r\n.geofarm-guide {\r\n  margin-top: 10px;\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 8px;\r\n  background: var(--bg-secondary);\r\n}\r\n.geofarm-guide-summary {\r\n  display: flex;\r\n  align-items: center;\r\n  padding: 7px 9px;\r\n  cursor: pointer;\r\n  list-style: none;\r\n  font-size: 10.5px;\r\n  color: var(--text-primary);\r\n}\r\n.geofarm-guide-summary::-webkit-details-marker { display: none; }\r\n.geofarm-guide-summary::before {\r\n  content: '\\25B8\\00a0';\r\n  display: inline-block;\r\n  transition: transform .15s;\r\n  color: var(--text-muted);\r\n}\r\n.geofarm-guide[open] > .geofarm-guide-summary::before { transform: rotate(90deg); }\r\n.geofarm-guide-summary:hover { background: var(--bg-card-hover); }\r\n.geofarm-guide-summary-txt { display: flex; flex-direction: column; gap: 1px; }\r\n.geofarm-guide-title { font-weight: 600; line-height: 1.25; }\r\n.geofarm-guide-sub { font-size: 8.5px; line-height: 1.3; color: var(--text-muted); }\r\n/* display:none saat tertutup. Tanpa ini isi panduan tetap terlihat walau\r\n   details-nya belum dibuka -- <details> menyembunyikan lewat atribut, tapi\r\n   elemen di dalamnya tetap punya tinggi sampai ada aturan eksplisit. Pola ini\r\n   sama dengan .pa-section.is-collapsed .pa-section-body di atas. */\r\n.geofarm-guide:not([open]) > .geofarm-guide-body { display: none; }\r\n.geofarm-guide-body {\r\n  padding: 2px 10px 10px 20px;\r\n  font-size: 9.5px;\r\n  line-height: 1.55;\r\n  color: var(--text-secondary);\r\n}\r\n.geofarm-guide-steps { margin: 0; padding-left: 14px; }\r\n.geofarm-guide-steps > li { margin-bottom: 8px; }\r\n.geofarm-guide-steps > li::marker { color: var(--text-muted); font-weight: 700; }\r\n.geofarm-guide-steps b { color: var(--text-primary); }\r\n.geofarm-guide-steps p { margin: 2px 0 0; }\r\n.geofarm-guide-steps ul { margin: 3px 0 0; padding-left: 13px; }\r\n.geofarm-guide-steps ul li { margin-bottom: 3px; }\r\n.geofarm-guide-steps ul b { color: var(--text-primary); }\r\n/* Catatan pengingkar untuk hal yang sering disalahpahami. */\r\n.gf-note {\r\n  padding: 4px 6px;\r\n  border-left: 2px solid var(--accent);\r\n  border-radius: 0 4px 4px 0;\r\n  background: var(--bg-card-hover);\r\n  font-size: 9px;\r\n  line-height: 1.5;\r\n  color: var(--text-muted);\r\n}\r\n/* Glosarium: istilah lalu artinya, supaya pembaca non-pertanian tidak\r\n   perlu mencari arti NDVI di tempat lain. */\r\n.geofarm-guide-defs { margin: 3px 0 0; }\r\n.geofarm-guide-defs dt {\r\n  font-size: 9.5px;\r\n  font-weight: 700;\r\n  color: var(--text-primary);\r\n  margin-top: 4px;\r\n}\r\n.geofarm-guide-defs dd { margin: 0 0 0 8px; }\r\n.geofarm-guide-care {\r\n  margin-top: 9px;\r\n  padding: 7px 8px;\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 6px;\r\n  background: var(--bg-card);\r\n}\r\n.geofarm-guide-care > b { color: var(--text-primary); font-size: 9.5px; }\r\n.geofarm-guide-care p { margin: 2px 0 0; }\r\n.geofarm-guide-care ul { margin: 3px 0 0; padding-left: 13px; }\r\n.geofarm-guide-care li { margin-bottom: 3px; }\r\n.geofarm-guide-foot {\r\n  margin: 8px 0 0;\r\n  padding-top: 6px;\r\n  border-top: 1px solid var(--border-color);\r\n  font-size: 8.5px;\r\n  line-height: 1.5;\r\n  color: var(--text-muted);\r\n}\r\n\r\n/* GeoFarm stack memakai satu ritme jarak yang sama: kartu pertama tidak\r\n   punya margin atas, dan kartu berikutnya hanya diberi gap kecil agar blok\r\n   terasa rapi dan konsisten setelah LBS/LSD dan GeoPangan dipindahkan ke\r\n   dalam panel yang sama. */\r\n#geotoolsTabGeoFarm > .geofarm-card,\r\n#geotoolsTabGeoFarm > .geotani-lbslsd,\r\n#geotoolsTabGeoFarm > .geopangan-card,\r\n#geotoolsTabGeoFarm > .geofarm-kalk,\r\n#geotoolsTabGeoFarm > .geofarm-ref-group {\r\n  margin-top: 0;\r\n}\r\n#geotoolsTabGeoFarm > .geofarm-card + .geotani-lbslsd,\r\n#geotoolsTabGeoFarm > .geotani-lbslsd + .geopangan-card,\r\n#geotoolsTabGeoFarm > .geopangan-card + .geofarm-kalk,\r\n#geotoolsTabGeoFarm > .geofarm-kalk + .geofarm-ref-group,\r\n#geotoolsTabGeoFarm > .geofarm-ref-group > .geofarm-ref + .geofarm-ref {\r\n  margin-top: 8px;\r\n}\r\n\r\n.geofarm-kalk {\r\n  margin-top: 0;\r\n  padding: 0;\r\n  overflow: hidden;\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 10px;\r\n  background: var(--bg-card);\r\n}\r\n.geofarm-kalk:not([open]) > .geofarm-kalk-body { display: none; }\r\n.geofarm-kalk-body { padding: 12px 13px; }\r\n/* Kepala dan ikon ditangani oleh .gt-card-head / .gt-card-icon. Ikonnya\r\n   tadinya 15px, sekarang ikut 20px seperti kartu LBS & LSD. */\r\n.geofarm-kalk-label {\r\n  display: block;\r\n  margin-bottom: 3px;\r\n  font-size: 10px;\r\n  font-weight: 600;\r\n  color: var(--text-secondary);\r\n}\r\n/* Baris luas: input tumbuh, satuan dan tombol lebar tetap. flex-wrap\r\n   supaya label turun ke baris sendiri, bukan menyempitkan baris. */\r\n.geofarm-kalk-luas {\r\n  display: flex;\r\n  align-items: flex-end;\r\n  flex-wrap: wrap;\r\n  gap: 6px;\r\n}\r\n.geofarm-kalk-luas .geofarm-kalk-label { flex: 0 0 100%; }\r\n.geofarm-kalk-luas .geofarm-kalk-input { flex: 1 1 auto; min-width: 0; }\r\n.geofarm-kalk-luas .geofarm-kalk-select { flex: 0 0 54px; }\r\n.geofarm-kalk-input, .geofarm-kalk-select {\r\n  width: 100%;\r\n  padding: 7px 9px;\r\n  font-size: 11px;\r\n  font-family: inherit;\r\n  color: var(--text-primary);\r\n  background: var(--bg-input);\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 6px;\r\n  outline: none;\r\n  box-sizing: border-box;\r\n}\r\n.geofarm-kalk-input:focus-visible, .geofarm-kalk-select:focus-visible,\r\n.geofarm-kalk-cell:focus-visible {\r\n  border-color: var(--accent);\r\n  box-shadow: 0 0 0 2px rgba(8, 145, 178, .15);\r\n}\r\n.geofarm-kalk-ghost {\r\n  flex: 0 0 auto;\r\n  padding: 7px 10px;\r\n  font-size: 10px;\r\n  font-weight: 600;\r\n  font-family: inherit;\r\n  color: var(--accent);\r\n  background: var(--bg-secondary);\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 6px;\r\n  cursor: pointer;\r\n  transition: background .15s, border-color .15s;\r\n}\r\n.geofarm-kalk-ghost:hover { background: var(--bg-card-hover); border-color: var(--accent); }\r\n.geofarm-kalk-ghost:active { transform: scale(.99); }\r\n.geofarm-kalk-ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }\r\n\r\n/* Tab bar. Hanya garis bawah, bukan tombol penuh, supaya tetap ringan di\r\n   sidebar sempit dan jelas terbaca sebagai sub-view dari field luas di atas. */\r\n.geofarm-kalk-tabs {\r\n  display: flex;\r\n  gap: 2px;\r\n  margin: 11px 0 0;\r\n  border-bottom: 1px solid var(--border-color);\r\n}\r\n.geofarm-kalk-tab {\r\n  flex: 0 0 auto;\r\n  padding: 7px 12px;\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  font-family: inherit;\r\n  color: var(--text-muted);\r\n  background: none;\r\n  border: none;\r\n  border-bottom: 2px solid transparent;\r\n  margin-bottom: -1px;\r\n  cursor: pointer;\r\n  transition: color .15s, border-color .15s;\r\n}\r\n.geofarm-kalk-tab:hover { color: var(--text-primary); }\r\n.geofarm-kalk-tab.active { color: var(--accent-green); border-bottom-color: var(--accent-green); }\r\n.geofarm-kalk-tab:focus-visible { outline: 2px solid var(--accent-green); outline-offset: -2px; }\r\n.geofarm-kalk-panel { padding-top: 10px; }\r\n.geofarm-kalk-panel[hidden] { display: none; }\r\n\r\n/* Grid 2 kolom. minmax(0,1fr), bukan 1fr, supaya kolom boleh lebih\r\n   sempit dari isinya dan tidak mendorong grid melebar di sidebar sempit.\r\n   Anak ke-5 (Cadangan) otomatis duduk sendiri di baris ketiga kolom\r\n   pertama; tidak perlu justify-content karena kolomnya tetap 1fr. */\r\n.geofarm-kalk-grid {\r\n  display: grid;\r\n  grid-template-columns: repeat(2, minmax(0, 1fr));\r\n  gap: 8px 6px;\r\n}\r\n.geofarm-kalk-grid > div { min-width: 0; }\r\n.geofarm-kalk-preset-row { margin-bottom: 8px; }\r\n.geofarm-kalk-acuan {\r\n  margin: 0 0 8px;\r\n  font-size: 9.5px;\r\n  line-height: 1.5;\r\n  color: var(--text-muted);\r\n}\r\n.geofarm-kalk-acuan:empty { display: none; }\r\n\r\n/* Tabel Pupuk. Dosis dan HET adalah input, kebutuhan dan biaya output,\r\n   jadi kolom input diberi garis tipis dan kolom output tidak, supaya\r\n   mata langsung tahu mana yang bisa diedit. */\r\n.geofarm-kalk-table-wrap {\r\n  overflow-x: auto;\r\n  -webkit-overflow-scrolling: touch;\r\n  border: 1px solid var(--border-color);\r\n  border-radius: 6px;\r\n}\r\n.geofarm-kalk-table {\r\n  width: 100%;\r\n  border-collapse: collapse;\r\n  font-size: 10.5px;\r\n}\r\n.geofarm-kalk-table thead th {\r\n  padding: 6px 5px;\r\n  font-size: 9px;\r\n  font-weight: 600;\r\n  line-height: 1.25;\r\n  text-align: right;\r\n  color: var(--text-muted);\r\n  background: var(--bg-secondary);\r\n  border-bottom: 1px solid var(--border-color);\r\n  white-space: nowrap;\r\n}\r\n.geofarm-kalk-table thead th:first-child { text-align: left; }\r\n.geofarm-kalk-table tbody th,\r\n.geofarm-kalk-table tbody td {\r\n  padding: 4px 5px;\r\n  border-bottom: 1px dashed var(--border-color);\r\n  vertical-align: middle;\r\n}\r\n.geofarm-kalk-table tbody tr:last-child th,\r\n.geofarm-kalk-table tbody tr:last-child td { border-bottom: none; }\r\n.geofarm-kalk-nama { display: block; font-size: 10.5px; font-weight: 600; color: var(--te r: #166534; }\r\n.geofarm-benih-total > b { font-size: 16px; font-weight: 700; color: #15803d; white-space: nowrap; }\r\n.geofarm-benih-total > b small { font-size: 9px; font-weight: 600; }\r\n.geofarm-benih-rows { margin: 8px 0 0; }\r\n.geofarm-benih-rows > div {\r\n  display: flex;\r\n  align-items: baseline;\r\n  justify-content: space-between;\r\n  gap: 8px;\r\n  padding: 4px 0;\r\n  border-bottom: 1px dashed var(--border-color);\r\n}\r\n.geofarm-benih-rows > div:last-child { border-bottom: none; }\r\n.geofarm-benih-rows dt { font-size: 10px; color: var(--text-muted); }\r\n.geofarm-benih-rows dd { margin: 0; font-size: 10.5px; font-weight: 600; color: var(--text-secondary); }\r\n.geofarm-benih-luas-info {\r\n  margin-top: 7px;\r\n  font-size: 9.5px;\r\n  line-height: 1.5;\r\n  color: var(--text-muted);\r\n}\r\n.geofarm-benih-warn {\r\n  margin-top: 7px;\r\n  padding: 5px 7px;\r\n  border: 1px solid #fbbf24;\r\n  border-radius: 5px;\r\n  background: #fffbeb;\r\n  color: #92400e;\r\n  font-size: 10px;\r\n  line-height: 1.45;\r\n}\r\n.geofarm-kalk-hint {\r\n  margin-top: 7px;\r\n  padding: 6px 8px;\r\n  border: 1px dashed var(--border-color);\r\n  border-radius: 5px;\r\n  font-size: 10px;\r\n  line-height: 1.5;\r\n  color: var(--text-muted);\r\n}\r\n.geofarm-kalk-note {\r\n  margin: 9px 0 0;\r\n  padding-top: 7px;\r\n  border-top: 1px dashed var(--border-color);\r\n  font-size: 9.5px;\r\n  line-height: 1.5;\r\n  color: var(--text-muted);\r\n}\r\n.geofarm-kalk-note b { color: var(--text-secondary); }\r\n/* Kredit acuan: dosis/ha dan HET berasal dari peraturan resmi, jadi\r\n   sumbernya wajib disebut supaya angkanya bisa ditelusuri. */\r\n.geofarm-kalk-credit {\r\n  margin: 6px 0 0;\r\n  font-size: 9px;\r\n  line-height: 1.5;\r\n  color: var(--text-muted);\r\n}\r\n.geofarm-kalk-credit b { color: var(--text-secondary); }\r\n.geofarm-kalk-credit a { color: var(--accent-green); }\r\n[data-theme=\"dark\"] .geofarm-kalk-status.is-warn { color: #fde68a; }\r\n[data-theme=\"dark\"] .geofarm-kalk-status.is-ok { color: #bbf7d0; }\r\n[data-theme=\"dark\"] .geofarm-kalk-tab.active { color: #4ade80; }\r\n[data-theme=\"dark\"] .geofarm-kalk-total,\r\n[data-theme=\"dark\"] .geofarm-benih-total { border-color: #15803d; background: #052e16; }\r\n[data-theme=\"dark\"] .geofarm-kalk-total > span { color: #bbf7d0; }\r\n[data-theme=\"dark\"] .geofarm-kalk-total > b,\r\n[data-theme=\"dark\"] .geofarm-benih-total > b { color: #4ade80; }\r\n[data-theme=\"dark\"] .geofarm-kalk-total > span,\r\n[data-theme=\"dark\"] .geofarm-benih-total > span { color: #bbf7d0; }\r\n[data-theme=\"dark\"] .geofarm-kalk-total.is-money { border-color: #1d4ed8; background: #172554; }\r\n[data-theme=\"dark\"] .geofarm-kalk-total.is-money > span { color: #bfdbfe; }\r\n[data-theme=\"dark\"] .geofarm-kalk-total.is-money > b { color: #93c5fd; }\r\n[data-theme=\"dark\"] .geofarm-benih-warn { border-color: #a16207; background: #451a03; color: #fcd34d; }\r\n[data-theme=\"dark\"] .geofarm-kalk-credit a { color: #4ade80; }\r\n\r\n/* Kartu polygon hasil unggah yang belum dianalisis. */\r\n.pa-card-source {\r\n  flex: 0 0 auto;\r\n  margin-left: 4px;\r\n  padding: 1px 6px;\r\n  font-size: 9px;\r\n  font-weight: 600;\r\n  line-height: 1.5;\r\n  border-radius: 999px;\r\n  background: #fef3c7;\r\n  color: #92400e;\r\n}\r\n[data-theme=\"dark\"] .pa-card-source { background: #422006; color: #fde68a; }\r\n.pa-pending {\r\n  margin-top: 7px;\r\n  padding: 9px 10px;\r\n  border: 1px dashed var(--border-color);\r\n  border-radius: 8px;\r\n  background: var(--bg-primary);\r\n}\r\n.pa-pending-text {\r\n  font-size: 10.5px;\r\n  line-height: 1.5;\r\n  color: var(--text-secondary);\r\n  margin-bottom: 7px;\r\n}\r\n.pa-pending .pa-btn-row {\r\n  /* .pa-btn-row normally is a 2-column grid; here there is only one button. */\r\n  grid-template-columns: 1fr;\r\n}\r\n.pa-pending .pa-btn-row .pa-btn { margin-top: 0; }\r\n.pa-btn-primary {\r\n  border: 1px solid #0891b2;\r\n  background: linear-gradient(135deg, #0891b2, #0e7490);\r\n  color: #fff;\r\n}\r\n.pa-btn-primary:hover:not([disabled]) {\r\n  background: linear-gradient(135deg, #0e7490, #155e75);\r\n}\r\n#geotoolsTabGeoFarm .pa-list {\r\n  max-height: 58vh;\r\n  overflow-y: auto;\r\n  /* Sama seperti .pa-list di panel: overflow-x harus ditulis eksplisit,\r\n     kalau tidak sumbu horizontal ikut auto. */\r\n  overflow-x: hidden;\r\n  -webkit-overflow-scrolling: touch;\r\n}\r\n\r\n/* Selama sesi menggambar GeoFarm, hanya kontrol gambar yang dimunculkan;\r\n   tombol ekspor SHP/GeoJSON disembunyikan supaya tidak salah klik. */\r\nbody.geofarm-draw-active .leaflet-draw {\r\n  display: block !important;\r\n}\r\nbody.geofarm-draw-active .draw-actions-wrap {\r\n  display: none !important;\r\n}\r\n\r\n\r\n.pa-dist { margin-top: 7px; }\r\n.pa-dist-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }\r\n.pa-dist-label { font-size: 9.5px; color: var(--text-secondary); width: 74px; flex-shrink: 0; }\r\n.pa-dist-bar { flex: 1; height: 6px; background: var(--border-color); border-radius: 4px; overflow: hidden; }\r\n.pa-dist-bar i { display: block; height: 100%; border-radius: 4px; }\r\n.pa-dist-value { font-size: 9.5px; color: var(--text-secondary); width: 30px; text-align: right; }\r\n\r\n.pa-btn {\r\n  width: 100%;\r\n  margin-top: 7px;\r\n  padding: 5px 8px;\r\n  font-size: 10.5px;\r\n  font-weight: 600;\r\n  font-family: inherit;\r\n  border-radius: 7px;\r\n  cursor: pointer;\r\n  transition: background .15s;\r\n}\r\n.pa-btn-ghost {\r\n  border: 1px solid var(--border-color);\r\n  background: var(--bg-primary);\r\n  color: var(--text-primary);\r\n}\r\n.pa-btn-ghost:hover { background: var(--bg-card-hover); }\r\n\r\n@media (max-width: 768px) {\r\n  .pa-stats { grid-template-columns: repeat(2, 1fr); }\r\n}\r\n\r\n[data-theme=\"dark\"] .pa-stale { background: #422006; border-color: #a16207; color: #fde68a; }\r\n[data-theme=\"dark\"] .pa-link { color: #fcd34d; }\r\n[data-theme=\"dark\"] .pa-block-erro   function labelAttrValue(val) {

    } else if (feature.properties && typeof feature.properties === 'object' && Object.keys(feature).length === 1) {
      src = feature.properties;

<script>
(function () {
  var lines = [], pass = 0, fail = 0;
  function say(s) { lines.push(s); }
  function ok(n, c, e) {
    if (c) { pass++; lines.push('  ok   ' + n); }
    else { fail++; lines.push('  FAIL ' + n + (e !== undefined ? '  -> ' + e : '')); }
  }
  function selesai() {
    lines.push('');
    lines.push((fail === 0 ? 'SEMUA LULUS' : 'ADA YANG GAGAL') + ': ' + pass + ' lulus, ' + fail + ' gagal');
    document.getElementById('out').textContent = lines.join('\n');

  try {
    say('1. Baris tabel punya data-idx (sumber untuk detail)');
    ok('baris tabel membawa data-idx', pola('baris-tabel-data-idx').test(SRC), 'pola data-idx tidak ada');
    ok('handler klik memanggil openFeatureDetailByIndex', pola('klik-buka-detail').test(SRC));
    ok('baris WMS juga punya kelas at-row + data-idx', pola('baris-wms-juga-at-row').test(SRC));

    say('');
    say('2. Detail fitur muncul saat baris diklik');
    setF([
      { NAMA: 'Sawah Blok 1', LUAS: '1,25', KAB: 'Subang' },
      { NAMA: 'Sawah Blok 2', LUAS: '0,80', KAB: 'Subang' }
    ]);
    var f = openIdx(1);
    ok('fitur dikembalikan', !!f, 'null');
    ok('fitur yang benar (indeks 1)', f && f.NAMA === 'Sawah Blok 2', f ? f.NAMA : '');
    var el = document.getElementById('atFeatureDetail');
    ok('panel detail muncul di DOM', !!el);
    if (el) {
      var n = el.querySelectorAll('.at-detail-row').length;
      say('  baris detail: ' + n);
      ok('menampilkan semua kolom (3)', n === 3, n + ' baris');
      var teks = el.textContent;
      ok('berisi NAMA fitur', /Sawah Blok 2/.test(teks));
      ok('berisi nilai LUAS', /0,80/.test(teks));
      ok('ada tombol tutup', !!el.querySelector('.at-detail-close'));
    }

    say('');
    say('3. Klik kedua mengganti detail, bukan menumpuk');
    openIdx(0);
    ok('hanya satu panel detail', document.querySelectorAll('#atFeatureDetail').length === 1,
      document.querySelectorAll('#atFeatureDetail').length + ' panel');
    ok('isi detail ikut berubah', /Sawah Blok 1/.test(document.getElementById('atFeatureDetail').textContent));

    say('');
    say('3b. Hanya satu baris yang ditandai aktif');
    var isi = document.getElementById('at-sheet-content');
    isi.innerHTML = '';
    isi.innerHTML = '<table class="at-table"><tbody>'
      + '<tr class="at-row" data-idx="0"><td>a</td></tr>'
      + '<tr class="at-row" data-idx="1"><td>b</td></tr>'

    say('');
    say('5. Nama layer di-escape (nama layer berasal dari katalog)');
    var bersih = subtitle('Sawah DCA');
    ok('nama layer biasa tampil utuh', pola('subtitle-nama-biasa').test(bersih));
    ok('pakai kelas at-layer-subtitle', pola('subtitle-kelas').test(bersih));
    var jahat = subtitle('<img src=x onerror=alert(1)>');
    ok('HTML di nama layer di-escape',
      !pola('subtitle-tanpa-img-mentah').test(jahat) && pola('subtitle-img-ter-escape').test(jahat), jahat);
    ok('nama layer kosong -> tanpa subjudul', subtitle('') === '' && subtitle(null) === '');

    say('');
    say('6. Kasus tepi');
    ok('indeks di luar jangkauan -> null, tidak error', openIdx(99) === null);
    ok('indeks bukan angka -> null, tidak error', openIdx('bukan-angka') === null);
    setF([{ A: 1 }]);
    var kosong = html({ _internal: 1 });
    ok('fitur tanpa kolom atribut -> pesan, bukan panel kosong',
      pola('detail-ada-pesan-kosong').test(kosong));
    var wms = html({ attributes: { NAMA: 'Puncak', KET: 'Api' } });
    ok('hasil WMS diratakan (bukan satu baris JSON)', /NAMA/.test(wms) && /Puncak/.test(wms));
    ok('tidak menampilkan satu kunci "attributes"', !pola('detail-bukan-json-raw').test(wms));
    ok('kunci internal (diawali _) disembunyikan', !/_internal/.test(html({ _a: 1, B: 2 })));

    say('');
    say('7. Tampilan panel detail');
    setF([{ NAMA: 'Sawah', LUAS: '2,5' }]);
    openIdx(0);
    var d2 = document.getElementById('atFeatureDetail');
    if (d2) {
      var cs = getComputedStyle(d2);
      say('  tinggi panel: ' + Math.round(d2.getBoundingClientRect().height) + 'px');
      ok('panel punya latar sendiri', cs.backgroundColor !== 'rgba(0, 0, 0, 0)', cs.backgroundColor);
      ok('panel punya border', parseFloat(cs.borderTopWidth) >= 1, cs.borderTopWidth);
      var row = d2.querySelector('.at-detail-row');
      if (row) {
        var rc = getComputedStyle(row);
        say('  kolom detail: ' + rc.gridTemplateColumns);
        ok('baris detail dua kolom (kunci + nilai)', /\S+\s+\S+/.test(rc.gridTemplateColumns), rc.gridTemplateColumns);
        say('  font baris: ' + rc.fontSize);
        ok('teks detail cukup besar untuk dibaca (>= 10px)', parseFloat(rc.fontSize) >= 10, rc.fontSize);
      }
    }
  } catch (e) {
    lines.push('ERROR HARNESS: ' + e.message);
    lines.push('  ' + (e.stack || '').split('\n').slice(0, 4).join('\n  '));
  }
  selesai();
})();
</script>
