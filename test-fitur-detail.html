ya jawaban \"boleh atau tidak\"\r\n   muncul lebih dulu, dan daftar rincian ada di bawahnya. */\r\n.geooss-precheck {\r\n  margin-top: 12px; padding: 10px 11px; font-size: 11px;\r\n  color: var(--text-secondary); background: var(--bg-card);\r\n  border: 1px solid var(--border-color); border-radius: 6px;\r\n}\r\n.geooss-precheck-judul { margin-bottom: 8px; }\r\n.geooss-precheck-judul b { display: block; font-size: 12.5px; color: var(--text-primary); }\r\n.geooss-precheck-judul span {\r\n  display: block; margin-top: 2px; font-size: 10.5px; line-height: 1.5;\r\n  color: var(--text-muted);\r\n}\r\n.geooss-precheck-tabel { width: 100%; border-collapse: collapse; }\r\n.geooss-precheck-tabel th, .geooss-precheck-tabel td {\r\n  padding: 5px 0; text-align: left; vertical-align: top;\r\n  border-top: 1px solid var(--border-color);\r\n}\r\n.geooss-precheck-tabel tr:first-child th,\r\n.geooss-precheck-tabel tr:first-child td { border-top: 0; }\r\n.geooss-precheck-tabel th {\r\n  width: 116px; padding-right: 10px; font-size: 10px; font-weight: 600;\r\n  color: var(--text-muted); text-transform: uppercase; letter-spacing: .02em;\r\n}\r\n/* Pada layar sempit label dan nilai tetap satu kolom, tapi lebarkan label\r\n   supaya tidak memotong kata. */\r\n.geooss-precheck-kecil {\r\n  display: block; margin-top: 2px; font-size: 10px; line-height: 1.45;\r\n  color: var(--text-muted);\r\n}\r\n.geooss-precheck-kode {\r\n  font-variant-numeric: tabular-nums; font-size: 10.5px; line-height: 1.5;\r\n  word-break: break-word;\r\n}\r\n.geooss-precheck-syarat {\r\n  margin-top: 8px; padding: 7px 9px; font-size: 10.5px; line-height: 1.55;\r\n  background: var(--bg-card-hover); border-radius: 4px;\r\n}\r\n.geooss-precheck-oss {\r\n  display: block; margin-top: 9px; padding: 9px 11px;\r\n  font-size: 12px; font-weight: 600; text-decoration: none;\r\n  color: var(--accent); background: var(--bg-card-hover);\r\n  border: 1px solid var(--accent); border-radius: 5px;\r\n  transition: background .2s ease;\r\n}\r\n.geooss-precheck-oss:hover { background: var(--bg-card-active); }\r\n.geooss-precheck-oss span {\r\n  display: block; margin-top: 2px; font-size: 10px; font-weight: 400;\r\n  color: var(--text-muted);\r\n}\r\n.geooss-precheck-simmerah {\r\n  margin-top: 8px; padding-top: 8px; font-size: 9.5px; line-height: 1.55;\r\n  color: var(--text-muted); border-top: 1px solid var(--border-color);\r\n}\r\n@media (max-width: 420px) {\r\n  .geooss-precheck-tabel th { width: 96px; }\r\n}\r\n\r\n/* Alat Cek Lokasi: dari koordinat ke nama wilayah. Berada di sheet\r\n   \"Gambar & Ukur\" (drawSidebar), bukan lagi di GeoData.\r\n   Kelas .geolokasi-* dipakai modul untuk MENULIS hasil, jadi kelas itu\r\n   tetap global di bawah. Yang di-scope ke .dm-cek-lokasi hanya kerangka\r\n   form-nya, karena harus serasi dengan .dm-sidebar-option yang warnanya\r\n   mengikuti var(--bg-secondary) / var(--border-color). */\r\n.dm-cek-lokasi { margin-bottom: 4px; }\r\n.dm-cek-lokasi-desc {\r\n  margin: 0 0 10px; font-size: 11px; line-height: 1.5;\r\n  color: var(--text-secondary);\r\n}\r\n.dm-cek-lokasi-label {\r\n  display: block; margin-bottom: 4px;\r\n  font-size: 10px; font-weight: 600; color: var(--text-secondary);\r\n}\r\n/* Padding kiri 10px, bukan 28px seperti .geotani-form-input-search. Nilai 28px\r\n   itu ruang untuk ikon search, dan input ini tidak punya ikon -- sisa ruang\r\n   kosong itu bikin teks tampak tidak rata dengan label di atasnya. */\r\n.dm-cek-lokasi-input {\r\n  width: 100%; box-sizing: border-box;\r\n  padding: 7px 10px; font-size: 12px; font-variant-numeric: tabular-nums;\r\n  border: 1px solid var(--border-color); border-radius: 8px;\r\n  background: var(--bg-secondary); color: var(--text-primary); outline: none;\r\n}\r\n.dm-cek-lokasi-input::placeholder { color: var(--text-muted); }\r\n.dm-cek-lokasi-input:focus { border-color: var(--accent); }\r\n.dm-cek-lokasi-btn {\r\n  flex: 1 1 0; min-width: 0; height: 34px; padding: 0 10px;\r\n  font-size: 11px; font-weight: 700; border: none; border-radius: 8px;\r\n  cursor: pointer; transition: all .2s ease;\r\n  color: #fff; background: var(--accent);\r\n}\r\n.dm-cek-lokasi-btn:hover { filter: brightness(1.08); }\r\n.dm-cek-lokasi-btn:active { transform: translateY(1px); }\r\n.dm-cek-lokasi-btn--orange { background: #ea580c; }\r\n.dm-cek-lokasi-btn--green { background: #16a34a; }\r\n.dm-cek-lokasi-status:not(:empty) {\r\n  margin-top: 8px; padding: 6px 8px; font-size: 11px; line-height: 1.5;\r\n  color: var(--text-secondary); background: var(--bg-card-hover);\r\n  border-left: 3px solid var(--accent); border-radius: 4px;\r\n}\r\n[data-theme=\"dark\"] .dm-cek-lokasi-btn { color: #06202a; }\r\n\r\n.geolokasi-tombol { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }\r\n.geolokasi-hasil { margin-top: 8px; }\r\n.geolokasi-koordinat {\r\n  padding: 6px 8px; font-size: 12px; font-variant-numeric: tabular-nums;\r\n  background: var(--bg-card-hover); border-radius: 4px; word-break: break-all;\r\n}\r\n.geolokasi-tabel { width: 100%; margin-top: 6px; border-collapse: collapse; }\r\n.geolokasi-tabel th, .geolokasi-tabel td {\r\n  padding: 4px 0; text-align: left; vertical-align: top; font-size: 11px;\r\n  border-top: 1px solid var(--border-color);\r\n}\r\n.geolokasi-tabel tr:first-child th, .geolokasi-tabel tr:first-child td { border-top: 0; }\r\n.geolokasi-tabel th {\r\n  width: 116px; padding-right: 8px; font-size: 10px; font-weight: 600;\r\n  color: var(--text-muted);\r\n}\r\n/* Di dalam sidebar 380px, kolom label 116px menyisakan terlalu sedikit\r\n   ruang untuk nilai -- \"Jawa Timur\" mulai turun ke baris berikutnya.\r\n   namespaced ini, jadi tabel lain yang memakai kelas yang sama tidak\r\n   ikut berubah. */\r\n.dm-cek-lokasi .geolokasi-tabel th { width: 92px; }\r\n/* Nilai yang memang tidak ada di sumber data. Warnanya sengaja redup,\r\n   bukan merah: ini keterbatasan sumber, bukan kesalahan. */\r\n.geolokasi-takada { color: var(--text-muted); font-style: italic; }\r\n.geolokasi-kecil { margin-top: 6px; font-size: 10px; line-height: 1.5; color: var(--text-muted); }\r\n.geolokasi-kecil--wajar { color: var(--text-secondary); }\r\n.geolokasi-galat {\r\n  margin-top: 8px; padding: 7px 9px; font-size: 11px; line-height: 1.5;\r\n  color: var(--text-secondary); background: var(--bg-card-hover);\r\n  border-left: 3px solid var(--accent); border-radius: 4px;\r\n}\r\n@media (max-width: 420px) {\r\n  .geolokasi-tabel th { width: 96px; }\r\n}\r\n\r\n/* Luas LBS/LSD dan LP2B di GeoOSS. Dipisah dari .geooss-khusus karena\r\n   ini hasil pengukuran luas, bukan daftar syarat. */\r\n.geooss-sawah {\r\n  margin-top: 10px; padding: 8px 10px; font-size: 11px;\r\n  color: var(--text-secondary); background: var(--bg-card-hover);\r\n  border-left: 3px solid var(--accent); border-radius: 4px;\r\n}\r\n/* Data sawah tidak terbaca: bukan error, dan tidak perlu warna peringatan. */\r\n.geooss-sawah--kosong { border-left-color: var(--text-muted); }\r\n.geooss-sawah > b { display: block; margin-bottom: 4px; color: var(--text-primary); }\r\n.geooss-sawah-tabel { width: 100%; border-collapse: collapse; }\r\n.geooss-sawah-tabel td {\r\n  padding: 3px 0; font-size: 11px; vertical-align: top;\r\n  border-top: 1px solid var(--border-color);\r\n}\r\n.geooss-sawah-tabel tr:first-child td { border-top: 0; }\r\n.geooss-sawah-tabel th {\r\n  padding: 3px 8px 3px 0; text-align: left; font-size: 10px; font-weight: 600;\r\n  color: var(--text-muted); white-space: nowrap;\r\n}\r\n.geooss-sawah-tabel td { font-variant-numeric: tabular-nums; }\r\n/* Sumber, satuan, dan peringatan cakupan. */\r\n.geooss-sawah-kecil {\r\n  margin-top: 5px; font-size: 10px; line-height: 1.5; color: var(--text-muted);\r\n}\r\n/* Peringatan cakupan peta 1:50.000. Oranye, karena itu informasi yang\r\n   perlu dibaca -- bukan sekadar catatan. */\r\n.geooss-sawah-catatan {\r\n  margin-top: 4px; padding: 4px 6px; font-size: 10px; line-height: 1.5;\r\n  color: var(--text-secondary); background: var(--bg-card);\r\n  border-left: 2px solid #d97706; border-radius: 3px;\r\n}\r\n\r\n/* Ketentuan khusus: daftar yang harus dipenuhi sebelum activities bisa\r\n   dianggap bebas masalah. Dipisah dari .geooss-warn karena warn dipakai\r\n   untuk kesalahan dan kelengkapan data, sedangkan ini daftar syarat. */\r\n.geooss-khusus {\r\n  margin-top: 10px; padding: 8px 10px; font-size: 11px;\r\n  color: var(--text-secondary); background: var(--bg-card-hover);\r\n  border-left: 3px solid #d97706; border-radius: 4px;\r\n}\r\n.geooss-khusus--ringan { border-left-color: var(--accent); }\r\n/* Blok intensitas: sengaja tidak diberi warna peringatan. Yang di dalamnya\r\n   bukan pelanggaran, melainkan informasi bahwa datanya tidak ada. */\r\n.geooss-khusus--kosong { border-left-color: var(--text-muted); }\r\n.geooss-khusus > b { display: block; margin-bottom: 3px; color: var(--text-primary); }\r\n.geooss-khusus-ket {\r\n  display: block; margin-bottom: 6px; font-size: 10.5px;\r\n  line-height: 1.5; color: var(--text-muted);\r\n}\r\n.geooss-khusus-tabel { width: 100%; border-collapse: collapse; }\r\n.geooss-khusus-tabel td {\r\n  padding: 3px 6px 3px 0; font-size: 10.5px; vertical-align: top;\r\n  border-top: 1px solid var(--border-color);\r\n}\r\n.geooss-khusus-tabel tr:first-child td { border-top: 0; }\r\n.geooss-khusus-ha {\r\n  width: 84px; text-align: right; font-variant-numeric: tabular-nums;\r\n  white-space: nowrap;\r\n}\r\n.geooss-khusus-zona {\r\n  width: 72px; text-align: right; font-size: 10px; color: var(--text-muted);\r\n  white-space: nowrap;\r\n}\r\n[data-theme=\"dark\"] .geooss-khusus { border-left-color: #f59e0b; }\r\n\r\n.geooss-dasar {\r\n  display: grid; gap: 2px; margin-top: 8px; padding: 7px 9px;\r\n  font-size: 11px; color: var(--text-secondary);\r\n  background: var(--bg-card-hover); border-radius: 5px;\r\n}\r\n.geooss-dasar b { color: var(--text-primary); }\r\n\r\n.geooss-kode {\r\n  font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent);\r\n}\r\n\r\n/* Tabel zona. Lebar, jadi dibungkus scroll horizontal. Kolom status diberi\r\n   warna teks, bukan latar, supaya tabel tetap terbaca di dark mode. */\r\n.geooss-zona-wrap { margin-top: 8px; overflow-x: auto; }\r\n.geooss-zona { width: 100%; border-collapse: collapse; font-size: 10.5px; }\r\n.geooss-zona th {\r\n  padding: 5px 8px; text-align: left; font-size: 9px; font-weight: 700;\r\n  text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;\r\n  color: var(--text-tertiary); background: var(--bg-card-hover);\r\n  border-bottom: 1px solid var(--border-color);\r\n}\r\n.geooss-zona td {\r\n  padding: 5px 8px; border-bottom: 1px solid var(--border-secondary);\r\n  color: var(--text-primary); white-space: nowrap; vertical-align: top;\r\n}\r\n.geooss-zona tr:last-child td { border-bottom: 0; }\r\n.geooss-zona td:nth-child(1) { white-space: normal; min-width: 120px; }\r\n.geooss-zona td:nth-child(6) { white-space: normal; min-width: 150px; }\r\n.geooss-st-pasti  { color: #16a34a; font-weight: 600; }\r\n.geooss-st-awalan { color: #d97706; font-weight: 600; }\r\n.geooss-st-tidak  { color: #dc2626; font-weight: 600; }\r\n.geooss-st-netral { color: var(--text-tertiary); }\r\n.geooss-kosong { color: var(--text-tertiary); font-style: italic; }\r\n\r\n.geooss-kendala {\r\n  display: inline-block; margin: 0 3px 3px 0; padding: 1px 5px;\r\n  font-size: 9.5px; border-radius: 3px; white-space: normal;\r\n  background: var(--bg-tertiary); color: var(--text-secondary);\r\n}\r\n\r\n/* ── Kartu hasil GeoOSS ───────────────────────────────────────────────────\r\n   Satu kartu per analisis, memakai <details>/<summary> supaya bisa dilipat\r\n   tanpa satu baris JavaScript pun. Tampilannya meniru .geotani-lbslsd --\r\n   kartu GeoTools lain -- supaya panel ini tidak terlihat seperti hasil\r\n   modul yang ditempelkan. */\r\n.geooss-kartu {\r\n  margin: 0 0 10px; padding: 0; overflow: hidden;\r\n  border: 1px solid var(--border-color); border-radius: 8px;\r\n  background: var(--bg-card);\r\n}\r\n.geooss-kartu-kepala {\r\n  display: flex; align-items: center; gap: 10px;\r\n  padding: 11px 13px;\r\n  background: var(--bg-card-active);\r\n  cursor: pointer; list-style: none;\r\n  /* Panah dibuat sendiri, jadi penanda bawaan <summary> harus dimatikan\r\n     supaya tidak ada dua tanda panah bertumpuk: satu dari ::marker dan\r\n     satu dari elemen yang kita gambar sendiri. */\r\n  -webkit-tap-highlight-color: transparent;\r\n}\r\n.geooss-kartu-kepala::-webkit-details-marker { display: none; }\r\n.geooss-kartu-kepala::marker { content: ''; }\r\n.geooss-kartu-kepala:hover { background: var(--bg-card-hover); }\r\n.geooss-kartu-kepala:focus-visible {\r\n  outline: 2px solid var(--accent); outline-offset: -2px;\r\n}\r\n.geooss-kartu-teks { display: block; flex: 1 1 auto; min-width: 0; }\r\n.geooss-kartu-judul {\r\n  display: block; font-size: 13px; font-weight: 700;\r\n  color: var(--text-primary); line-height: 1.3;\r\n}\r\n.geooss-kartu-sub {\r\n  display: block; margin-top: 1px; font-size: 9.5px; font-weight: 500;\r\n  color: var(--text-muted); line-height: 1.35;\r\n}\r\n/* Panah chevron. Diputar 180 derajat saat kartu dibuka, jadi arahnya\r\n   selalu menunjukkan aksi berikutnya, bukan sekadar keadaan. */\r\n.geooss-kartu-panah {\r\n  flex: 0 0 auto; width: 8px; height: 8px;\r\n  border-right: 1.6px solid var(--text-muted);\r\n  border-bottom: 1.6px solid var(--text-muted);\r\n  transform: rotate(45deg);\r\n  transition: transform .18s ease;\r\n}\r\n.geooss-kartu[open] > .geooss-kartu-kepala { border-bottom: 1px solid var(--border-color); }\r\n.geooss-kartu[open] > .geooss-kartu-kepala .geooss-kartu-panah {\r\n  transform: rotate(-135deg); margin-top: -4px;\r\n}\r\n.geooss-kartu-isi { padding: 12px 13px; }\r\n/* Blok di dalam kartu sudah punya margin-top sendiri. Tanpa ini, isi\r\n   pertama berjarak 8px dari tepi dalam PLUS padding 12px, jadi terlihat\r\n   tidak rata dengan tepi kartu. */\r\n.geooss-kartu-isi > :first-child { margin-top: 0; }\r\n@media (max-width: 420px) {\r\n  .geooss-kartu-judul { font-size: 12.5px; }\r\n  .geooss-kartu-isi { padding: 10px 11px; }\r\n}\r\n\r\n.geotani-sls-popup-row b { color: #166534; }\r\n\r\n/* GeoTani - LBS & LSD (BIG SatuPeta), workflow mandiri di bagian teratas.\r\n   Grid .geotani-analysis-cards sedang display:none, jadi kartu ini memakai\r\n   gaya sendiri dan tidak bergantung pada mekanisme tab analysis. */\r\n.geotani-lbslsd {\r\n  margin-bottom: 0; padding: 0; overflow: hidden;\r\n  border: 1px solid var(--border-color); border-radius: 8px;\r\n  background: var(--bg-card);\r\n}\r\n/* ── Kepala kartu GeoTools ───────────────────────────────────────────────\r\n   SATU template untuk semua panel, diambil dari kartu LBS & LSD GeoTani:\r\n   ikon 20px, judul 13px tebal, subjudul 9,5px redup, pita\r\n   var(--bg-card-active).\r\n\r\n   Kenapa satu kelas, bukan satu kelas per modul. Sebelumnya tiap modul\r\n   punya kelas kepalanya sendiri dengan angka yang berbeda-beda dalam satu\r\n   panel yang sama: ikon 20px (GeoTani), SVG 18px berwarna aksen\r\n   (GeoFarm Analisis), dan 15px (Kalkulator). Warna pitanya juga berbeda:\r\n   --bg-card-active di GeoTani/GeoOSS, --bg-secondary di GeoFarm. Efeknya\r\n   kartu di panel yang sama terlihat berasal dari situs berbeda.\r\n\r\n   Kelas-kelas lama (geotani-lbslsd-head, geotani-kta-summary,\r\n   geofarm-card-head, geofarm-kalk-head) tidak lagi dipakai di markup dan\r\n   aturannya dihapus, bukan dibiarkan jadi alias. Tidak ada satu pun\r\n   referensi ke kelas itu dari JavaScript, dan alias yang tak terpakai\r\n   hanya menambah tempat yang harus ikut dirawat saat temanya berubah. */\r\n.gt-card-head {\r\n  display: flex; align-items: center; gap: 10px;\r\n  padding: 11px 13px;\r\n  background: var(--bg-card-active);\r\n  border-bottom: 1px solid var(--border-color);\r\n  cursor: pointer;\r\n  list-style: none;\r\n}\r\n.gt-card-head::-webkit-details-marker { display: none; }\r\n.gt-card-head::marker { content: ''; }\r\n.gt-card-head:hover { background: var(--bg-card-hover); }\r\n.gt-card-head:focus-visible {\r\n  outline: 2px solid var(--accent); outline-offset: -2px;\r\n}\r\n.gt-card-icon {\r\n  flex: 0 0 auto;\r\n  font-size: 20px; line-height: 1;\r\n}\r\n.gt-card-head b {\r\n  display: block; font-size: 13px; font-weight: 700;\r\n  color: var(--text-primary);\r\n}\r\n.gt-card-head small {\r\n  display: block; margin-top: 1px;\r\n  font-size: 9.5px; font-weight: 500;\r\n  color: var(--text-muted);\r\n}\r\n/* Chevron. Arahnya selalu menunjukkan aksi berikutnya: ke kanan saat\r\n   terlipat, ke bawah saat terbuka. */\r\n.gt-card-head::after {\r\n  content: ''; flex: 0 0 auto; margin-left: auto;\r\n  width: 8px; height: 8px;\r\n  border-right: 1.6px solid var(--text-muted);\r\n  border-bottom: 1.6px solid var(--text-muted);\r\n  transform: rotate(45deg);\r\n  transition: transform .18s ease;\r\n}\r\n/* Selector memakai details[open] > .gt-card-head, bukan .gt-card-head[open]:\r\n   yang membawa atribut open adalah <details>, bukan <summary>. */\r\ndetails[open] > .gt-card-head::after {\r\n  transform: rotate(-135deg); margin-top: -4px;\r\n}\r\n\r\n.geotani-lbslsd-body { padding: 12px 13px; }\r\n.geotani-lbslsd .geotani-btn-print { width: 100%; justify-content: center; }\r\n\r\n/* Kartu GeoTani: isi disembunyikan eksplisit saat terlipat, mengikuti pola\r\n   yang sudah dipakai .geofarm-guide di modul GeoFarm. Kepala dan chevron\r\n   sudah ditangani oleh .gt-card-head di atas. */\r\n.geotani-lbslsd:not([open]) > .geotani-lbslsd-body,\r\n.geotani-kta-card:not([open]) > :not(.gt-card-head) { display: none; }\r\n\r\n.geotani-lbslsd-summary {\r\n  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 9px;\r\n}\r\n.geotani-lbslsd-summary > div {\r\n  display: flex; flex-direction: column; gap: 2px;\r\n  padding: 6px 8px; border-radius: 5px;\r\n  background: var(--bg-input); border: 1px solid var(--border-color);\r\n}\r\n.geotani-lbslsd-summary span { font-size: 9px; color: var(--text-muted); }\r\n.geotani-lbslsd-summary b { font-size: 12px; color: var(--accent-green); }\r\n.geotani-lbslsd-layer { margin-top: 10px; }\r\n.geotani-lbslsd-layer-head {\r\n  display: flex; align-items: center; gap: 6px;\r\n  font-size: 11px; font-weight: 700; color: var(--text-primary);\r\n}\r\n.geotani-lbslsd-swatch {\r\n  width: 10px; height: 10px; border-radius: 2px;\r\n  border: 1px solid var(--border-color); flex: 0 0 auto;\r\n}\r\n.geotani-lbslsd-sub {\r\n  margin-top: 3px; font-size: 10.5px; color: var(--text-secondary);\r\n}\r\n.geotani-lbslsd-note { color: var(--text-muted); font-size: 9.5px; }\r\n.geotani-lbslsd-warn {\r\n  margin-top: 7px; padding: 5px 7px;\r\n  border: 1px solid #fbbf24; border-radius: 4px;\r\n  background: #fffbeb; color: #92400e; font-size: 10px; line-height: 1.45;\r\n}\r\n.geotani-lbslsd-list {\r\n  max-height: 190px; margin: 6px 0 0; padding: 0; overflow-y: auto;\r\n  list-style: none; border: 1px solid var(--border-color); border-radius: 5px;\r\n}\r\n.geotani-lbslsd-list li {\r\n  display: flex; align-items: baseline; gap: 8px;\r\n  padding: 5px 8px; font-size: 10.5px; cursor: pointer;\r\n  border-top: 1px solid var(--border-color);\r\n}\r\n.geotani-lbslsd-list li:first-child { border-top: 0; }\r\n.geotani-lbslsd-list li:hover { background: var(--bg-card-hover); }\r\n.geotani-lbslsd-list i { font-style: normal; font-size: 9px; color: var(--text-muted); }\r\n/* GeoTani — KKPR: tab \"Cari NIB\" dan \"Cari Nama Usaha\".\r\n   Dua panel, bukan dua kartu. Satu kartu dengan dua mode pencarian yang\r\n   memakai tombol dan area hasil yang sama jauh lebih mudah dibandingkan\r\n   daripada dua kartu terpisah -- dan perbandingan itu justru yang\r\n   dibutuhkan di sini, karena kedua mode membaca layer berbeda.\r\n\r\n   Bentuknya sudah mandiri: nav .geopangan-source-tab yang pernah jadi\r\n   rujukan kelas ini sudah dihapus bersama panel GeoPangan, tapi nav\r\n   GeoTani (KKPR/Trase) memang perlu tetap berdampingan dengan mode\r\n   peta, jadi kelas .geotani-kkpr-tab tidak ikut dibubarkan. */\r\n.geotani-kkpr-tab {\r\n  display: flex; gap: 4px; margin: 8px 0 10px;\r\n  border-bottom: 1px solid var(--border-color);\r\n}\r\n.geotani-kkpr-tab-btn {\r\n  flex: 1 1 0; padding: 6px 8px; cursor: pointer;\r\n  font-size: 11px; font-weight: 600; font-family: inherit;\r\n  color: var(--text-muted); background: transparent;\r\n  border: 1px solid transparent; border-bottom: none;\r\n  border-radius: 5px 5px 0 0; margin-bottom: -1px;\r\n}\r\n.geotani-kkpr-tab-btn:hover { color: var(--text-primary); background: var(--bg-card-hover); }\r\n.geotani-kkpr-tab-btn.is-active {\r\n  color: var(--text-primary);\r\n  background: var(--bg-card);\r\n  border-color: var(--border-color);\r\n  border-bottom: 1px solid var(--bg-card);\r\n}\r\n.geotani-kkpr-tab-btn:focus-visible {\r\n  outline: 2px solid var(--accent); outline-offset: -2px;\r\n}\r\n\r\n/* Panel yang tidak aktif disembunyikan dua cara: hidden untuk browser\r\n   dan display:none untuk CSS. Hanya hidden tidak cukup kalau ada aturan\r\n   display lain yang lebih spesifik, dan hanya display:none tidak cukup\r\n   untuk pembaca layar. */\r\n.geotani-kkpr-panel[hidden] { display: none; }\r\n\r\n/* Kredit BIG, ATR/BPN, dan KLHK: ketentuan masing-masing mewajibkan menyebut\r\n   lembaga pemberi data dan tautan ke sumber aslinya.\r\n\r\n   Tautannya teks biasa, bukan <a>, jadi butuh pemenggalan kata: URL KLHK\r\n   (gis.bnpb.go.id/server/rest/services/thematic/PL_KLHK_2024/MapServer) dan\r\n   URL GISTARU sama-sama panjang, sementara panel GeoTools hanya sekitar\r\n   300 px. overflow-wrap mencegah URL meluber tanpa merusaknya sebagai teks\r\n   yang masih bisa disalin utuh. */\r\n.geotani-lbslsd-credit {\r\n  margin-top: 8px; padding-top: 6px;\r\n  border-top: 1px dashed var(--border-color);\r\n  font-size: 9px; line-height: 1.5; color: var(--text-muted);\r\n  overflow-wrap: anywhere; word-break: break-word;\r\n}\r\n[data-theme=\"dark\"] .geotani-lbslsd-warn {\r\n  border-color: #a16207; background: #451a03; color: #fcd34d;\r\n}\r\n\r\n/* Kartu \"LSD 12 Provinsi\" memakai kelas yang sama persis dengan kartu\r\n   LBS & LSD di atas. Keduanya harus terlihat sama, dan menyalin aturan\r\n   warna/jarak ke kelas baru hanya menghasilkan satu tempat yang harus\r\n   ikut dirawat setiap tema berubah.\r\n\r\n   Yang tetap perlu sendiri: tiga metrik ringkasan kartu ini tidak sama\r\n   maknanya. Kartu LBS & LSD punya LBS, LSD, dan luas desa; kartu ini\r\n   hanya punya satu angka sawah dilindungi, jadi tiga kolom akan terlihat\r\n   seperti ada data yang hilang. Karena itu grid-nya tiga kolom tetap,\r\n   tapi isinya hanya dua atau tiga nilai yang memang ada -- lihat\r\n   listHtml() di geotani-lsd12prov.js. */\r\n\r\n/* Rincian per kategori: hanya ada dua baris, jadi tidak perlu menggulir,\r\n   dan barisnya bukan target klik sehingga tidak boleh terlihat seperti\r\n   daftar yang bisa diklik. */\r\n.geotani-lbslsd-list--ringkas { max-height: none; }\r\n.geotani-lbslsd-list--ringkas li { cursor: default; }\r\n.geotani-lbslsd-list--ringkas li:hover { background: transparent; }\r\n\r\n/* ── Grafik & insight: Tutupan Lahan ──\r\n   SVG-nya digambar sendiri oleh geotani-tutupan-lahan.js (pola yang sama\r\n   dengan grafik tren GeoFarm), jadi yang didefinisikan di sini hanya\r\n   warna dan ukuran. Tanpa max-height di blok manapun: tinggi grafik\r\n   mengikuti jumlah batang, dan grafik yang dipotong diam-diam sama\r\n   saja dengan menyembunyikan kelas. */\r\n\r\n/* Isi lingkaran (donat). Dipakai lewat atribut fill per irisan, bukan\r\n   lewat kelas, karena warnanya berbeda per kelas dan berasal dari warna\r\n   yang sama dengan peta. */\r\n.gt-grafik { display: block; width: 100%; height: auto; margin-top: 6px; overflow: visible; }\r\n.gt-grafik-lingkar {\r\n  fill: none; stroke: var(--border-color); stroke-width: 1;\r\n}\r\n/* Garis pemisah tipis antar iris supaya kelas kecil masih bisa dibedakan\r\n   saat berdekatan. */\r\n.gt-grafik-iris { stroke: var(--bg-card); stroke-width: 0.8; stroke-linejoin: round; }\r\n.gt-grafik-donat {\r\n  fill: var(--text-primary); font-size: 11px; font-weight: 700;\r\n  paint-order: stroke; stroke: var(--bg-card); stroke-width: 2.5px;\r\n}\r\n.gt-grafik-ax { fill: var(--text-muted); font-size: 8px; }\r\n.gt-grafik-kelas { fill: var(--text-secondary); font-size: 8.5px; }\r\n.gt-grafik-nilai { font-size: 8.5px; font-weight: 700; font-variant-numeric: tabular-nums; }\r\n.gt-grafik-grid { stroke: var(--border-color); stroke-width: 1; stroke-dasharray: 2 3; }\r\n\r\n/* Warna batang mengikuti ARAH perubahan, bukan warna kelas.\r\n   Warna kelas sudah dipakai di peta, di legenda, dan di tabel; kalau\r\n   batang memakai warna yang sama, batang naik dan batang turun untuk satu\r\n   kelas akan dibedakan oleh posisi saja -- dan posisi sulit dibaca saat\r\n   batang pendek. Warna arah dipakai karena naik/turun adalah informasi\r\n   yang dicari orang, sementara warna kelas sudah ada di tempat lain.\r\n\r\n   Oranye dan biru, bukan hijau dan merah: hijau/merah dibaca sebagai\r\n   bagus/buruk, padahal naik tutupan hutan dan naik tutupan permukiman\r\n   bukan dua hal yang berlawanan. */\r\n.gt-grafik-bar { opacity: .9; }\r\n.gt-grafik-bar--naik { fill: #d97706; }\r\n.gt-grafik-bar--turun { fill: #2563eb; }\r\n.gt-grafik-bar--lainnya { fill: #94a3b8; opacity: .75; }\r\n.gt-grafik-nilai.gt-grafik-bar--naik { fill: #b45309; }\r\n.gt-grafik-nilai.gt-grafik-bar--turun { fill: #1d4ed8; }\r\n.gt-grafik-nilai.gt-grafik-bar--lainnya { fill: var(--text-muted); }\r\n\r\n/* Legenda satu baris per kelas, flowed. Bukan satu baris per kelas yang\r\n   berurutan vertikal -- daftar 22 warna vertikal akan memaksa area\r\n   menggulir, dan tidak ada yang bisa disimpulkan dari daftar itu selain\r\n   \"ada banyak kelas\". */\r\n.gt-legenda { display: flex; flex-wrap: wrap; gap: 3px 8px; margin-top: 6px; }\r\n.gt-legenda-item {\r\n  display: inline-flex; align-items: center; gap: 4px;\r\n  font-size: 8.5px; color: var(--text-secondary); line-height: 1.4;\r\n}\r\n.gt-legenda-item i {\r\n  width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto;\r\n  border: 1px solid rgba(15, 23, 42, .18);\r\n}\r\n\r\n/* Insight: satu butir per temuan. `penting` dipakai untuk hal yang\r\n   mengubah cara orang membaca seluruh angka di kartu ini -- kelas yang\r\n   hilang, dan peta yang tidak sebanding -- bukan untuk yang terbesar saja. */\r\n.gt-insight {\r\n  margin-top: 9px; padding: 7px 8px;\r\n  border: 1px solid var(--border-color); border-radius: 6px;\r\n  background: var(--bg-primary);\r\n}\r\n.gt-insight-item {\r\n  display: flex; align-items: flex-start; gap: 6px;\r\n  font-size: 10px; line-height: 1.5; color: var(--text-secondary);\r\n}\r\n.gt-insight-item + .gt-insight-item {\r\n  margin-top: 5px; padding-top: 5px;\r\n  border-top: 1px dashed var(--border-color);\r\n}\r\n.gt-insight-item b { color: var(--text-primary); font-weight: 700; }\r\n.gt-insight-ikon {\r\n  flex: 0 0 auto; width: 14px; height: 14px; margin-top: 1px;\r\n  display: grid; place-items: center;\r\n  border-radius: 50%; font-size: 9px; font-weight: 700;\r\n  background: var(--bg-card-hover); color: var(--text-muted);\r\n}\r\n.gt-insight-item--penting {\r\n  color: var(--text-primary);\r\n}\r\n.gt-insight-item--penting .gt-insight-ikon {\r\n  background: #fef3c7; color: #92400e;\r\n}\r\n[data-theme=\"dark\"] .gt-grafik-iris { stroke: var(--bg-card); }\r\n[data-theme=\"dark\"] .gt-grafik-bar--naik { fill: #fbbf24; }\r\n[data-theme=\"dark\"] .gt-grafik-bar--turun { fill: #93c5fd; }\r\n[data-theme=\"dark\"] .gt-grafik-nilai.gt-grafik-bar--naik { fill: #fcd34d; }\r\n[data-theme=\"dark\"] .gt-grafik-nilai.gt-grafik-bar--turun { fill: #bfdbfe; }\r\n[data-theme=\"dark\"] .gt-insight-item--penting .gt-insight-ikon { background: #422006; color: #fde68a; }\r\n\r\n/* Tabel perubahan 2020 -> 2024.\r\n\r\n   Dibuat sebagai <table> sungguhan dengan <thead>, bukan daftar <ul>\r\n   dengan label di kaki. Tiga kolom angka tanpa judul membuat \"12,4 ha\"\r\n   di kolom kedua bisa berarti 2020 atau 2024, dan yang salah baca delta-nya\r\n   salah arah -- jadi judul kolom harus melekat pada kolomnya.\r\n\r\n   TIDAK memakai max-height atau overflow. Daftar kelas bisa 22 baris, dan\r\n   daftar yang perlu digulir di dalam panel yang sudah punya daftar lain\r\n   di atasnya hanya membuat panel terasa sempit tanpa menambah informasi;\r\n   baris tabel ini pendek, jadi semuanya muat. Lebar kolom dikunci lewat\r\n   .geotani-tutupan-ha dan .geotani-tutupan-delta supaya kelas dengan luas\r\n   besar tidak mendorong kolom perubahan ke luar panel -- perubahan justru\r\n   yang paling ingin dilihat, jadi itu yang harus terakhir hilang. */\r\n.geotani-tutupan-tabel {\r\n  width: 100%; margin-top: 6px;\r\n  border-collapse: collapse; table-layout: fixed;\r\n}\r\n.geotani-tutupan-tabel th,\r\n.geotani-tutupan-tabel td {\r\n  padding: 4px 4px;\r\n  border-bottom: 1px solid var(--border-color);\r\n  font-size: 10px; vertical-align: baseline;\r\n}\r\n.geotani-tutupan-tabel thead th {\r\n  padding-bottom: 5px;\r\n  border-bottom: 1px solid var(--border-color);\r\n  font-size: 8.5px; font-weight: 700; line-height: 1.3;\r\n  color: var(--text-muted); text-align: left;\r\n  text-transform: uppercase; letter-spacing: .04em;\r\n}\r\n.geotani-tutupan-tabel tbody th {\r\n  font-weight: 400; text-align: left;\r\n}\r\n/* Sel kelas memuat swatch + nama dalam satu sel, jadi rata kiri dan\r\n   boleh membungkus; kolom angka rata kanan dan tidak boleh membungkus. */\r\n.geotani-tutupan-tabel tbody th > .geotani-lbslsd-swatch { margin-right: 5px; }\r\n.geotani-tutupan-tabel .geotani-sls-name { display: inline; }\r\n.geotani-tutupan-tabel tbody tr[data-tutupan-kelas] { cursor: pointer; }\r\n.geotani-tutupan-tabel tbody tr[data-tutupan-kelas]:hover { background: var(--bg-card-hover); }\r\n.geotani-tutupan-tabel tbody tr:last-child th,\r\n.geotani-tutupan-tabel tbody tr:last-child td { border-bottom: none; }\r\n\r\n.geotani-tutupan-ha {\r\n  width: 62px; text-align: right; white-space: nowrap;\r\n  color: var(--text-secondary); font-variant-numeric: tabular-nums;\r\n}\r\n.geotani-tutupan-delta {\r\n  width: 68px; text-align: right; white-space: nowrap;\r\n  font-weight: 700; font-variant-numeric: tabular-nums;\r\n}\r\n.geotani-tutupan-tabel thead .geotani-tutupan-ha,\r\n.geotani-tutupan-tabel thead .geotani-tutupan-delta { text-align: right; }\r\n\r\n/* Arah perubahan dibedakan warna, bukan hanya tanda plus dan minus. Tanda\r\n   sudah ada di teks, jadi ini lapisan kedua untuk pembaca yang menangkap\r\n   warna sebelum membaca. Hijau di kelas naik bisa disalahartikan sebagai\r\n   hal bagus dan merah sebagai bahaya, padahal keduanya cuma arah --\r\n   pertanian bisa naik atau turun tanpa itu berarti baik atau buruk. Jadi\r\n   kedua warna dipilih netral dan sengaja tidak memakai hijau dan merah. */\r\n.geotani-tutupan-delta--naik { color: #b45309; }\r\n.geotani-tutupan-delta--turun { color: #1d4ed8; }\r\n.geotani-tutupan-delta--nol { color: var(--text-muted); font-weight: 400; }\r\n\r\n/* Catatan kelas hilang dari tahun terakhir diberi warna, bukan gaya miring:\r\n   gaya miring dipakai juga untuk penanda \"di luar daftar\", jadi memakai\r\n   bentuk yang sama membuat dua kondisi berbeda terlihat sama. */\r\n.geotani-tutupan-tabel i { color: #b91c1c; font-style: normal; font-weight: 600; }\r\n[data-theme=\"dark\"] .geotani-tutupan-delta--naik { color: #fbbf24; }\r\n[data-theme=\"dark\"] .geotani-tutupan-delta--turun { color: #93c5fd; }\r\n[data-theme=\"dark\"] .geotani-tutupan-tabel i { color: #fca5a5; }\r\n\r\n/* GeoTani Search */\r\n.geotani-search-container { position: relative; }\r\n\r\n\r\n    .geotani-search-input {\r\n      width: 100%; padding: 9px 12px; border: 1px solid #bbf7d0; border-radius: 8px;\r\n      font-size: 12px; background: #f0fdf4; outline: none; box-sizing: border-box;\r\n      transition: border-color .2s;\r\n    }\r\n    .geotani-search-input:focus { border-color: #16a34a; background: #fff; box-shadow: 0 0 0 3px rgba(22,163,74,.12); }\r\n    .geotani-autocomplete-list {\r\n      position: absolute; top: calc(100% + 2px); left: 0; right: 0; z-index: 1005;\r\n      display: none; max-height: 220px; overflow-y: auto; background: #fff;\r\n      border: 1px solid #bbf7d0; border-radius: 8px; box-shadow: 0 7px 15px rgba(22,163,74,.13);\r\n    }\r\n    .geotani-ac-item {\r\n      display: block; width: 100%; padding: 8px 10px; border: 0;\r\n      border-bottom: 1px solid #dcfce7; background: #fff; color: #166534;\r\n      cursor: pointer; font-size: 11px; text-align: left; line-height: 1.45;\r\n    }\r\n    .geotani-ac-item:last-child { border-bottom: 0; }\r\n    .geotani-ac-item:hover { background: #f0fdf4; }\r\n    .geotani-ac-item strong { font-size: 12px; color: #166534; display: block; margin-bottom: 2px; }\r\n    .geotani-ac-item small { display: block; color: #16a34a; font-size: 9px; }\r\n\r\n    /* Geotani Popup Insight */\r\n    .geotani-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid #dcfce7; }\r\n    .geotani-section-title { font-size: 11px; font-weight: 700; color: #166534; margin-bottom: 8px; letter-spacing: .03em; }\r\n    .geotani-insight-grid { display: flex; flex-direction: column; gap: 6px; }\r\n    .geotani-card {\r\n      display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto;\r\n      gap: 0 8px; padding: 8px 10px; border-radius: 8px; border-left: 3px solid var(--card-accent, #16a34a);\r\n      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);\r\n      transition: transform .15s;\r\n    }\r\n    .geotani-card:hover { transform: translateX(2px); }\r\n    .geotani-card-icon { grid-row: 1 / 3; font-size: 18px; display: flex; align-items: center; justify-content: center; width: 28px; }\r\n    .geotani-card-info { display: flex; flex-direction: column; gap: 1px; }\r\n    .geotani-card-label { font-size: 10px; font-weight: 700; color: #166534; }\r\n    .geotani-card-luas { font-size: 13px; font-weight: 800; color: var(--card-accent, #16a34a); }\r\n    .geotani-card-count { font-size: 9px; color: #668198; }\r\n    .geotani-card-detail {\r\n      grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;\r\n      padding-top: 4px; border-top: 1px dashed #bbf7d0;\r\n    }\r\n    .geotani-detail-item {\r\n      font-size: 9px; color: #166534; background: #dcfce7; padding: 2px 6px;\r\n      border-radius: 4px; white-space: nowrap;\r\n    }\r\n    .geotani-detail-item b { color: var(--card-accent, #16a34a); }\r\n    .geotani-empty { text-align: center; padding: 12px 0; color: #668198; }\r\n    .geotani-empty span { font-size: 20px; display: block; margin-bottom: 4px; }\r\n    .geotani-empty small { font-size: 10px; }\r\n\r\n    /* Alat Gambar & Ukur */\r\n    /* Susun kartu Gambar dan Ukur & Kelola secara vertikal agar masing-masing\r\n       memakai satu baris penuh pada panel GeoTools. */\r\n    .alat-grid-2 { display: grid; grid-template-columns: 1fr; gap: 10px; }\r\n    .alat-card {\r\n      border: 1px solid #e8eef3; border-radius: 10px; background: #f8fbfe;\r\n      overflow: hidden; transition: box-shadow .2s;\r\n    }\r\n    .alat-card:hover { box-shadow: 0 4px 12px rgba(8,63,102,.08); }\r\n    .alat-card-header {\r\n      display: flex; align-items: center; gap: 6px;\r\n      padding: 8px 10px; background: #eef5fb; border-bottom: 1px solid #e0eaf3;\r\n      font-size: 12px; font-weight: 600; color: #16466c;\r\n    }\r\n    .alat-card-header svg { color: #0879bf; flex-shrink: 0; }\r\n    .alat-card-body {\r\n      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px;\r\n    }\r\n    .alat-btn-icon {\r\n      display: flex; flex-direction: column; align-items: center; justify-content: center;\r\n      gap: 4px; padding: 10px 4px; border: 1px solid #dce6ef; border-radius: 8px;\r\n      background: #fff; color: #16466c; cursor: pointer; font-size: 10px;\r\n      transition: all .15s;\r\n    }\r\n    .alat-btn-icon:hover { background: #e8f4fc; border-color: #0879bf; color: #0879bf; transform: translateY(-1px); }\r\n    .alat-btn-icon svg { transition: color .15s; }\r\n    .alat-btn-icon.alat-btn-danger { color: #c0392b; }\r\n    .alat-btn-icon.alat-btn-danger:hover { background: #fdecea; border-color: #c0392b; }\r\n    .alat-btn-icon.alat-btn-success { color: #16a085; }\r\n    .alat-btn-icon.alat-btn-success:hover { background: #e8f8f5; border-color: #16a085; }\r\n    .alat-measure-result {\r\n      margin-top: 8px;\r\n      padding: 9px 10px;\r\n      border-radius: 8px;\r\n      background: #eef7ff;\r\n      color: #175a87;\r\n      font-size: 11px;\r\n      line-height: 1.5;\r\n    }\r\n\r\n    /* Geotools File Panels — Modern Style */\r\n    #tab-geotools .geoid-subtab-panel.active {\r\n      display: grid; grid-template-columns: 1fr; gap: 12px; padding-top: 4px;\r\n    }\r\n    .geotools-dropzone {\r\n      display: flex; flex-direction: column; gap: 0;\r\n      border: 2px dashed #cbd5e1; border-radius: 12px;\r\n      background: #f8fafc; cursor: pointer;\r\n      transition: all .2s ease; text-align: center;\r\n      padding: 20px 14px 14px;\r\n    }\r\n    .geotools-dropzone:hover {\r\n      border-color: #0891b2; background: #ecfeff;\r\n    }\r\n    .geotools-dropzone.dragover {\r\n      border-color: #0891b2; background: #ecfeff;\r\n      border-style: solid;\r\n      box-shadow: 0 0 0 3px rgba(8,145,178,.12);\r\n    }\r\n    .geotools-dropzone-input { display: none; }\r\n    .geotools-dropzone-content { display: flex; flex-direction: column; align-items: center; gap: 8px; }\r\n    .geotools-dropzone-icon {\r\n      width: 44px; height: 44px;\r\n      display: flex; align-items: center; justify-content: center;\r\n      border-radius: 12px;\r\n      background: linear-gradient(135deg, #ecfeff 0%, #cffafe 100%);\r\n      color: #0891b2;\r\n      transition: transform .2s ease;\r\n    }\r\n    .geotools-dropzone:hover .geotools-dropzone-icon { transform: scale(1.05); }\r\n    .geotools-dropzone-icon--green {\r\n      background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);\r\n      color: #10b981;\r\n    }\r\n    .geotools-dropzone-icon--orange {\r\n      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);\r\n      color: #f97316;\r\n    }\r\n    .geotools-dropzone-text { font-size: 13px; font-weight: 600; color: #334155; }\r\n    .geotools-dropzone-accept { font-size: 11px; color: #64748b; }\r\n    .geotools-dropzone-filename {\r\n      font-size: 11px; color: #94a3b8; margin-top: 10px;\r\n      padding-top: 10px; border-top: 1px solid #e2e8f0;\r\n      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\r\n      max-width: 100%;\r\n    }\r\n    .geotools-dropzone-filename.has-file { color: #0891b2; font-weight: 600; }\r\n    .geotools-btn {\r\n      width: 100%; height: 44px; padding: 0 16px; font-size: 13px; font-weight: 700;\r\n      border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;\r\n      background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%);\r\n      color: #fff; border: none; cursor: pointer;\r\n      box-shadow: 0 2px 8px rgba(8,145,178,.25);\r\n      transition: all .2s ease;\r\n      text-align: center;\r\n      line-height: 1;\r\n      white-space: nowrap;\r\n      overflow: hidden;\r\n      box-sizing: border-box;\r\n      flex-direction: row;\r\n    }\r\n    .geotools-btn svg {\r\n      order: -1;\r\n      flex-shrink: 0;\r\n    }\r\n    .geotools-btn:hover { \r\n      box-shadow: 0 4px 16px rgba(8,145,178,.35); \r\n      transform: translateY(-1px); \r\n    }\r\n    .geotools-btn:active {\r\n      transform: translateY(0);\r\n      box-shadow: 0 2px 8px rgba(8,145,178,.25);\r\n    }\r\n    .geotools-btn--green { \r\n      background: linear-gradient(135deg, #10b981 0%, #059669 100%);\r\n      box-shadow: 0 2px 8px rgba(16,185,129,.25);\r\n    }\r\n    .geotools-btn--green:hover { \r\n      box-shadow: 0 4px 16px rgba(16,185,129,.35); \r\n    }\r\n    .geotools-btn--orange { \r\n      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);\r\n      box-shadow: 0 2px 8px rgba(249,115,22,.25);\r\n    }\r\n    .geotools-btn--orange:hover { \r\n      box-shadow: 0 4px 16px rgba(249,115,22,.35); \r\n    }\r\n\r\n    .arcgis-source-action-btn {\r\n      min-height: 32px;\r\n      height: 32px;\r\n      padding: 0 10px;\r\n      border-radius: 7px;\r\n      font-size: 10px;\r\n    }\r\n    .arcgis-source-action-btn.is-loading {\r\n      position: relative;\r\n      color: transparent;\r\n    }\r\n    .arcgis-source-action-btn.is-loading::after {\r\n      content: '';\r\n      position: absolute;\r\n      width: 13px;\r\n      height: 13px;\r\n      border: 2px solid rgba(255,255,255,.45);\r\n      border-top-color: #fff;\r\n      border-radius: 50%;\r\n      animation: arcgis-source-spin .7s linear infinite;\r\n    }\r\n    @keyframes arcgis-source-spin { to { transform: rotate(360deg); } }\r\n    .arcgis-source-card {\r\n      padding: 12px;\r\n      border: 1px solid #dbe7ee;\r\n      border-radius: 10px;\r\n      background: #fbfdfe;\r\n    }\r\n    .arcgis-source-header {\r\n      display: flex;\r\n      align-items: flex-start;\r\n      gap: 8px;\r\n      margin-bottom: 12px;\r\n    }\r\n    .arcgis-source-header strong { display: block; color: #16466c; font-size: 12px; }\r\n    .arcgis-source-header small { display: block; margin-top: 3px; color: #64748b; font-size: 9px; }\r\n    .arcgis-source-badge {\r\n      margin-left: auto;\r\n      padding: 3px 6px;\r\n      border-radius: 4px;\r\n      background: #ecfdf5;\r\n      color: #047857;\r\n      font-size: 8px;\r\n      font-weight: 700;\r\n      letter-spacing: .04em;\r\n    }\r\n    .arcgis-source-toolbar {\r\n      display: flex;\r\n      align-items: center;\r\n      gap: 8px;\r\n      margin: 10px 0 6px;\r\n      color: #64748b;\r\n      font-size: 10px;\r\n    }\r\n    .arcgis-source-toolbar > span { flex: 1; }\r\n    .arcgis-layer-tree {\r\n      max-height: 25vh;\r\n      overflow: auto;\r\n      padding: 6px;\r\n      border: 1px solid #dbe7ee;\r\n      border-radius: 8px;\r\n      background: #fff;\r\n      scrollbar-width: thin;\r\n    }\r\n    .arcgis-tree-group { margin: 0; }\r\n    .arcgis-tree-group summary {\r\n      display: flex;\r\n      align-items: center;\r\n      gap: 6px;\r\n      padding: 6px 5px;\r\n      border-radius: 5px;\r\n      color: #315b78;\r\n      cursor: pointer;\r\n      font-size: 10px;\r\n      list-style: none;\r\n    }\r\n    .arcgis-tree-group summary::-webkit-details-marker { display: none; }\r\n    .arcgis-tree-group summary::before { content: '▸'; color: #7895aa; font-size: 10px; }\r\n    .arcgis-tree-group[open] > summary::before { content: '▾'; }\r\n    .arcgis-tree-group summary:hover { background: #f1f7fa; }\r\n    .arcgis-tree-summary-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }\r\n    .arcgis-tree-meta { color: #94a3b8; font-size: 8px; white-space: nowrap; }\r\n    .arcgis-tree-children { margin-left: 10px; padding-left: 8px; border-left: 1px solid #e5eef3; }\r\n    .arcgis-tree-leaf {\r\n      display: grid;\r\n      grid-template-columns: 16px minmax(0,1fr) auto;\r\n      align-items: center;\r\n      gap: 5px;\r\n      padding: 5px 4px;\r\n      border-radius: 4px;\r\n      color: #47677f;\r\n      font-size: 10px;\r\n    }\r\n    .arcgis-tree-leaf:hover { background: #f1f7fa; }\r\n    .arcgis-tree-leaf input { width: 13px; height: 13px; margin: 0; accent-color: #0891b2; }\r\n    .arcgis-tree-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n    .arcgis-tree-type { color: #94a3b8; font-size: 8px; }\r\n    .arcgis-tree-leaf--disabled { color: #94a3b8; cursor: default; }\r\n    .arcgis-tree-empty { padding: 12px 4px; color: #94a3b8; font-size: 10px; text-align: center; }\r\n    .arcgis-popup { min-width: 240px; color: #1e293b; font-family: 'Segoe UI', system-ui, sans-serif; }\r\n    .arcgis-popup-title { padding: 10px 12px 4px; color: #16466c; font-size: 12px; font-weight: 700; }\r\n    .arcgis-popup-source { padding: 0 12px 8px; color: #7895aa; font-size: 9px; }\r\n    .arcgis-popup-body { max-height: 300px; overflow: auto; padding: 0 12px 10px; }\r\n    .arcgis-popup-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 4px 0; border-top: 1px solid #edf2f5; font-size: 10px; }\r\n    .arcgis-popup-row span { color: #7895aa; }\r\n    .arcgis-popup-row strong { max-width: 58%; color: #315b78; font-weight: 600; text-align: right; overflow-wrap: anywhere; }\r\n    .arcgis-leaflet-popup .leaflet-popup-content { margin: 0; }\r\n\r\n    /* Export GeoTIFF Petadasar — di bawah Quick Layer Bar */\r\n    .petadasar-export-block {\r\n      position: absolute;\r\n      top: 108px;\r\n      left: 50%;\r\n      transform: translateX(-50%);\r\n      z-index: 999;\r\n      display: flex;\r\n      flex-direction: column;\r\n      align-items: center;\r\n      gap: 6px;\r\n      width: max-content;\r\n      max-width: calc(100% - 32px);\r\n      box-sizing: border-box;\r\n    }\r\n    .petadasar-export-block .geotools-btn {\r\n      width: auto;\r\n      min-width: 0;\r\n      max-width: 100%;\r\n      height: 34px;\r\n      padding: 0 14px;\r\n      font-size: 12px;\r\n      border-radius: 999px;\r\n      box-shadow: 0 2px 8px rgba(8,145,178,.28), 0 1px 3px rgba(0,0,0,.08);\r\n      background: rgba(8, 145, 178, .95);\r\n      backdrop-filter: blur(6px);\r\n      -webkit-backdrop-filter: blur(6px);\r\n    }\r\n    .petadasar-export-block .geotools-btn:disabled {\r\n      opacity: .7;\r\n      cursor: wait;\r\n      transform: none;\r\n      box-shadow: 0 2px 8px rgba(8,145,178,.25);\r\n    }\r\n    .petadasar-export-block .geotools-btn:hover {\r\n      background: #0891b2;\r\n      box-shadow: 0 4px 14px rgba(8,145,178,.35);\r\n    }\r\n    .petadasar-tiff-status {\r\n      margin-bottom: 0;\r\n      padding: 8px 10px;\r\n      font-size: 11px;\r\n      border-radius: 10px;\r\n      box-shadow: 0 1px 4px rgba(0,0,0,.08);\r\n    }\r\n    .petadasar-tiff-hint {\r\n      font-size: 11px;\r\n      color: #475569;\r\n      text-align: center;\r\n      line-height: 1.4;\r\n      text-shadow: 0 1px 2px rgba(255,255,255,.8);\r\n    }\r\n    .petadasar-tiff-status--error {\r\n      color: #b91c1c;\r\n      background: #fef2f2;\r\n    }\r\n\r\n    /* Timeline Steps */\r\n    .geotools-steps {\r\n      padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 10px;\r\n      background: #f8fafc;\r\n    }\r\n    .geotools-steps-title { font-size: 12px; font-weight: 700; color: #0f172a; margin-bottom: 10px; }\r\n    .geotools-step {\r\n      display: flex; align-items: flex-start; gap: 10px; padding: 6px 0;\r\n      font-size: 12px; color: #475569; line-height: 1.5;\r\n    }\r\n    .geotools-step-num {\r\n      flex-shrink: 0; width: 20px; height: 20px;\r\n      display: flex; align-items: center; justify-content: center;\r\n      border-radius: 50%; \r\n      background: linear-gradient(135deg, #ecfeff 0%, #cffafe 100%); \r\n      color: #0891b2;\r\n      font-size: 11px; font-weight: 700;\r\n      border: 1px solid #a5f3fc;\r\n    }\r\n    .alat-file-hint { color: #668198; font-size: 10px; line-height: 1.35; }\r\n\r\n    /* Alat Analisis GeoJSON/SHP */\r\n    .alat-file-input {\r\n      width: 100%;\r\n      padding: 8px;\r\n      font-size: 11px;\r\n      border: 1px solid #ccc;\r\n      border-radius: 6px;\r\n      background: #fff;\r\n    }\r\n    .alat-layer-info {\r\n      margin: 8px 0;\r\n      font-size: 11px;\r\n      color: #668198;\r\n    }\r\n    /* Layer Dimuat Card */\r\n    .alat-layer-card-wrap {\r\n      border: 1px solid #e8eef3; border-radius: 10px; background: #f8fbfe;\r\n      overflow: hidden; margin-top: 10px;\r\n    }\r\n    .arcgis-attribute-panel {\r\n      margin-top: t-size: 14px;\r\n    }\r\n    @keyframes fadeIn {\r\n      from { opacity: 0; }\r\n      to { opacity: 1; }\r\n    }\r\n    @keyframes slideUp {\r\n      from { opacity: 0; transform: translateY(20px) scale(0.95); }\r\n      to { opacity: 1; transform: translateY(0) scale(1); }\r\n    }\r\n    @keyframes pulse {\r\n      0%, 100% { transform: scale(1); }\r\n      50% { transform: scale(1.05); }\r\n    }\r\n\r\n    .leaflet-control-scale {\r\n      background: var(--bg-glass);\r\n      border: none;\r\n      box-shadow: 0 2px 8px rgba(0,0,0,0.18);\r\n      border-radius:5px;\r\n      padding: 3px 4px;\r\n      left: 4px;\r\n      bottom: 4px;\r\n      font-family: \"Avenir Next\", \"Segoe UI\", sans-serif;\r\n      font-size: 9px;\r\n      color: var(--text-primary);\r\n      line-height: 1.4;\r\n      backdrop-filter: blur(4px);\r\n      z-index: 999;\r\n    }\r\n\r\n    /* Floating Draw Toolbar — FAB Style */\r\n    .leaflet-draw-toolbar-wrap {\r\n      display: none !important;\r\n    }\r\n    .draw-fab-wrap {\r\n      position: relative;\r\n      margin: 0 !important;\r\n      overflow: visible;\r\n    }\r\n    .draw-fab-btn {\r\n      display: grid;\r\n      place-items: center;\r\n      width: 38px !important;\r\n      height: 38px !important;\r\n      margin: 0 !important;\r\n      border: 1px solid var(--border-color) !important;\r\n      border-radius: 50% !important;\r\n      background: var(--bg-card) !important;\r\n      color: var(--accent) !important;\r\n      font-size: 18px;\r\n      cursor: pointer;\r\n      box-shadow: 0 6px 18px rgba(8,63,102,.2) !important;\r\n      transition: transform .2s, box-shadow .2s, background .2s;\r\n      position: relative;\r\n      z-index: 1001;\r\n      padding: 0;\r\n    }\r\n    .draw-fab-btn:hover {\r\n      background: var(--bg-card-hover) !important;\r\n      box-shadow: inset 0 0 0 1px var(--accent);\r\n      transform: translateY(-2px);\r\n    }\r\n    .draw-fab-btn.active {\r\n      background: var(--accent) !important;\r\n      color: var(--text-inverse) !important;\r\n      transform: scale(0.95);\r\n    }\r\n    /* Draw control + Actions (Clear All / Export) — satu kotak tunggal, gaya modern GIS 2026 */\r\n    .leaflet-draw {\r\n      background: #fff;\r\n      border: 2px solid rgba(0, 0, 0, .2);\r\n      border-radius: 4px;\r\n      box-shadow: 0 1px 2px rgba(15, 23, 42, .12), 0 6px 16px rgba(15, 23, 42, .10);\r\n    }\r\n    .leaflet-draw .leaflet-draw-toolbar {\r\n      margin-top: 0;\r\n      border: 0;\r\n      border-radius: 0;\r\n      background: transparent;\r\n      box-shadow: none;\r\n    }\r\n    .leaflet-draw .leaflet-draw-toolbar a {\r\n      box-sizing: border-box;\r\n      border: 0;\r\n      border-bottom: 1px solid rgba(0, 0, 0, .12);\r\n      border-radius: 0;\r\n      background-color: #fff;\r\n      transition: background-color .16s ease;\r\n    }\r\n    .leaflet-draw .leaflet-draw-toolbar a:first-child,\r\n    .leaflet-draw .leaflet-draw-toolbar a:last-child { border-radius: 0; }\r\n    .leaflet-draw .leaflet-draw-toolbar a:hover { background-color: #f4f4f4; }\r\n    .leaflet-draw .leaflet-draw-toolbar a.leaflet-disabled,\r\n    .leaflet-draw .leaflet-draw-toolbar a.leaflet-disabled:hover { background-color: #f4f4f4; }\r\n    .leaflet-draw > .leaflet-draw-section:last-child .leaflet-draw-toolbar a:last-child {\r\n      border-bottom: 0;\r\n      border-radius: 0 0 2px 2px;\r\n    }\r\n    .draw-actions-wrap {\r\n      display: flex;\r\n      flex-direction: column;\r\n      align-items: stretch;\r\n      gap: 0;\r\n      margin: 0;\r\n      padding: 0;\r\n      background: transparent;\r\n      border: 0;\r\n      border-radius: 0;\r\n      box-shadow: none;\r\n      position: relative;\r\n      z-index: auto;\r\n    }\r\n    .leaflet-draw > .draw-actions-wrap .draw-actions-btn:first-child { border-radius: 2px 2px 0 0; }\r\n    .draw-actions-btn {\r\n      display: inline-flex;\r\n      align-items: center;\r\n      justify-content: center;\r\n      box-sizing: border-box;\r\n      width: 30px;\r\n      height: 30px;\r\n      padding: 0;\r\n      margin: 0;\r\n      border: 0;\r\n      border-bottom: 1px solid rgba(0, 0, 0, .12);\r\n      border-radius: 0;\r\n      background: #fff;\r\n      color: #1f2937;\r\n      font-family: \"Avenir Next\", \"Segoe UI\", sans-serif;\r\n      font-size: 11px;\r\n      font-weight: 700;\r\n      line-height: 1;\r\n      letter-spacing: .01em;\r\n      white-space: nowrap;\r\n      cursor: pointer;\r\n      -webkit-tap-highlight-color: transparent;\r\n      transition: background-color .16s ease, color .16s ease;\r\n    }\r\n    .draw-actions-label { display: none; }\r\n    .draw-actions-btn svg {\r\n      width: 16px;\r\n      height: 16px;\r\n      flex: none;\r\n      transition: transform .16s ease;\r\n    }\r\n    .draw-actions-btn:hover {\r\n      background: #f4f4f4;\r\n      color: var(--accent);\r\n    }\r\n    .draw-actions-btn:hover svg { transform: scale(1.08); }\r\n    .draw-actions-btn:active { background: #e8eaed; }\r\n    .draw-actions-btn:focus-visible {\r\n      outline: 2px solid #0891b2;\r\n      outline-offset: -2px;\r\n    }\r\n    .draw-actions-btn.geojson:hover { background: #dcfce7; color: #16a34a; }\r\n    .draw-actions-btn.shp:hover { background: #e0f2fe; color: #0284c7; }\r\n    [data-theme=\"dark\"] .draw-actions-btn:focus-visible { outline-color: #22d3ee; }\r\n    body.draw-chrome-hidden .draw-actions-wrap,\r\n    body.draw-chrome-hidden .leaflet-draw { display: none; }\r\n\r\n    /* Draw chrome (Export GeoJSON / Export SHP / Hapus Semua) disembunyikan\r\n       di MOBILE selama sheet Gambar & Ukur mengembang.\r\n\r\n       Kenapa perlu: syncDrawChrome() di alat-draw-measure.js sengaja\r\n       melepas body.draw-chrome-hidden begitu sheet dibuka -- itu memang\r\n       niatnya, agar chrome gambar ikut tampil bersama sheetnya. Masalahnya\r\n       di mobile: sheet memakan ~50dvh, dan tepi bawah kotak peta berada\r\n       --map-chrome di belakang sheet, sehingga kontrol kiri-bawah ikut\r\n       terangkat sebesar `80px + var(--map-chrome)` (lihat aturan\r\n       body.sheet-terbuka .leaflet-bottom.leaflet-left). Kalau peta hanya\r\n       setinggi pita bebas, kotak ini terdorong ke atas sampai menabrak\r\n       unified search yang menempel di top:14px.\r\n\r\n       Di desktop TIDAK disembunyikan: peta masih utuh, dan kotaknya muat\r\n       rapi di kiri-bawah tanpa menabrak apa pun. */\r\n\r\n    @media (max-width: 768px) {\r\n      body.dm-sidebar-open:not(.dm-sidebar-minimized) .leaflet-draw,\r\n      body.dm-sidebar-open:not(.dm-sidebar-minimized) .draw-actions-wrap {\r\n        display: none !important;\r\n      }\r\n    }\r\n    .leaflet-control-scale-line {\r\n      border-color: var(--text-secondary);\r\n      border-width: 1px 0 0 0;\r\n      border-style: solid;\r\n      padding-top: 2px;\r\n      margin-top: 2px;\r\n      color: var(--text-secondary);\r\n      font-size: 9px;\r\n      font-weight: 500;\r\n      text-align: center;\r\n    }\r\n    .leaflet-control-scale-line:not(:first-child) {\r\n      border-top-width: 1px;\r\n      border-bottom: none;\r\n      margin-top: 1px;\r\n      padding-top: 1px;\r\n    }\r\n\r\n    /* ── AirVisual Legend ── */\r\n    .airvisual-legend.leaflet-bar {\r\n      background: rgba(255,255,255,.96);\r\n      border: 1px solid #e2e8f0;\r\n      border-radius: 10px;\r\n      box-shadow: 0 6px 20px rgba(15,23,42,.16);\r\n      padding: 8px 10px;\r\n      min-width: 200px;\r\n      max-width: 240px;\r\n      max-height: 260px;\r\n      overflow-y: auto;\r\n      font-family: inherit;\r\n    }\r\n    .airvisual-legend-title {\r\n      font-size: 11px;\r\n      font-weight: 700;\r\n      color: var(--text-primary);\r\n      text-transform: uppercase;\r\n      letter-spacing: .04em;\r\n      border-bottom: 1px solid var(--border-color);\r\n      padding-bottom: 5px;\r\n      margin-bottom: 6px;\r\n    }\r\n    .airvisual-legend-items {\r\n      display: flex;\r\n      flex-direction: column;\r\n      gap: 3px;\r\n    }\r\n    .airvisual-legend-item {\r\n      display: flex;\r\n      align-items: center;\r\n      gap: 7px;\r\n    }\r\n    .airvisual-legend-swatch {\r\n      flex: none;\r\n      width: 12px;\r\n      height: 12px;\r\n      border-radius: 3px;\r\n      background: #64748b;\r\n      display: inline-block;\r\n      border: 1px solid rgba(0,0,0,0.1);\r\n    }\r\n    .airvisual-legend-label {\r\n      font-size: 10.5px;\r\n      line-height: 1.35;\r\n      color: #475569;\r\n      word-break: break-word;\r\n    }\r\n\r\n    /* ── OMI Legend ── */\r\n    .omi-legend.leaflet-bar {\r\n      background: rgba(255,255,255,.96);\r\n      border: 1px solid #e2e8f0;\r\n      border-radius: 10px;\r\n      box-shadow: 0 6px 20px rgba(15,23,42,.16);\r\n      padding: 8px 10px;\r\n      min-width: 200px;\r\n      max-width: 300px;\r\n      font-family: inherit;\r\n    }\r\n    .omi-legend-title {\r\n      font-size: 11px;\r\n      font-weight: 700;\r\n      color: var(--text-primary);\r\n      text-transform: uppercase;\r\n      letter-spacing: .04em;\r\n      border-bottom: 1px solid var(--border-color);\r\n      padding-bottom: 5px;\r\n      margin-bottom: 6px;\r\n    }\r\n    .omi-legend-img {\r\n      display: block;\r\n      width: 100%;\r\n      height: auto;\r\n      border-radius: 4px;\r\n    }\r\n\r\n    /* ==================== WELCOME FEATURE MODAL ==================== */\r\n    .welcome-modal {\r\n      position: fixed; inset: 0; z-index: 4000;\r\n      display: none; align-items: center; justify-content: center;\r\n      padding: 18px;\r\n      background: rgba(15, 23, 42, .25);\r\n      backdrop-filter: blur(8px);\r\n      -webkit-backdrop-filter: blur(8px);\r\n      animation: welcome-modal-fade-in .35s ease;\r\n    }\r\n    .welcome-modal.open { display: flex; }\r\n\r\n    @keyframes welcome-modal-fade-in {\r\n      from { opacity: 0; }\r\n      to { opacity: 1; }\r\n    }\r\n\r\n    .welcome-modal-dialog {\r\n      display: flex; flex-direction: column;\r\n      width: min(680px, 100%);\r\n      max-height: min(85vh, 700px);\r\n      max-height: min(85dvh, 700px);\r\n      overflow: hidden;\r\n      border: 1px solid var(--border-color);\r\n      border-radius: 20px;\r\n      background: var(--bg-primary);\r\n      box-shadow: 0 8px 40px rgba(0, 0, 0, .12), 0 1px 3px rgba(0, 0, 0, .06);\r\n      animation: welcome-modal-slide-up .4s cubic-bezier(.22, 1, .36, 1);\r\n      color: var(--text-primary);\r\n    }\r\n\r\n    @keyframes welcome-modal-slide-up {\r\n      from { opacity: 0; transform: translateY(28px) scale(.97); }\r\n      to { opacity: 1; transform: translateY(0) scale(1); }\r\n    }\r\n\r\n    /* -- Header -- */\r\n    .welcome-modal-header {\r\n      flex: 0 0 auto;\r\n      display: flex; flex-direction: column; align-items: center;\r\n      padding: 28px 24px 20px;\r\n      background: linear-gradient(180deg, var(--bg-tertiary) 0%, var(--bg-secondary) 50%, var(--bg-primary) 100%);\r\n      text-align: center;\r\n      border-bottom: 1px solid var(--border-color);\r\n    }\r\n    .welcome-modal-mark {\r\n      display: grid; grid-template-columns: repeat(2, 18px); grid-template-rows: repeat(2, 18px);\r\n      gap: 4px; padding: 8px; border: 1.5px solid #0879bf; border-radius: 14px;\r\n      transform: rotate(-8deg); margin-bottom: 12px;\r\n    }\r\n    .welcome-modal-mark i { border-radius: 5px; }\r\n    .welcome-modal-mark i:nth-child(1) { background: #0879bf; }\r\n    .welcome-modal-mark i:nth-child(2) { background: #f4c329; }\r\n    .welcome-modal-mark i:nth-child(3) { background: #68dce5; }\r\n    .welcome-modal-mark i:nth-child(4) { background: #bce7ed; }\r\n    .welcome-modal-title {\r\n      font-size: 18px; font-weight: 700; color: var(--text-primary); letter-spacing: .01em;\r\n      margin-bottom: 4px;\r\n    }\r\n    .welcome-modal-title span { color: var(--accent); }\r\n    .welcome-modal-subtitle {\r\n      font-size: 12px; color: var(--text-tertiary); font-weight: 400;\r\n    }\r\n\r\n    /* -- Body -- */\r\n    .welcome-modal-body {\r\n      flex: 1; min-height: 0; overflow-y: auto;\r\n      padding: 20px 22px 18px;\r\n      overscroll-behavior: contain;\r\n      scrollbar-width: thin;\r\n      scrollbar-color: var(--scrollbar-thumb) transparent;\r\n    }\r\n    .welcome-modal-body::-webkit-scrollbar { width: 5px; }\r\n    .welcome-modal-body::-webkit-scrollbar-thumb { border-radius: 999px; background: var(--scrollbar-thumb); }\r\n\r\n    /* -- Features Grid -- */\r\n    .welcome-features-label {\r\n      font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: .06em;\r\n      text-transform: uppercase; margin-bottom: 10px;\r\n    }\r\n    .welcome-features-grid {\r\n      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\r\n      margin-bottom: 20px;\r\n    }\r\n    .welcome-feature-card {\r\n      display: flex; align-items: flex-start; gap: 12px;\r\n      padding: 14px;\r\n      border: 1px solid var(--border-color);\r\n      border-radius: 12px;\r\n      background: var(--bg-card);\r\n      transition: border-color .2s, box-shadow .2s, transform .2s;\r\n      cursor: default;\r\n    }\r\n    .welcome-feature-card:hover {\r\n      border-color: var(--accent);\r\n      box-shadow: 0 4px 16px rgba(8, 121, 191, .08);\r\n      transform: translateY(-1px);\r\n    }\r\n    .welcome-feature-icon {\r\n      flex: 0 0 auto;\r\n      display: grid; place-items: center;\r\n      width: 42px; height: 42px;\r\n      border-radius: 10px;\r\n      font-size: 20px;\r\n    }\r\n    .welcome-feature-icon.icon-geoid { background: var(--bg-tertiary); }\r\n    .welcome-feature-icon.icon-satellite { background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-card-hover)); }\r\n    .welcome-feature-icon.icon-geotani { background: var(--bg-tertiary); }\r\n    .welcome-feature-icon.icon-geoportal { background: var(--bg-tertiary); }\r\n    .welcome-feature-icon.icon-geowatch { background: var(--bg-tertiary); }\r\n    .welcome-feature-icon.icon-geowx { background: var(--bg-tertiary); }\r\n    .welcome-feature-icon.icon-geoquake { background: var(--bg-tertiary); }\r\n    .welcome-feature-icon.icon-tools { background: var(--bg-tertiary); }\r\n    .welcome-feature-info { min-width: 0; }\r\n    .welcome-feature-name {\r\n      font-size: 13px; font-weight: 700; color: var(--text-primary);\r\n      margin-bottom: 2px;\r\n    }\r\n    .welcome-feature-desc {\r\n      font-size: 11px; color: var(--text-tertiary); line-height: 1.4;\r\n    }\r\n\r\n    /* -- Highlighted feature (full-width) -- */\r\n    .welcome-feature-card.highlighted {\r\n      grid-column: 1 / -1;\r\n      background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-card-hover));\r\n      border-color: var(--accent);\r\n    }\r\n\r\n    /* -- Tech Badges -- */\r\n    .welcome-tech-label {\r\n      font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: .06em;\r\n      text-transform: uppercase; margin-bottom: 8px;\r\n    }\r\n    .welcome-tech-badges {\r\n      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;\r\n    }\r\n    .welcome-tech-badge {\r\n      display: inline-flex; align-items: center; gap: 4px;\r\n      padding: 4px 10px;\r\n      font-size: 10px; font-weight: 600; color: var(--text-secondary);\r\n      background: var(--bg-tertiary);\r\n      border: 1px solid var(--border-color);\r\n      border-radius: 999px;\r\n      white-space: nowrap;\r\n    }\r\n    .welcome-tech-badge i {\r\n      display: inline-block; width: 6px; height: 6px;\r\n      border-radius: 50%; background: var(--text-muted);\r\n    }\r\n\r\n    /* -- Footer -- */\r\n    .welcome-modal-footer {\r\n      flex: 0 0 auto;\r\n      display: flex; align-items: center; justify-content: center; gap: 10px;\r\n      padding: 16px 22px;\r\n      border-top: 1px solid var(--border-color);\r\n      background: var(--bg-secondary);\r\n    }\r\n    .welcome-btn {\r\n      display: inline-flex; align-items: center; justify-content: center; gap: 8px;\r\n      padding: 10px 22px;\r\n      font-size: 13px; font-weight: 600;\r\n      border: none; border-radius: 10px;\r\n      cursor: pointer;\r\n      transition: background .2s, box-shadow .2s, transform .15s;\r\n      text-decoration: none;\r\n      white-space: nowrap;\r\n    }\r\n    .welcome-btn:active { transform: scale(.97); }\r\n    .welcome-btn-primary {\r\n      background: linear-gradient(135deg, #0879bf, #0b5cab);\r\n      color: #fff;\r\n      box-shadow: 0 2px 8px rgba(8, 121, 191, .3);\r\n    }\r\n    .welcome-btn-primary:hover {\r\n      background: linear-gradient(135deg, #0b5cab, #074a8f);\r\n      box-shadow: 0 4px 14px rgba(8, 121, 191, .4);\r\n    }\r\n    .welcome-btn-secondary {\r\n      background: var(--bg-card);\r\n      color: var(--accent);\r\n      border: 1.5px solid var(--border-color);\r\n    }\r\n    .welcome-btn-secondary:hover {\r\n      background: var(--bg-card-hover);\r\n      border-color: var(--accent);\r\n    }\r\n    .welcome-btn svg { flex-shrink: 0; }\r\n\r\n    /* -- Mobile -- */\r\n    @media (max-width: 600px) {\r\n      .welcome-modal { padding: 10px; }\r\n      .welcome-modal-dialog {\r\n        max-height: min(92dvh, 700px);\r\n        border-radius: 16px;\r\n      }\r\n      .welcome-modal-header { padding: 22px 16px 16px; }\r\n      .welcome-modal-title { font-size: 16px; }\r\n      .welcome-modal-body { padding: 14px 16px 12px; }\r\n      .welcome-features-grid { grid-template-columns: 1fr; gap: 8px; }\r\n      .welcome-modal-footer { flex-direction: column; gap: 8px; padding: 14px 16px; }\r\n      .welcome-btn { width: 100%; }\r\n\r\n\r\n\r\n\r\n\r\n      .panel-header {\r\n        padding: 12px 15px;\r\n        background: #0078d4;\r\n        color: white;\r\n        display: flex;\r\n        justify-content: space-between;\r\n        align-items: center;\r\n        border-top-left-radius: 15px;\r\n        border-top-right-radius: 15px;\r\n      }\r\n    }\r\n\r\n/* ══ Pernyataan dan Penafian (disclaimer) ══\r\n       Muncul setelah modal welcome. Berbeda dari welcome, modal ini tidak\r\n       punya tombol tutup: satu-satunya jalan keluar adalah tombol terima,\r\n       dan tombol itu terkunci sampai kotak persetujuan dicentang. Jadi\r\n       tidak ada jalan menutup penafian tanpa menyatakan diterima.\r\n       hidden dipakai (bukan display:none di CSS) supaya elemen benar-benar\r\n       dikeluarkan dari accessibility tree sebelum sempat tampil. */\r\n    .disclaimer-modal {\r\n      position: fixed; inset: 0; z-index: 4100;\r\n      display: none; align-items: center; justify-content: center;\r\n      padding: 18px;\r\n      background: rgba(15, 23, 42, .45);\r\n      backdrop-filter: blur(8px);\r\n      -webkit-backdrop-filter: blur(8px);\r\n    }\r\n    .disclaimer-modal[hidden] { display: none; }\r\n    .disclaimer-modal.open { display: flex; animation: disclaimer-fade-in .3s ease; }\r\n    @keyframes disclaimer-fade-in { from { opacity: 0; } to { opacity: 1; } }\r\n\r\n    .disclaimer-modal-dialog {\r\n      display: flex; flex-direction: column;\r\n      width: min(640px, 100%);\r\n      max-height: min(88vh, 760px);\r\n      max-height: min(88dvh, 760px);\r\n      overflow: hidden;\r\n      border: 1px solid var(--border-color);\r\n      border-radius: 18px;\r\n      background: var(--bg-primary);\r\n      box-shadow: 0 12px 48px rgba(0, 0, 0, .2);\r\n      animation: disclaimer-slide-up .34s cubic-bezier(.22, 1, .36, 1);\r\n      color: var(--text-primary);\r\n    }\r\n    @keyframes disclaimer-slide-up {\r\n      from { transform: translateY(18px) scale(.98); opacity: 0; }\r\n      to { transform: translateY(0) scale(1); opacity: 1; }\r\n    }\r\n\r\n    .disclaimer-modal-header {\r\n      flex: 0 0 auto;\r\n      display: flex; flex-direction: column; align-items: center;\r\n      padding: 24px 24px 18px;\r\n      background: linear-gradient(180deg, #fef3c7 0%, var(--bg-secondary) 70%, var(--bg-primary) 100%);\r\n      text-align: center;\r\n      border-bottom: 1px solid var(--border-color);\r\n    }\r\n    [data-theme=\"dark\"] .disclaimer-modal-header {\r\n      background: linear-gradient(180deg, #422006 0%, var(--bg-secondary) 70%, var(--bg-primary) 100%);\r\n    }\r\n    .disclaimer-modal-icon {\r\n      display: grid; place-items: center;\r\n      width: 48px; height: 48px; margin-bottom: 12px;\r\n      border-radius: 50%;\r\n      background: #fef3c7; color: #b45309;\r\n    }\r\n    [data-theme=\"dark\"] .disclaimer-modal-icon { background: #78350f; color: #fcd34d; }\r\n    .disclaimer-modal-title {\r\n      margin: 0 0 6px;\r\n      font-size: 19px; font-weight: 700; letter-spacing: -.01em;\r\n    }\r\n    .disclaimer-modal-subtitle {\r\n      margin: 0; max-width: 46ch;\r\n      font-size: 12.5px; line-height: 1.55; color: var(--text-secondary);\r\n    }\r\n    .disclaimer-brand { font-weight: 700; color: var(--accent); }\r\n\r\n    .disclaimer-modal-body {\r\n      flex: 1 1 auto; min-height: 0; overflow-y: auto;\r\n      padding: 18px 22px;\r\n      overscroll-behavior: contain;\r\n      scrollbar-width: thin;\r\n      scrollbar-color: var(--scrollbar-thumb) transparent;\r\n    }\r\n    .disclaimer-modal-body::-webkit-scrollbar { width: 6px; }\r\n    .disclaimer-modal-body::-webkit-scrollbar-thumb { border-radius: 999px; background: var(--scrollbar-thumb); }\r\n\r\n    .disclaimer-list { margin: 0; padding: 0; list-style: none; counter-reset: none; }\r\n    .disclaimer-list > li {\r\n      display: flex; gap: 11px;\r\n      padding: 12px 0;\r\n      border-bottom: 1px dashed var(--border-color);\r\n      font-size: 12.5px; line-height: 1.62; color: var(--text-secondary);\r\n    }\r\n    .disclaimer-list > li:last-child { border-bottom: 0; }\r\n    .disclaimer-list b { color: var(--text-primary); }\r\n    .disclaimer-num {\r\n      flex: 0 0 auto;\r\n      display: grid; place-items: center;\r\n      width: 21px; height: 21px; margin-top: 1px;\r\n      border-radius: 50%;\r\n      background: #b45309; color: #fff;\r\n      font-size: 11px; font-weight: 700;\r\n    }\r\n    [data-theme=\"dark\"] .disclaimer-num { background: #d97706; }\r\n    .disclaimer-sub { margin: 7px 0 0; padding-left: 16px; }\r\n    .disclaimer-sub li { margin-bottom: 3px; }\r\n\r\n    .disclaimer-modal-footer {\r\n      flex: 0 0 auto;\r\n      display: flex; flex-direction: column; gap: 10px;\r\n      padding: 14px 22px 16px;\r\n      border-top: 1px solid var(--border-color);\r\n      background: var(--bg-secondary);\r\n    }\r\n    /* Checkbox asli disembunyikan supaya yang tampil adalah kotak kustom,\r\n       tapi input aslinya tetap ada: tetap bisa difokus dengan keyboard dan\r\n       tetap dibaca screen reader. */\r\n    .disclaimer-consent {\r\n      display: flex; align-items: flex-start; gap: 10px;\r\n      cursor: pointer; user-select: none;\r\n    }\r\n    .disclaimer-consent input {\r\n      position: absolute; width: 1px; height: 1px;\r\n      margin: -1px; padding: 0; border: 0;\r\n      clip: rect(0 0 0 0); clip-path: inset(50%); overflow: hidden; white-space: nowrap;\r\n    }\r\n    .disclaimer-consent-box {\r\n      flex: 0 0 auto;\r\n      display: grid; place-items: center;\r\n      width: 19px; height: 19px; margin-top: 1px;\r\n      border: 1.5px solid var(--border-color); border-radius: 5px;\r\n      background: var(--bg-card); color: transparent;\r\n      transition: background .15s, border-color .15s, color .15s;\r\n    }\r\n    .disclaimer-consent input:checked + .disclaimer-consent-box {\r\n      background: #b45309; border-color: #b45309; color: #fff;\r\n    }\r\n    .disclaimer-consent input:focus-visible + .disclaimer-consent-box {\r\n      outline: 2px solid var(--accent); outline-offset: 2px;\r\n    }\r\n    .disclaimer-consent-text { font-size: 12px; line-height: 1.55; color: var(--text-secondary); }\r\n    .disclaimer-consent-text b { color: var(--text-primary); }\r\n\r\n    .disclaimer-btn {\r\n      display: inline-flex; align-items: center; justify-content: center; gap: 8px;\r\n      padding: 11px 20px;\r\n      font-size: 13px; font-weight: 600; font-family: inherit;\r\n      border: none; border-radius: 10px; cursor: pointer;\r\n    }\r\n    .disclaimer-btn-primary { background: linear-gradient(135deg, #b45309, #92400e); color: #fff; }\r\n    .disclaimer-btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #92400e, #78350f); }\r\n    /* Status terkunci harus terbaca, bukan sekadar terlihat abu-abu. */\r\n    .disclaimer-btn-primary:disabled {\r\n      background: var(--bg-card-hover);\r\n      color: var(--text-muted);\r\n      cursor: not-allowed;\r\n      box-shadow: none;\r\n    }\r\n    .disclaimer-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\r\n    /* Menyorot peta saat penafian terbuka. Penguncian gulirnya dilakukan di\r\n       JS (overflow body + padding untuk scrollbar); aturan ini supaya tidak\r\n       ada elemen lain yang ikut bergeser dan memberi kesan bisa diklik. */\r\n    body.disclaimer-modal-active { cursor: default; }\r\n    body.disclaimer-modal-active .disclaimer-modal { cursor: auto; }\r\n    .disclaimer-note {\r\n      margin: 0;\r\n      font-size: 10.5px; line-height: 1.5;\r\n      text-align: center; color: var(--text-muted);\r\n    }\r\n\r\n    @media (max-width: 600px) {\r\n      .disclaimer-modal { padding: 10px; }\r\n      .disclaimer-modal-dialog { max-height: min(94dvh, 760px); border-radius: 16px; }\r\n      .disclaimer-modal-header { padding: 20px 16px 14px; }\r\n      .disclaimer-modal-title { font-size: 17px; }\r\n      .disclaimer-modal-body { padding: 14px 16px; }\r\n      .disclaimer-modal-footer { padding: 12px 16px 14px; }\r\n      .disclaimer-btn { width: 100%; }\r\n    }\r\n    @media (prefers-reduced-motion: reduce) {\r\n      .disclaimer-modal.open,\r\n      .disclaimer-modal-dialog { animation: none; }\r\n    }\r\n\r\n\r\n    .hotspot-legend {\r\n      background: rgba(255,255,255,0.95);\r\n      border-radius: 8px;\r\n      padding: 10px 12px;\r\n      box-shadow: 0 2px 8px rgba(0,0,0,0.15);\r\n      border: 1px solid #e5e7eb;\r\n      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\r\n      min-width: 200px;\r\n    }\r\n\r\n    @media (max-width: 768px) {\r\n      .hotspot-legend-karhutla { display: none; }\r\n    }\r\n\r\n    .hotspot-legend-title {\r\n      font-size: 11px;\r\n      font-weight: 700;\r\n      color: #1e293b;\r\n      margin-bottom: 4px;\r\n    }\r\n\r\n    .hotspot-legend-total {\r\n      font-size: 10px;\r\n      color: #475569;\r\n      margin-bottom: 8px;\r\n    }\r\n\r\n    .hotspot-legend-items {\r\n      display: flex;\r\n      flex-direction: column;\r\n      gap: 4px;\r\n    }\r\n\r\n    .hotspot-legend-item {\r\n      display: flex;\r\n      align-items: center;\r\n      gap: 6px;\r\n      font-size: 10px;\r\n      color: #475569;\r\n    }\r\n\r\n    .hotspot-legend-dot {\r\n      width: 10px;\r\n      height: 10px;\r\n      border-radius: 50%;\r\n      flex-shrink: 0;\r\n      border: 1px solid rgba(0,0,0,0.1);\r\n    }\r\n\r\n    .hotspot-legend-source {\r\n      font-size: 8px;\r\n      color: #94a3b8;\r\n      margin-top: 8px;\r\n      font-style: italic;\r\n    }\r\n\r\n    .hotspot-legend-gradient {\r\n      margin-bottom: 8px;\r\n    }\r\n\r\n    .hotspot-legend-bar {\r\n      height: 8px;\r\n      border-radius: 4px;\r\n      background: linear-gradient(90deg, #22c55e 0%, #84cc16 25%, #f59e0b 50%, #ef4444 75%, #dc2626 100%);\r\n      margin-bottom: 3px;\r\n    }\r\n\r\n    .hotspot-legend-labels {\r\n      display: flex;\r\n      justify-content: space-between;\r\n      font-size: 8px;\r\n      color: #94a3b8;\r\n    }\r\n\r\n    .hotspot-popup .leaflet-popup-content-wrapper {\r\n      border-radius: 10px;\r\n      box-shadow: 0 4px 16px rgba(0,0,0,0.15);\r\n    }\r\n\r\n    .hotspot-popup .leaflet-popup-content {\r\n      margin: 10px 12px;\r\n    }\r\ r\n    .fsva-legend {\r\n      background: rgba(255,255,255,.95);\r\n      border-radius: 8px;\r\n      padding: 10px 12px;\r\n      box-shadow: 0 2px 8px rgba(0,0,0,0.15);\r\n      border: 1px solid #e5e7eb;\r\n      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\r\n      min-width: 160px;\r\n      max-width: 240px;\r\n    }\r\n    .fsva-legend-title {\r\n      font-size: 11px;\r\n      font-weight: 700;\r\n      color: #1e293b;\r\n      margin-bottom: 6px;\r\n    }\r\n    .fsva-legend-img {\r\n      display: block;\r\n      max-width: 100%;\r\n      max-height: 120px;\r\n      margin-bottom: 4px;\r\n    }\r\n    .fsva-legend-source {\r\n      font-size: 10px;\r\n      color: #64748b;\r\n      text-align: center;\r\n      font-style: italic;\r\n    }\r\n    .unified-legend-section .fsva-legend {\r\n      background: transparent;\r\n      border: none;\r\n      box-shadow: none;\r\n      padding: 4px 0;\r\n      min-width: auto;\r\n      max-width: none;\r\n    }\r\n    .unified-legend-section .fsva-legend-title {\r\n      font-size: 11px;\r\n      color: #e2e8f0;\r\n    }\r\n    .unified-legend-section .fsva-legend-source {\r\n      font-size: 9px;\r\n      color: #64748b;\r\n    }\r\n    .unified-legend-section .fsva-legend-img {\r\n      max-height: 200px;\r\n    }\r\n\r\n    /* ── FSVA 2025 Popup ── */\r\n    .fsva-leaflet-popup .leaflet-popup-content-wrapper {\r\n      border-radius: 12px;\r\n      box-shadow: 0 6px 24px rgba(0,0,0,0.12);\r\n      padding: 0;\r\n      max-height: 37vh;\r\n      overflow: hidden;\r\n      border: none;\r\n    }\r\n    .fsva-leaflet-popup .leaflet-popup-content {\r\n      margin: 0;\r\n      min-width: 300px;\r\n      max-width: 360px;\r\n      max-height: 37vh;\r\n      overflow-y: auto;\r\n      width: auto !important;\r\n    }\r\n    .fsva-popup {\r\n      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\r\n    }\r\n    .fsva-popup-header {\r\n      background: li
