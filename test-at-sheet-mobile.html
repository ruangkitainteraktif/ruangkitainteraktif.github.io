<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harness tinggi sheet tabel atribut (mobile)</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    /* Tiru struktur halaman: peta + sheet tabel. */
    #app-container { position: relative; height: 100dvh; display: flex; flex-direction: column; }
    #map { flex: 1 1 auto; min-height: 0; }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="map"></div>

    <!-- ATTRIBUTE TABLE BOTTOM SHEET (salinan dari index.html) -->
    <div id="attr-table-sheet">
      <div class="at-sheet-handle" onclick="toggleAttrTableSheet()"></div>
      <div class="at-sheet-head">
        <div class="at-sheet-title">
          <span id="atSheetTitleText">Tabel</span>
        </div>
        <div class="at-sheet-actions">
          <button id="atSheetBackBtn" class="at-sheet-back" type="button" style="display:none" onclick="openAttrTablePicker()">&#8249;</button>
          <button class="at-sheet-minimize" type="button" onclick="minimizeAttrTableSheet()">-</button>
          <button class="at-sheet-close" type="button" onclick="closeAttrTableSheet()">x</button>
        </div>
      </div>
      <div class="at-sheet-body">
        <div id="at-sheet-content"></div>
      </div>
    </div>
  </div>

  <div id="out"></div>

  <script src="assets/js/sheet-drag.js"></script>
  <script src="assets/js/attribute-table.js"></script>
  <script>
    /* Stub peta & data BMKG: harness hanya mengukur tinggi sheet. */
    (function () {
      var layers = [];
      window.map = {
        removeLayer: function (l) { var i = layers.indexOf(l); if (i >= 0) layers.splice(i, 1); return this; },
        addLayer: function (l) { layers.push(l); return this; },
        hasLayer: function (l) { return layers.indexOf(l) >= 0; },
        on: function () {}, off: function () {},
        getCenter: function () { return { lat: -2, lng: 118 }; },
        getZoom: function () { return 5; },
        getSize: function () { return { x: window.innerWidth, y: window.innerHeight }; },
        flyTo: function () {}, flyToBounds: function () {},
        invalidateSize: function () {}, panBy: function () {}
      };
      window.L = {
        circleMarker: function () {
          return { addTo: function () { return this; }, remove: function () {}, setStyle: function () { return this; } };
        }
      };
      window.adsbygoogle = { push: function () {} };

      var gempa = function (i) {
        return {
          Tanggal: '09-Oct-2026', Jam: '10:2' + i + ':00 WIB', Magnitude: '5.' + i,
          Kedalaman: '10 km', Wilayah: 'Wilayah uji ' + i, Potensi: 'Tidak berpotensi tsunami',
          Dirasakan: '-', Coordinates: (-2 + i * 0.1) + ',' + (118 + i * 0.1)
        };
      };
      var significant = [], felt = [];
      for (var i = 0; i < 15; i++) { significant.push(gempa(i)); felt.push(gempa(i)); }
      window.earthquakeSignificantData = significant;
      window.earthquakeFeltData = felt;
      window.earthquakeLatestData = gempa(0);
      window.ensureEarthquakeData = function () {
        return Promise.resolve({ latest: gempa(0), significant: significant, felt: felt });
      };
    })();
  </script>
  <script>
    /* ── Pengukuran ──
       Bug asli: skrip iklan menulis `height: auto !important` DAN
       `min-height: 0 !important` ke sheet (leluhur fixed terdekat slot
       iklan), sehingga sheet membuka setinggi isi tabel -- layar penuh di
       ponsel. Di siri ini tulisan itu ditiru persis, lalu tinggi sheet
       diukur setelah sheet-drag.js sempat membersihkannya. */
    window.addEventListener('error', function (e) {
      document.getElementById('out').textContent += 'ERROR: ' + e.message + '\n';
    });
    (function () {
      var lulus = 0, gagal = 0, baris = [];
      var sheet = document.getElementById('attr-table-sheet');

      /* Tiruan show_ads_impl.js: kedua properti inline DAN !important. */
      function tulisIklan() {
        sheet.style.setProperty('height', 'auto', 'important');
        sheet.style.setProperty('min-height', '0px', 'important');
      }

      function ukur(label, harapan) {
        var rect = sheet.getBoundingClientRect();
        var rasio = rect.height / window.innerHeight;
        var sisa = sheet.style.getPropertyValue('height') || sheet.style.getPropertyValue('min-height');
        var oke = Math.abs(rasio - harapan) < 0.03 && !sisa;
        if (oke) { lulus++; baris.push('  ok   ' + label + ' rasio=' + rasio.toFixed(2)); }
        else {
          gagal++;
          baris.push('  FAIL ' + label + ' rasio=' + rasio.toFixed(2) + ' (harapan ' + harapan + ')' +
            ' sisaInline=' + JSON.stringify(sheet.getAttribute('style')));
        }
      }

      function jalankan(id, harapan) {
        return new Promise(function (resolve) {
          window.openAttrTableForLayer(id);
          setTimeout(function () {
            tulisIklan();
            setTimeout(function () {
              ukur(id, harapan);
              window.closeAttrTableSheet();
              setTimeout(resolve, 150);
            }, 350);
          }, 450);
        });
      }

      var rangkaian = Promise.resolve()
        .then(function () { return jalankan('toggleSignificantMarkers', 0.5); })
        .then(function () { return jalankan('toggleFeltMarkers', 0.5); })
        .then(function () { return jalankan('toggleLatestEarthquake', 0.5); })
        .then(function () { return jalankan('toggleTollRoad', 0.5); })
        .then(function () { return jalankan('toggleHillshade', 0.5); })
        .then(function () { return jalankan('toggleJenisTanahJateng', 0.76); });

      rangkaian.then(function () {
        var sheetH = sheet.style.getPropertyValue('--sheet-h');
        if (!sheetH) { lulus++; baris.push('  ok   custom property --sheet-h tidak dirusak'); }
        else { gagal++; baris.push('  FAIL --sheet-h tertimpa: ' + sheetH); }

        document.getElementById('out').textContent =
          (window.innerWidth <= 768 ? 'VIEWPORT=' + window.innerHeight + 'x' + window.innerWidth + '\n' : 'VIEWPORT LEBIH 768px\n') +
          baris.join('\n') +
          '\n=== ' + lulus + ' lulus, ' + gagal + ' gagal ===';
      });
    })();
  </script>
</body>
</html>
